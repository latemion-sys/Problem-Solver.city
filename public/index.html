      : c.t==="tnot" ? spots.every((_,si)=>!hasT(perm[si],c.ta) || !hasS(si,c.sa)) : c.t==="tall" ? spots.every((_,si)=>!hasT(perm[si],c.ta) || hasS(si,c.sa))

    const cand = pool.filter(c=>c.t!=="is").sort(()=>Math.random()-0.5);

    const m = mgOpen("호위 · 길 위의 경계", `${esc(q.text)}<br>구간마다 생기는 일에 대처하며 목적지까지 간다. <b>경계</b>가 낮을수록 매복을 당하기 쉽고, 매복은 합 전투가 된다. 의뢰인의 <b>안전</b>이 바닥나거나 전투에서 지면 실패.`, ctx, 220);
    const G = {seg:0, al: clamp(Math.round(60 + (k-1)*40), 40, 90), safe:100, amb:0, done:false, log:[], fights:[], ev:null, walk:0}; if(FXTEST) window.__es = G;

        <div class="muted" style="font-size:12px;margin-top:4px">${G.log.slice(-3).map(esc).join("<br>")}</div>`;
      m.ctrl.innerHTML = G.ev && !G.done ? `<div class="es-card"><p>${esc(G.ev.t)}</p><div class="pk-moves">${G.ev.o.map((o,i)=>`<button data-es="${i}"><b>${esc(o[0])}</b></button>`).join("")}</div></div>` : "";
    };
    const finish = win => { if(G.done) return; G.done = true; ui();
      const sc = win ? clamp(0.5 + G.safe/200, 0, 1) : 0.15;
      setTimeout(()=>{ cancelAnimationFrame(raf); mgResult(m, sc, win ? (G.safe>=70 ? "무사히 데려다주었다" : "다치게 했지만 데려다주었다") : "의뢰인을 지키지 못했다").then(()=>{
        const last = G.fights[G.fights.length-1];
        if(last){ G.fights.forEach(fr=>fr.battle.forEach(b=>{ const o = last.battle.find(x=>x.f===b.f); if(o && b.wound > o.wound) o.wound = b.wound; if(o && b.fought) o.fought = true; })); }
        resolve({win, score: sc, combat: last || null}); }); }, 700); };
    async function ambush(why){
      G.log.push(why); ui();
      m.bg.style.visibility = "hidden";
      const fq = {kind:"일반", goal:"제압", grade:q.grade, attrs:["str"], req:q.req, client:q.client, foe: escFoe(q), text:`매복 — ${q.text}`};
      const r = await mgCombat({q:fq, team:ctx.team, idx:ctx.idx, total:ctx.total});
      m.bg.style.visibility = "";
      G.fights.push(r);
      if(!r.win){ G.log.push("매복에 밀렸다. 의뢰인을 빼앗겼다."); finish(false); return false; }
      G.al = clamp(G.al + 10, 0, 100); G.safe = clamp(G.safe - 6, 0, 100); G.log.push("매복을 물리쳤다."); ui(); return true;
    }
    async function next(){
      if(G.done) return;
      if(G.seg >= SEG){ G.log.push("목적지에 닿았다."); finish(G.safe > 0); return; }
      G.walk = performance.now();
      setTimeout(async ()=>{
        if(G.done) return;
        G.al = clamp(G.al - 6, 0, 100);
        const p = clamp(baseAmb + G.amb + (50 - G.al)/120, 0.02, 0.85); G.amb = 0;
        if(Math.random() < p && !(await ambush(`${G.seg+1}구간 — 매복이다!`))) return;
        G.ev = deck[G.seg % deck.length]; ui();
      }, 900);
    }
    m.ctrl.addEventListener("click", async e=>{ const b = e.target.closest("[data-es]"); if(!b || G.done || !G.ev) return;
      const [lab, ef] = G.ev.o[+b.dataset.es]; G.ev = null; G.log.push(`${G.seg+1}구간 — ${lab}`);
      G.al = clamp(G.al + (ef.al||0), 0, 100); G.safe = clamp(G.safe + (ef.safe||0), 0, 100); G.amb += ef.amb||0;
      if(ef.crew && ctx.team.length<2){ G.safe = clamp(G.safe - 8, 0, 100); G.log.push("맡길 동료가 없었다."); }
      ui();
      if(ef.fight && Math.random() < ef.fight && !(await ambush("상대가 칼을 뽑았다!"))) return;
      if(G.safe <= 0){ G.log.push("의뢰인이 크게 다쳤다."); finish(false); return; }
      G.seg++; next(); });
    m.quit.onclick = ()=>{ if(G.done) return; G.done = true; cancelAnimationFrame(raf); m.close(); resolve({win:false, score:0}); };
    const t0 = performance.now();
    function draw(){
      const c = m.c, now = performance.now(), t = (now-t0)/1000, W = 720, H = 220;
      let g = c.createLinearGradient(0,0,0,H); g.addColorStop(0,"#14131b"); g.addColorStop(1,"#0b0a0e"); c.fillStyle = g; c.fillRect(0,0,W,H);
      const x0 = 70, x1 = 650, y = 150, sx = i => x0 + (x1-x0)*i/SEG;
      // 뒷골목 건물과 가로등
      for(let i=0;i<10;i++){ const bx = i*76 - 8, bh = 70 + (i*41%55); c.fillStyle = i%2 ? "#1b1922" : "#1f1c27"; c.fillRect(bx, y-30-bh, 74, bh);
        c.fillStyle = "rgba(255,210,140,0.06)"; for(let j=0;j<3;j++) if((i+j)%3) c.fillRect(bx+10+j*20, y-20-bh+12, 9, 12); }
      c.fillStyle = "#111016"; c.fillRect(0, y-30, W, H-y+30); c.strokeStyle = "rgba(255,255,255,0.05)"; c.beginPath(); c.moveTo(0,y+12); c.lineTo(W,y+12); c.stroke();
      for(let i=0;i<=SEG;i++){ const lx = sx(i) + 18, lit = i <= G.seg + 1; c.strokeStyle = "#2e2a36"; c.lineWidth = 2; c.beginPath(); c.moveTo(lx, y-2); c.lineTo(lx, y-62); c.lineTo(lx-8, y-66); c.stroke();
        if(lit){ c.save(); c.globalCompositeOperation = "lighter"; const lg = c.createRadialGradient(lx-8, y-62, 0, lx-8, y-62, 46); lg.addColorStop(0, `rgba(255,200,120,${0.22 + 0.04*Math.sin(t*3+i)})`); lg.addColorStop(1, "rgba(0,0,0,0)"); c.fillStyle = lg; c.fillRect(lx-60, y-110, 100, 110); c.restore(); } }
      c.strokeStyle = "rgba(200,190,170,0.25)"; c.lineWidth = 3; c.setLineDash([8,8]); c.beginPath(); c.moveTo(x0,y); c.lineTo(x1,y); c.stroke(); c.setLineDash([]);
      for(let i=0;i<=SEG;i++){ const done = i <= G.seg; c.fillStyle = i===SEG ? "#e8d39a" : done ? "#9fe8b0" : "#3a3644"; c.beginPath(); c.arc(sx(i), y, i===SEG ? 9 : 6, 0, 7); c.fill(); }
      c.fillStyle = "#cfc8bb"; c.font = `600 11px "Noto Sans KR",sans-serif`; c.textAlign = "center"; c.fillText("출발", x0, y+28); c.fillText("목적지", x1, y+28);
      const wk = G.walk ? clamp((now-G.walk)/900, 0, 1) : 1, px = G.seg===0 ? x0 : sx(G.seg - 1 + wk), bob = wk<1 ? Math.abs(Math.sin(t*10))*2 : 0;
      fig(c, px - 10, y - 4 - bob, 40, {side:"ally", face:1});
      fig(c, px + 10, y - 4 - bob, 36, {side:"friend", face:1});
      // 경계: 일행을 감싸는 빛의 고리
      c.save(); c.globalCompositeOperation = "lighter"; const ar = 26 + G.al*0.35; const rg = c.createRadialGradient(px, y-24, ar*0.3, px, y-24, ar);
      rg.addColorStop(0, "rgba(0,0,0,0)"); rg.addColorStop(0.85, `rgba(120,200,255,${0.05 + G.al/700})`); rg.addColorStop(1, "rgba(0,0,0,0)"); c.fillStyle = rg; c.beginPath(); c.arc(px, y-24, ar, 0, 7); c.fill(); c.restore();
      vignette(c, W, H, "rgba(0,0,0,0.5)");
      raf = requestAnimationFrame(draw);
    }
    ui(); raf = requestAnimationFrame(draw); next();
  });
}

/* ================= 출동 ================= */
async function dispatch(qid, fids){
  const q = S.requests.find(x=>x.id===qid);
  const team = fids.map(id=>S.fixers.find(x=>x.id===id)).filter(f=>f && canGo(f));
  if(!q || !team.length || team.length>partyMax(q)) return;
  const mental = isMental(q);
  const risky = team.filter(f=>{ const lh=level(f.hp,f.hpMax)[1], lm=level(f.mp,f.mpMax)[1]; return lh==="d" || (mental && lm==="d"); });
  if(risky.length){
    const ok = await confirmBox("위험 상태", `${risky.map(f=>esc(f.name)).join(", ")}의 상태가 위험 단계다. 그래도 보내겠는가?`);
    if(!ok) return;
  }
  // 출동 방식: 직접 수행(기본-25%p에서 미니게임으로 최대 +25%p) / 자동 진행(기본 성공률, 보수 80%)
  const hasGame = q.attrs.some(a=>a!=="wil");
  let mode = "auto";
  if(hasGame){ mode = await chooseMode(q, team); if(!mode) return; }
  team.forEach(f=>f.lastDispatch = S.day);
  const base = rate(team,q); let pr = base, payMul = 1, mgLine = "", combat = null;
  let decisive = null;
  if(mode==="play"){ const r = await runMinigames(q, team); combat = r.combat;
    if(r.decisive!=null){ decisive = r.decisive; mgLine = `직접 수행 ${decisive ? "성공" : "실패"}`; }
    else if(r.lostDecisive){ decisive = false; mgLine = "직접 수행 실패"; }
    else { pr = clamp(Math.round(base - 25 + 25*r.score), 3, 97); mgLine = `미니게임 ${Math.round(r.score*100)}점 · 성공률 ${base}% → <b>${pr}%</b>`; } }
  else { pr = autoRate(team, q); if(hasGame) payMul = 0.8; mgLine = `자동 진행 · 해결사 등급 판정 · 성공률 ${pr}%${hasGame?" · 보수 80%":""}`; }
  const pay = Math.round(q.reward*payMul/100)*100;
  // 합 전투를 직접 했으면 전투 승패가 곧 의뢰 성패. 아니면 성공률로 굴린다
  const success = decisive!=null ? decisive : Math.random()*100 < pr;
  const k = dmgFactor(team,q)*shareMul(team.length);
  const names = team.map(f=>f.name).join(", ");
  let lines = [ ...(mgLine?[mgLine]:[]), decisive!=null ? `${team.length}명 출동 → <b>${success?"성공":"실패"}</b>` : `${team.length}명 출동 · 성공률 ${pr}% → <b>${success?"성공":"실패"}</b>`];
  // 의뢰가 끝나면 체력(정신 의뢰는 정신력)이 최대치의 일정 비율만큼 깎인다.
  // 성공: 부상 단계에 따라 10~25% · 실패: 35~60%. 직접 싸운 사람은 전투 끝의 부상 단계, 아니면 무작위
  const W_NAME = ["안정","경상","중상","치명상"], LOSS = {ok:[10,15,20,25], fail:[35,43,52,60]};
  team.forEach(f=>{
    const b = combat && combat.battle.find(x=>x.f===f), w = b && b.fought ? b.wound : combat ? 0 : (success ? 0 : autoWound(f));   // 자동 진행: 성공 = 안정, 실패 = 등급별 부상
    // 감소량은 항상 최대치의 정수 %: 방어구로 줄어든 비율의 소수점은 버린다(16.8% → 16%), 깎이는 양도 소수점을 버린다
    const red = mental ? redMP(f) : redHP(f), pct = Math.floor((success ? LOSS.ok : LOSS.fail)[w] * (1 - red*0.5));
    const main = Math.floor((mental ? f.mpMax : f.hpMax) * pct/100);
    const spPct = b && b.fought && b.sp < 0 ? Math.floor(-b.sp*0.4) : 0;     // 전투 끝에 정신력(SP)이 무너져 있었으면 정신력도 정수 %만큼 깎인다
    let dH = mental ? 0 : main, dM = mental ? main : 0;
    if(spPct) dM += Math.floor(f.mpMax * spPct/100);
    f.hp = clamp(f.hp-dH, 0, f.hpMax); f.mp = clamp(f.mp-dM, 0, f.mpMax); f._w = w;
    lines.push(`${esc(f.name)}: ${W_NAME[w]} — ${mental?"정신력":"체력"} -${pct}%(${main})${spPct?` · 정신력 -${spPct}%`:""} → 체력 -${dH}, 정신력 -${dM}${b && b.fought ? " (직접 싸움)" : combat ? " (거듦)" : ""}`);
  });
  // 무기 내구도: 실제로 들고 나간 무기만 1씩 닳는다(E.G.O.·고유 무기·수리가 필요한 무기는 빼고)
  team.forEach(f=>{ const g = f.gear.weapon; if(!isWornable(g) || !g.durMax || needsRepair(g) || wGear(f)!==g) return;
    g.dur = Math.max(0, g.dur-1); g.uses = (g.uses||0) + 1;
    lines.push(`${esc(f.name)}의 ${esc(g.name)}: 내구도 ${g.dur}/${g.durMax}${needsRepair(g) ? (g.durMax<=1 ? " — <b>더는 고칠 수 없다</b>" : " — <b>수리가 필요하다</b>(관리)") : ""}`); });
  S.requests = S.requests.filter(x=>x.id!==qid || (!success && q.kind==="뒤틀림 토벌"));
  if(success){
    S.money += pay; S.todayIncome += pay;
    lines.push(`보수 +${won(pay)}`);
    if(q.grade===S.officeGrade) S.reviewSuccess++;
    team.forEach(f=>{
      f.done++;
      if(q.grade===0 && f.grade===1) f.starCleared = true;
      // 경험: 관련 능력치 +1, 2회마다 능력치 +1, 상위 등급 의뢰는 2배
      const gain = (q.grade < f.grade || (q.grade===0 && f.grade>0)) ? 2 : 1;
      q.attrs.forEach(a=>{
        f.exp[a] += gain;
        while(f.exp[a]>=2){ f.exp[a]-=2; if(f.stats[a]<f.cap){ f.stats[a]++; lines.push(`${esc(f.name)} ${ATTR_NAME[a]} +1 (${f.stats[a]})`);} }
      });
    });
    if(q.loot){ lines.push(`전리품: <b>${esc(q.loot.name)}</b> 획득(관리에서 장착)`); S.inventory = S.inventory||[]; S.inventory.push(q.loot); }
    if(q.kind==="특색 심사") await passColor(team[0]);
  } else {
    lines.push(q.kind==="뒤틀림 토벌" ? "토벌에 실패했다. 뒤틀림은 아직 남아 있다." : "의뢰는 다른 곳으로 넘어갔다.");
    if(q.kind==="특색 심사"){ team[0].unavailUntil = S.day+2; lines.push("심사 실패. 2일간 출동할 수 없다."); }
  }
  await playScene(q.kind, {attr:q.attrs[0], success, team:team.map(f=>f.name), lead:leadGear(team[0]), client:q.client, grade:q.grade, risk:q.risk, hazard:q.hazard});
  playFx(q.kind, `${q.kind} — ${success?"성공":"실패"}`, `${names} · ${q.client}`, success);
  addLog(`[${q.kind}] ${names}: ${q.text} → ${success?"성공":"실패"}${success?" (+"+won(pay)+")":""}${mode==="play"?" · 직접 수행":hasGame?" · 자동":""}`);
  await modal(`${q.kind} 결과`, `<div class="muted">${esc(q.client)} — ${esc(q.text)}</div><p>${lines.join("<br>")}</p>`, [{t:"확인",primary:true}]);
  team.forEach(f=>{ const L = f.life = f.life || {}, inc = k => L[k] = (L[k]||0) + 1;
    if(success){ if(q.kind==="호위") inc("escort"); else if(q.kind==="수색") inc("search"); else if(q.kind==="환상체") inc("abno"); else if(q.kind==="뒤틀림 토벌") inc("hunt");
      else if(q.attrs[0]==="agi") inc("chase"); else if(q.attrs[0]==="tec") inc("search"); }
    const oc = combat && combat.outcome ? combat.outcome : success && q.attrs[0]==="str" && q.kind==="일반" ? q.goal : null;
    if(oc==="사살") inc("kill"); else if(oc==="제압") inc("spare");
    f.diary = (f.diary||[]).concat([`${S.day}일차 [${q.kind}] ${q.text} — ${success ? "성공" : "실패"}${oc ? `(${oc})` : ""}${team.length>1 ? `, ${team.length}명이 함께` : ", 혼자"}${(f._w||0)>=2 ? `, ${["안정","경상","중상","치명상"][f._w]}으로 돌아옴` : ""}`]).slice(-20);
    if(!success) inc("fail"); if((f._w||0) >= 2) inc("heavy"); if(team.length===1) inc("solo"); else if(team.length>=3) inc("crew"); });
  for(const f of team){ if(!S || S.over) break; if(S.fixers.includes(f)) await checkUpgrade(f); }
  team.forEach(f=>{ if(S.fixers.includes(f)) lossFromRequest(f, f._w||0, success); });
  await flushLoss();
  for(const f of team){ if(!S || S.over) break; if(S.fixers.includes(f)) await checkCollapse(f); }
  await flushLoss();
  for(const f of team){ if(!S || S.over) break; if(S.fixers.includes(f)) await checkShin(f); }
  if(S && !S.over) team.forEach(f=>{ if(S.fixers.includes(f)) checkOmen(f); });
  if(!S) return;
  delete teamSel[qid];
  save(); render();
  if(S && !S.over) await maybeEndDay();
}

async function checkCollapse(f){
  if(f.hp<=0){
    if(f.isLeader){ return gameOver("대표 사망", `${esc(f.name)}이(가) 숨을 거두었다. 사무소는 그날로 문을 닫았다.`); }
    removeFixer(f, "사망", "체력 소진으로 사망");
    playFx("사망", "사망", f.name, false);
    await modal("사망", `${esc(f.name)}이(가) 돌아오지 못했다. 사무소 인사 기록에 이름이 남는다.`, [{t:"확인"}]);
    return;
  }
  if(f.mp<=0){
    if(f.ego){
      if(Math.random() < EGO_TWIST_P(f.ego)){ if(f.isLeader) return twistLeader(f); await twistFixer(f); return; }
      f.mp = Math.round(f.mpMax*0.25); f.unavailUntil = S.day+1;
      await modal("기절", `${esc(f.name)}은(는) E.G.O. 사용 후유증으로 쓰러졌다. 다음 날 출동할 수 없다.`, [{t:"확인"}]);
      return;
    }
    const r = Math.random()*100;
    if(r<45){
      if(f.isLeader) return gameOver("대표 사망", `${esc(f.name)}의 정신이 끝내 버티지 못했다.`);
      removeFixer(f,"사망","정신력 소진으로 사망");
      await modal("사망", `${esc(f.name)}의 정신이 무너졌고, 다시 눈을 뜨지 않았다.`, [{t:"확인"}]);
    } else if(r<75){
      if(f.precious && f.precious.lost){
        if(f.isLeader) return twistLeader(f);
        await twistFixer(f);
      } else {
        // 잃은 것이 없으면 목소리가 붙잡을 곳이 없다 — 쓰러질 뿐
        f.mp = Math.round(f.mpMax*0.15); f.unavailUntil = S.day+1;
        await modal("기절", `${esc(f.name)}의 귓가에 다정한 목소리가 맴돌았다. 하지만 ${esc(josa(f.name,"은","는"))} 아직 ${esc(josa(f.precious ? f.precious.text : "간직한 것","을","를"))} 붙들고 있었다.<br>정신을 잃고 쓰러졌다. 다음 날 출동할 수 없다.`, [{t:"확인"}]);
      }
    } else {
      await bloomEgo(f);
    }
  }
}
/* ================= E.G.O 개화 · 뒤틀림 연출 =================

    S.fixers.forEach(f=>{ if(!f.isLeader) f.mp = Math.max(1, f.mp - Math.round(f.mpMax*0.15)); });
    html += `<p style="color:var(--red)">토벌 기한이 지났다. ${distortExpired.map(q=>esc(q.distorted)).join(", ")}의 뒤틀림은 다른 해결사 사무소가 처리했다. 대표를 제외한 모든 해결사의 정신력이 15% 줄었다.</p>`;
  }
  await modal(`${ended}일차 정산`, html, [{t:"다음으로",primary:true}]);
  if(ended%14===0) await review();
  if(ended%7===0 && S.debt>0) { await scarVisit(); if(!S||S.over) return; }
  if(ended%7===0) await weekly();
  S.day++;
  startDay(false);
  save(); render();
  playFx("아침", `${S.day}일차`, `의뢰 ${S.requests.length}건이 게시판에 올라왔다.`, true);
  S.fixers.forEach(lossByDay); await flushLoss();
  for(const f of S.fixers.slice()){ if(!S || S.over) break; await checkShin(f); }
  if(S && !S.over) S.fixers.forEach(checkOmen);
}
async function weekly(){

function scarDue(){ return Math.min(S.debt, Math.max(Math.floor(S.money*0.35), 10000)); }
async function scarVisit(){
  let html;
  playFx("흉터", "남겨진 흉터", "수금하러 왔다.", false);
  const due = scarDue(), paid = S.paidThisWeek||0;
  if(paid >= due){
    html = `<p>[남겨진 흉터]가 사무소 문을 열고 들어왔다. 장부를 넘겨 이번 주 상환 내역을 확인하더니, 아무것도 건드리지 않고 돌아갔다.</p><div class="kv"><span>이번 주 상환</span><b>${won(paid)}</b><span>최소 수금액</span><b>${won(due)}</b><span>남은 빚</span><b>${won(S.debt)}</b></div>`;
  } else if(S.money<=10000){
    S.scars++;
    html = `<p>[남겨진 흉터]가 사무소 문을 열고 들어왔다. 금고를 들여다보고는 아무 말 없이 손을 뻗었다.</p><p style="color:var(--red)">흉터가 새겨졌다. (${S.scars} / 3)</p>`;
    if(S.scars>=3){ await modal("남겨진 흉터", html, [{t:"..."}]); return gameOver("세 번째 흉터", "세 번째 흉터가 새겨졌다. 사무소의 이름은 장부에서 지워졌다."); }
  } else {
    const take = Math.min(due - paid, S.money, S.debt);
    S.money -= take; S.debt -= take;
    html = `<p>[남겨진 흉터]가 사무소 문을 열고 들어왔다. ${paid>0?"이번 주에 갚은 돈을 빼고, ":""}모자란 만큼을 금고에서 세어 챙긴다.</p><div class="kv"><span>최소 수금액</span><b>${won(due)}</b>${paid>0?`<span>이번 주 상환</span><b>${won(paid)}</b>`:""}<span>수금액</span><b>${won(take)}</b><span>남은 빚</span><b>${won(S.debt)}</b><span>보유 자금</span><b>${won(S.money)}</b></div>`;
    if(S.debt<=0) html += `<p style="color:var(--accent)">마지막 수금이었다. 흉터는 장부를 덮고 돌아갔다. 빚을 모두 갚았다.</p>`;
  }
  S.paidThisWeek = 0;
  addLog(`남겨진 흉터 방문. 남은 빚 ${won(S.debt)}, 흉터 ${S.scars}/3`);
  await modal("남겨진 흉터", html, [{t:"확인",primary:true}]);
  await checkRepaid();
}
async function checkRepaid(){

async function openRepay(){
  if(S.debt<=0) return alertBox("상환", "갚을 빚이 남아 있지 않다.");
  let amt = 0;
  const unitMax = () => Math.floor(Math.min(S.money, S.debt)/10000)*10000;
  const draw = () => {
    const due = scarDue(), paid = S.paidThisWeek||0, left = Math.max(0, due-paid), nv = 7 - ((S.day-1)%7) - 1;
    return `<div class="kv">
      <span>보유 자금</span><b>${won(S.money)}</b>
      <span>남은 빚</span><b>${won(S.debt)}</b>
      <span>이번 주 상환</span><b>${won(paid)}</b>
      <span>흉터 방문</span><b>${nv===0?"오늘 밤":nv+"일 뒤"} · 지금 기준 최소 수금액 ${won(due)} ${left>0?`<span class="muted">(모자란 ${won(left)}은 흉터가 걷어 간다)</span>`:`<span style="color:var(--green)">(이번 주는 걷어 가지 않는다)</span>`}</b>
    </div>
    <p class="muted" style="font-size:12px;margin:10px 0 6px">상환은 1만 안 단위로 언제든 할 수 있다. 그 주에 갚은 돈이 최소 수금액 이상이면 흉터는 걷어 가지 않는다.</p>
    <div class="repay"><div class="amt">${won(amt)}</div>
      <div class="steps">${[[-1000000,"-100만"],[-100000,"-10만"],[-10000,"-1만"],[10000,"+1만"],[100000,"+10만"],[1000000,"+100만"]].map(([v,t])=>`<button data-step="${v}">${t}</button>`).join("")}
      <button data-step="max">최대</button><button data-step="due">최소 수금분</button></div>
      <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:10px">
        ${S.money>=S.debt?`<button data-pay="all">전액 상환 (${won(S.debt)})</button>`:""}
        <button class="primary" data-pay="amt" ${amt<=0?"disabled":""}>${won(amt)} 상환</button></div></div>`;
  };
  await modal("상환", `<div id="rp">${draw()}</div>`, [{t:"닫기"}], false, root=>{
    const box = root.querySelector("#rp");
    root.addEventListener("click", async e=>{
      const st = e.target.dataset.step, py = e.target.dataset.pay;
      if(st){
        const mx = unitMax();
        if(st==="max") amt = mx;
        else if(st==="due") amt = Math.min(mx, Math.ceil(Math.max(0, scarDue()-(S.paidThisWeek||0))/10000)*10000);
        else amt = clamp(amt + (+st), 0, mx);
      } else if(py){
        const pay = py==="all" ? S.debt : amt;
        if(pay<=0 || pay>S.money || pay>S.debt) return;
        S.money -= pay; S.debt -= pay; S.paidThisWeek = (S.paidThisWeek||0) + pay; amt = 0;
        addLog(`빚 ${won(pay)}을 상환했다. 남은 빚 ${won(S.debt)}`);
        save(); render();
        if(S.debt<=0){ closeAll(); await checkRepaid(); save(); render(); return; }
      } else return;
      box.innerHTML = draw();
    });
  });
}
async function review(){
  const lines = [];
  S.fixers.forEach(f=>{
    if(f.grade>=2 && total(f)>=PROMO[f.grade]){
      f.grade--; f.hpMax+=10; f.mpMax+=10; f.hp+=10; f.mp+=10;
      lines.push(`${esc(f.name)}: ${gName(f.grade+1)} → <b>${gName(f.grade)}</b>`);
      S.records.push({day:S.day,name:f.name,what:"승급",note:gName(f.grade)});
    }
  });
  // 특색 심사 지명
  S.fixers.forEach(f=>{
    if(f.grade===1 && total(f)>COLOR_REQ_TOTAL && f.starCleared && !S.requests.some(q=>q.kind==="특색 심사"&&q.target===f.id) && Math.random()<0.3){
      const a = pick(ATTRS), b = pick(ATTRS.filter(x=>x!==a));
      S.requests.unshift({id:S.nextId++, kind:"특색 심사", attrs:[a,b], grade:0, threat:"도시의 별", risk:null, client:"하나 협회",
        text:`${f.name}에 대한 특색 심사. 홀로 출동해야 한다.`, reward:REQ_BASE[0][0], req:79, deadline:null, loot:null, special:true, target:f.id});
      lines.push(`${esc(f.name)}: <b>특색 심사 지명</b>을 받았다.`);
    }
  });
  // 사무소
  const L = leader(), target = S.officeGrade-1;
  let off = "";
  if(S.officeGrade>1){
    const needOk = L && L.grade<=target && L.grade!==null;
    const doneOk = S.reviewSuccess>=10;
    if(needOk && doneOk){ S.officeGrade--; off = `<p style="color:var(--accent)">사무소가 <b>${gName(S.officeGrade)} 사무소</b>로 승급했다.</p>`; S.records.push({day:S.day,name:S.officeName,what:"사무소 승급",note:gName(S.officeGrade)}); }
    else off = `<p class="muted">사무소 승급 조건: 대표 ${gName(target)} 이상(${L?(L.grade<=target?"충족":"미충족"):"-"}), 지난 14일 ${gName(S.officeGrade)} 의뢰 성공 10건(${S.reviewSuccess}건).</p>`;
  }
  S.reviewSuccess = 0;
  playFx("심사", "하나 협회 등급 심사", lines.length?"결과가 나왔다.":"변동 없음", true);
  await modal("하나 협회 등급 심사", (lines.length? lines.join("<br>") : "<span class='muted'>승급한 해결사가 없다.</span>")+off, [{t:"확인",primary:true}]);
}

function genRecruits(){
  const og = S.officeGrade;
  const n = og>=8?2: og>=5?3:4;
  const top = Math.max(2, og-1);
  S.recruitPool = [];
  for(let i=0;i<n;i++){
    const g = rnd(top, 9);
    const f = newFixer(randomName(), g, genStats(g));
    f.hpMax = f.mpMax = 100 + (9-g)*10; f.hp=f.hpMax; f.mp=f.mpMax;
    f.cost = Math.round(HIRE_COST[g]*(0.9+Math.random()*0.2)/100)*100;
    f.precious = rollPrecious(f);
    S.recruitPool.push(f);
  }
}

      else if(d.egoforge && f){ await openForge(f, null, "ego"); }
      else if(d.sel){ sel=+d.sel; mview = null; }
      else if(d.heal && f){
        const hc = healCost(f), isH = d.heal.startsWith("hp"), all = d.heal.endsWith("all");
        const cur = isH?f.hp:f.mp, max = isH?f.hpMax:f.mpMax;
        let steps = all ? Math.ceil((max-cur)/10) : 1;
        steps = Math.min(steps, Math.floor(S.money/hc));
        if(steps<=0) return;
        S.money -= steps*hc;
        if(isH) f.hp = Math.min(max, f.hp+steps*10); else f.mp = Math.min(max, f.mp+steps*10);
      }
      else if(d.rename && f){ const nm = await promptBox("이름 변경", "새 이름", f.name, true); if(nm) f.name = nm; }
      else if(d.relook && f){ const L = Object.assign({}, f.look);
        const ok = await modal("대표 외형 변경", `<div id="rl">${lookFields(L)}</div>`, [{t:"취소",v:false},{t:"바꾸기",v:true,primary:true}], true, r=>bindLook(r.querySelector("#rl"), L));
        if(ok) f.look = L; }
      else if(d.equipinv!==undefined && f){ const i=+d.equipinv; const g=S.inventory[i]; const old=f.gear[g.slot]; f.gear[g.slot]=g; S.inventory.splice(i,1); if(old) S.inventory.push(old); }
      else if(d.fire && f){ if(await confirmBox("해고", `${esc(f.name)}을(를) 내보낸다. 되돌릴 수 없다.`)){ removeFixer(f,"해고","사무소를 떠남"); sel=S.fixers[0]?.id; } }
      else return;
      box.innerHTML = draw(); prev(); save(); render();
    });
  });
}
function gearDesc(g){
  const p=[]; if(g.bonus) Object.entries(g.bonus).forEach(([k,v])=>p.push(`${ATTR_NAME[k]}+${v}`));
  if(g.hpRed) p.push(`체력 피해 -${Math.round(g.hpRed*100)}%`); if(g.mpRed) p.push(`정신력 피해 -${Math.round(g.mpRed*100)}%`);
  if(g.slot==="weapon" && g.unique){ p.push("고유 무기 · 닳지 않음"); const w = wspOf(g); if(w) p.push(`[${w.n}] ${w.d}`); } else if(durText(g)) p.push(durText(g));
  return p.join(" · ");
}

// 미리보기: 캔버스 하나에 해결사 실루엣을 계속 그린다(캔버스가 화면에서 사라지면 멈춘다)
function animPreview(cv, getOpts){
  const c = cv.getContext("2d");
  const loop = ()=>{
    if(!cv.isConnected) return;
    const d = devicePixelRatio||1, W = cv.clientWidth||300, H = cv.clientHeight||200;
    if(cv.width !== Math.round(W*d)){ cv.width = Math.round(W*d); cv.height = Math.round(H*d); }
    c.setTransform(d,0,0,d,0,0);
    const g = c.createLinearGradient(0,0,0,H); g.addColorStop(0,"#15131c"); g.addColorStop(1,"#0a090d"); c.fillStyle = g; c.fillRect(0,0,W,H);
    const o = getOpts(), t = performance.now()/1000, gy = H*0.9;
    c.fillStyle = "rgba(255,255,255,0.05)"; c.beginPath(); c.ellipse(W/2, gy, W*0.3, H*0.05, 0, 0, 7); c.fill();
    let atk = null;
    if(o.state==="combat"){ const kd = o.weapon ? o.weapon.kind : "none", cat = (WEAPON_KINDS[kd]||{}).cat;
      const pool = kd==="gun" ? ["aim"] : kd==="staff" ? ["spin","smash"] : kd==="fist" || kd==="none" ? ["jab","upper"] : cat==="pierce" ? ["thrust"] : cat==="impact" ? ["smash","swing","upper"] : ["down","up","horiz","diag"];
      const cyc = Math.floor(t/1.8); atk = {style: pool[cyc % pool.length], ph: Math.min(3, atkPhase((t % 1.8) - 0.3, kd==="rapier" ? 3 : 1, timingOf(kd)))}; }
    drawFixer(c, W/2 - (o.state==="combat" ? H*0.08 : 0), gy, H*0.82, {face:1, col:SIDE_COL.ally.fill, state:o.state, weapon:o.weapon, armor:o.armor, atk, acc:o.acc});
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

/* ---- 고유 무기: 공방이 다시 벼려 준다 ----
   조건: 정식 공방 이상 무기 · 그 무기를 처음 받은 최대 내구도만큼 출동 · 해결사 4급 이상. 조건이 처음 갖춰지는 출동에서 한 번만 10%로 굴린다. */
const UPGRADE_P = 0.17, UPGRADE_STAT = [0, 3, 4];
/* 공방이 벼려 줄 때 붙여 주는 특수 능력(공방마다 하나). 원작에 무기의 작동이 적힌 공방은 그대로,
   적히지 않은 공방(올드 보이즈·젤코바·휠스·크리스탈·랑가·리플렛·아틀리에 로직)은 무기 생김새와 쓰임에서 끌어냈다.
   · 묵: 예(銳) 2식 발도 — 쌓일수록 베기 피해가 오르고 방어는 약해진다(림버스) · 스티그마: 가열·점화, 지워지지 않는 낙인(림버스·루이나 '화상 +1')
   · 네스터: 치는 순간 단추를 눌러 진동을 터뜨린다 · 로즈스패너: 진동(떨림)을 키우는 렌치·전기톱(림버스 진영)
   · 스크류: 전기로 강화한 드릴, 잘못 쓰면 자신도 감전 · 알라스: 손놀림을 다섯 배까지 빠르게 · 메즈틸: 알라스처럼 빠르지만 다루기 위험
   · 나미르: G사 특이점 '구체'로 무게를 바꿔 떠올랐다 내리꽂는다 · 클라우드: 흑운회의 칼(흑운도 — 베기 위력과 출혈) */

const wspOf = g => g && g.unique && g.wsp ? Object.values(WORKSHOP_SP).find(x=>x.id===g.wsp) || null : null;
async function checkUpgrade(f){
  const g = f.gear.weapon;
  if(!isWornable(g) || !g.durMax || (g.tier||0) < 1 || g.rolled || (g.uses||0) < (g.dur0||g.durMax) || f.grade > 4) return false;
  g.rolled = true;
  if(Math.random() >= (window.__forceUp ? 1 : UPGRADE_P)) return false;
  await upgradeWeapon(f, g); return true;
}
async function upgradeWeapon(f, g){
  const maker = g.maker || "공방", uses = g.uses || 0, oldName = g.name;
  await forgeFx(f, g, maker, uses, WORKSHOP_SP[maker] || null, UPGRADE_STAT[g.tier] || 3);
  const up = UPGRADE_STAT[g.tier] || 3, sp = WORKSHOP_SP[maker] || null;
  Object.assign(g, {unique:true, owner:f.id, origName:oldName, upDay:S.day, wsp: sp ? sp.id : null});
  const b = Object.assign({}, g.bonus||{}); ATTRS.forEach(a=>b[a] = (b[a]||0) + up); g.bonus = b;      // 능력치는 넷 다 고르게 오른다
  delete g.dur; delete g.durMax;
  S.records.push({day:S.day, name:f.name, what:"고유 무기", note:`${maker}에서 ${oldName}을(를) ${f.name}만의 것으로 다시 벼렸다 (${uses}번 출동)`});
  addLog(`${f.name}: ${maker}에서 ${oldName}을(를) 다시 벼려 주었다 — 고유 무기`);
  f.diary = (f.diary||[]).concat([`${S.day}일차 ${maker}에서 ${oldName}을(를) 내 것으로 다시 벼려 주었다`]).slice(-20);
  save(); render();
  await openForge(f, "weapon", "upgrade");
}
/* 연출: 공방의 연락 → 닳은 무기 → 망치질 세 번(불꽃·달아오름) → 담금질 김 → 빛이 칼끝까지 훑고 지나감 → "고유 무기 · ○○의 것".
   대사는 녹아드는 문장으로. 무기 갈래마다 닳은 자리가 다르다 */
const WEAR_LINE = {slash:"날이 이 빠진 자리마다 같은 버릇이 남아 있더군요.", impact:"자루에 손 모양 그대로 홈이 패여 있었습니다.", pierce:"끝이 늘 같은 각도로만 닳아 있었어요.",
  gun:"방아쇠가 그 손가락 길이에 맞게 닳아 있었습니다.", tool:"손잡이가 그 손 모양 그대로 굳어 있더군요."};
const FORGE_MID = ["이 정도로 손에 익은 물건은 남한테 못 팝니다.","고쳐 쓰라고 돌려보내기엔, 너무 그 사람 것이 돼 버렸어요.","그래서 고치는 대신, 처음부터 다시 벼렸습니다."];
function forgeFx(f, g, maker, uses, sp, upStat){

    // 시간표(ms): 등장 → 망치 세 번(칼 가운데 · 끝 · 밑동, 마지막에 공방 각인) → 담금질 → 식으며 빛이 훑음 → 제 빛이 돌아옴 → 제목

    T.hit.forEach((ms,i)=>at(ms, ()=>{ shake = 1 + i*0.35; const hx = HX[i];

      for(let k=0;k<10;k++) parts.push({k:"scale", hx, x:(Math.random()-0.5)*6, y:0, vx:(Math.random()-0.5)*2.4, vy:-1-Math.random()*2.2, life:1, dec:0.02, r:1+Math.random()*1.6}); }));
    at(T.quench, ()=>{ shake = 0.6; for(let k=0;k<70;k++) parts.push({k:"steam", x:(Math.random()-0.5), y:0, vx:(Math.random()-0.5)*0.5, vy:-0.5-Math.random()*1.4, life:1, r:10+Math.random()*22}); });
    at(T.title, ()=>o.classList.add("named")); at(T.btn, ()=>o.classList.add("done"));
    const hammerA = t=>{ let a = -1.15; T.hit.forEach(ms=>{ const d = t - ms;   // 들어 올림 → 내려침 → 붙어 있음 → 다시 듦
      if(d >= -450 && d < -130) a = -1.15 - 0.25*((d+450)/320); else if(d >= -130 && d < 0) a = -1.4*(1-(d+130)/130); else if(d >= 0 && d < 90) a = 0; else if(d >= 90 && d < 600) a = -1.15*((d-90)/510); }); return a; };

      const sky = bc.createRadialGradient(BW/2, BH*0.55, 0, BW/2, BH*0.55, Math.max(BW,BH)*0.7);

      bc.fillStyle = beam; bc.beginPath(); bc.moveTo(BW*0.38, 0); bc.lineTo(BW*0.62, 0); bc.lineTo(BW*0.72, BH*0.7); bc.lineTo(BW*0.28, BH*0.7); bc.fill();
      for(let i=0;i<40;i++){ const ph = ((now/1000)*0.02*(1+i%5*0.2) + i*0.137) % 1, x = BW*(0.3 + 0.4*((i*0.618)%1)) + Math.sin(now/1300+i)*8, y = BH*(0.05 + ph*0.7);
        bc.fillStyle = `rgba(255,226,180,${0.12*Math.sin(ph*Math.PI)})`; bc.beginPath(); bc.arc(x, y, 1+(i%3)*0.5, 0, 7); bc.fill(); }

      shake *= 0.85; const sx = (Math.random()-0.5)*shake*9, sy = (Math.random()-0.5)*shake*6;

      const len = (WEAPON_REACH[kd]||0.6)*(kd==="gun"||kd==="tool" ? 1 : (spec.len||1)), u = Math.min(W*0.78/Math.max(0.35, len+0.22), H*1.7), x0 = cx - len*u*0.48;
      const hitX = i => x0 + HX[i]*len*u;
      // 모루: 뿔과 몸통, 위가 빛을 받는다
      c.save(); c.translate(sx, sy); const ay = cy + u*0.075, aw = Math.min(W*0.42, len*u*0.62);
      c.fillStyle = "#16120f"; c.beginPath(); c.moveTo(cx-aw*0.5, ay); c.lineTo(cx+aw*0.42, ay); c.quadraticCurveTo(cx+aw*0.62, ay+4, cx+aw*0.72, ay+10); c.lineTo(cx+aw*0.36, ay+18);

      c.fillStyle = `rgba(255,200,150,${0.18+0.25*heat})`; c.fillRect(cx-aw*0.5, ay, aw*0.92, 1.5);
      // 무기

        c.globalAlpha = ap; drawW(c, spec);

        if(wear > 0){ c.save(); c.globalAlpha = ap*wear*0.75; c.strokeStyle = "#141316"; c.lineWidth = 1.3; for(let i=0;i<11;i++){ const x = x0 + (0.1 + i*0.065)*len*u, y = cy + ((i*37)%11-5)*u*0.0025; c.beginPath(); c.moveTo(x, y); c.lineTo(x+u*0.018, y+u*0.005); c.stroke(); } c.restore(); }
        // 달아오름: 마지막으로 맞은 자리에서 번져 나가는 열 — 흰빛 → 노랑 → 주황 → 붉게 식는다
        if(heat > 0.01){ oc.setTransform(d,0,0,d,0,0); oc.clearRect(0,0,W,H); oc.globalCompositeOperation = "source-over"; drawW(oc, Object.assign({}, spec, {metal:"#ffffff"}));
          oc.globalCompositeOperation = "source-in"; const li = T.hit.reduce((k,ms,i)=>t>=ms ? i : k, 0), hx = hitX(li), spread = 40 + (t - T.hit[li])*0.25;
          const hg = oc.createRadialGradient(hx, cy, 0, hx, cy, Math.max(60, spread*2.2));
          const cool = t > T.quench ? clamp((t-T.quench)/600, 0, 1) : 0;
          hg.addColorStop(0, cool ? `rgba(255,${120-cool*80|0},40,1)` : "rgba(255,250,225,1)"); hg.addColorStop(0.25, "rgba(255,196,90,1)"); hg.addColorStop(0.6, "rgba(255,110,40,0.85)"); hg.addColorStop(1, "rgba(160,30,10,0.35)");
          oc.fillStyle = hg; oc.fillRect(0,0,W,H);
          c.save(); c.setTransform(1,0,0,1,0,0); c.globalAlpha = heat*ap; c.globalCompositeOperation = "lighter"; c.filter = "blur(1px)"; c.drawImage(off, 0, 0); c.filter = "none";
          c.globalAlpha = heat*ap*0.6; c.filter = `blur(${8*d}px)`; c.drawImage(off, 0, 0); c.filter = "none"; c.restore(); }
        // 공방 각인: 세 번째 망치질에 밑동에 찍힌다
        if(t > T.hit[2]){ const k = clamp((t-T.hit[2])/500, 0, 1), mx = x0 + Math.min(0.11, len*0.12)*u + 0.05*u, my = cy;
          c.save(); c.globalAlpha = k*0.85; c.strokeStyle = t < T.quench ? "#ffd9a0" : "#2a2420"; c.lineWidth = 1.2; c.beginPath(); c.arc(mx, my, Math.max(4, u*0.012), 0, 7); c.stroke();
          c.fillStyle = c.strokeStyle; c.font = `${Math.max(6, u*0.014)|0}px "Noto Serif KR",serif`; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText([...maker][0]||"", mx, my+0.5); c.restore(); }
        // 담금질 뒤 빛이 칼끝까지 훑고, 제 빛이 돌아온다
        const sw = clamp((t-T.sweep)/900, 0, 1);
        if(sw > 0 && sw < 1){ oc.setTransform(d,0,0,d,0,0); oc.globalCompositeOperation = "source-over"; oc.clearRect(0,0,W,H); drawW(oc, Object.assign({}, spec, {metal:"#ffffff"})); oc.globalCompositeOperation = "source-in";
          const xs = x0 - 40 + sw*(len*u + 80), gr = oc.createLinearGradient(xs-50, 0, xs+50, 0); gr.addColorStop(0, "rgba(255,255,255,0)"); gr.addColorStop(0.5, "rgba(255,250,235,1)"); gr.addColorStop(1, "rgba(255,255,255,0)");
          oc.fillStyle = gr; oc.fillRect(0,0,W,H); c.save(); c.setTransform(1,0,0,1,0,0); c.globalCompositeOperation = "lighter"; c.globalAlpha = 0.9*Math.sin(sw*Math.PI); c.drawImage(off,0,0); c.restore(); }
        if(look.glow && t > T.glow){ const k = clamp((t-T.glow)/700, 0, 1); c.save(); c.globalAlpha = k*(0.8+0.2*Math.sin(now/300)); c.translate(x0, cy);

        c.save(); c.translate(hx + L2*0.92, cy - L2*0.05); c.rotate(-a*0.9 - 0.15); c.fillStyle = "#3a2a1f"; c.fillRect(-L2, -4, L2*0.95, 8); c.fillStyle = "#24262b"; c.fillRect(-L2-14, -19, 26, 38); c.fillStyle = "rgba(255,255,255,0.12)"; c.fillRect(-L2-14, -19, 26, 4); c.restore(); }
      c.restore();

        c.strokeStyle = `rgba(255,230,190,${0.7*(1-k)})`; c.lineWidth = 2; c.beginPath(); c.arc(hx, cy, 20 + k*120, 0, 7); c.stroke(); c.restore(); } });

      if(e.target.closest(".fgx-act button")){ finish(); return; }
      if(!o.classList.contains("done")){ timers.forEach(clearTimeout); timers = []; skipped = true; say(lines[2], 2); o.classList.add("named","done"); }

/* ---- 고유 장비 제작(특색 전용): ① 무기/방어구 → ② 종류 → ③ 생김새 → ④ 확정 ---- */
/* 고유 장비·E.G.O. 장비 제작: 종류 → 생김새 → 능력 → 확정.
   능력은 4개 능력치(근력·민첩·재주·의지)에 점수를 나눠 준다. E.G.O.는 거기에 특수 능력 하나 —
   무기는 특수 공격(림버스의 화상·출혈·파열·침잠·호흡·충전), 방어구는 특수 방어를 고른다. */
const EGO_PTS = 10, UNIQUE_ARMOR_PTS = 6, STAT_CAP = 24;
const EGO_SPECIAL = {
  weapon:[
    {id:"burn",    n:"화상", d:"맞힐 때마다 화상 3을 새긴다. 적은 턴이 끝날 때 화상만큼 피해를 입고, 화상은 1씩 줄어든다."},
    {id:"bleed",   n:"출혈", d:"맞힐 때마다 출혈 3을 새긴다. 적은 합을 겨룰 때마다 출혈만큼 피해를 입고, 출혈은 3분의 1씩 줄어든다."},
    {id:"rupture", n:"파열", d:"맞힐 때마다 파열이 2씩 쌓이고, 쌓인 파열만큼 피해가 더 들어간다."},
    {id:"sink",    n:"침잠", d:"맞힐 때마다 적의 정신력을 10 깎는다 — 적 코인의 앞면이 잘 안 나온다."},
    {id:"poise",   n:"호흡", d:"남은 코인으로 칠 때 앞면 코인마다 35% 확률로 치명타(그 코인 위력 2배)."},
    {id:"charge",  n:"충전", d:"합을 겨룰 때마다 충전이 2씩 쌓인다. 10이 되면 전부 소모해 그 턴의 코인 위력 +1."}],
  armor:[
    {id:"shield",  n:"보호막", d:"매 턴 시작에 받는 피해 10을 막아 주는 보호막이 생긴다."},
    {id:"thorns",  n:"가시",   d:"맞으면 받은 피해의 20%(최소 1)를 상대에게 되돌려 준다."},
    {id:"evade",   n:"회피",   d:"합에서 졌을 때 25% 확률로 공격을 완전히 피한다."},
    {id:"endure",  n:"인내",   d:"쓰러질 공격을 전투마다 한 번 버티고 숨이 붙은 채 남는다."},
    {id:"mind",    n:"정신 방벽", d:"합에서 져도 정신력이 줄지 않고, 정신력이 0 아래로 내려가지 않는다."},
    {id:"regen",   n:"재생",   d:"턴이 끝날 때마다 상처를 6씩 회복한다."}]
};
const egoSpecial = e => e && e.special ? egoSpecList(e.type).find(x=>x.id===e.special) : null;
const sumPts = o => ATTRS.reduce((t,a)=>t+(o[a]||0),0);
const ptsText = o => ATTRS.filter(a=>o[a]>0).map(a=>`${ATTR_NAME[a]}+${o[a]}`).join(" · ") || "없음";
function forgeBudget(mode, slot, kind, pw){ return mode==="ego" ? EGO_PTS : slot==="weapon" ? sumPts(profBonus(kind, pw||UNIQUE_POWER)) : UNIQUE_ARMOR_PTS; }
function forgeDefault(mode, slot, kind, pw){
  const B = forgeBudget(mode, slot, kind, pw), o = {str:0,agi:0,tec:0,wil:0};
  if(slot==="weapon"){ Object.entries(WEAPON_KINDS[kind].prof).forEach(([k,v])=>o[k] = Math.round(B*v)); const d = B - sumPts(o), top = ATTRS.reduce((x,y)=>o[y]>o[x]?y:x, "str"); o[top] += d; }
  else o.wil = B;

let modalStack = [];
function modal(title, body, buttons, returnValue, onMount){
  return new Promise(res=>{
    const bg = document.createElement("div"); bg.className="modal-bg";
    bg.innerHTML = `<div class="modal"><div class="mh">${title}</div><div class="mb">${body}</div><div class="mf"></div></div>`;
    const mf = bg.querySelector(".mf");
    buttons.forEach(b=>{ const el=document.createElement("button"); el.textContent=b.t; if(b.primary) el.className="primary"; if(b.danger) el.className="danger";
      el.onclick=()=>{ close(); res(b.v!==undefined?b.v:true); }; mf.appendChild(el); });
    const close = ()=>{ bg.remove(); modalStack = modalStack.filter(x=>x!==close); };
    modalStack.push(()=>{ bg.remove(); res(null); });
    document.getElementById("modal-root").appendChild(bg);
    if(onMount) onMount(bg);
  });
}
function closeAll(){ modalStack.slice().forEach(c=>c()); modalStack=[]; }
const confirmBox = (t,b) => modal(t, b, [{t:"취소",v:false},{t:"확인",v:true,primary:true}]);
const alertBox = (t,b) => modal(t, b, [{t:"확인",primary:true}]);
function promptBox(title, label, def, allowRandom){
  return new Promise(res=>{
    modal(title, `<p class="muted">${label}</p><div class="field"><input id="pb" value="${esc(def||"")}" maxlength="400">${allowRandom?'<button id="pbr">랜덤</button>':""}</div>`,
      [{t:"취소",v:"__c"},{t:"확인",v:"__ok",primary:true}], false, root=>{
        const i=root.querySelector("#pb"); i.focus(); i.select();
        const r=root.querySelector("#pbr"); if(r) r.onclick=()=>{ i.value = title.includes("특색")?randomColorTitle():randomName(); };
        i.addEventListener("keydown",e=>{ if(e.key==="Enter") root.querySelector(".mf .primary").click(); });
        root.querySelector(".mf .primary").addEventListener("click",()=>res(i.value.trim()), {capture:true});
        root.querySelector(".mf button").addEventListener("click",()=>res(null), {capture:true});
      });
  });
}

const teamSel = {};
function updateCard(qid){
  const q = S.requests.find(x=>x.id==qid); if(!q) return;
  const sel = teamSel[qid]||[], app=document.getElementById("app");
  app.querySelectorAll(`[data-q="${qid}"].chip`).forEach(c=>c.classList.toggle("on", sel.includes(+c.dataset.chip)));
  const pc = app.querySelector("#pc-"+qid); if(pc) pc.textContent = sel.length;
  const est = app.querySelector("#est-"+qid), go = app.querySelector(`[data-go="${qid}"]`);
  if(!est) return;
  const team = sel.map(id=>S.fixers.find(f=>f.id===id)).filter(Boolean);
  if(!team.length){ est.innerHTML=`<span class="muted">해결사를 골라 출동시킨다.</span>`; go.disabled=true; return; }
  const m = estimate(team,q);
  est.innerHTML = `예상 성공률 <b style="color:${m.rate>=75?"var(--green)":m.rate>=50?"var(--yellow)":"var(--red)"}">${m.rate}%</b> · 1인당 ${m.stat} 피해 성공 ${m.s[0]}~${m.s[1]} / 실패 ${m.l[0]}~${m.l[1]}`;
  go.disabled=false;
}

const Title = {
  cv:null, cx:null, raf:0, W:0, H:0, dpr:1, mx:0, my:0, tx:0, ty:0, zoom:0, zoomT:0,
  start(cv){
    this.cv=cv; this.cx=cv.getContext("2d"); this.resize(); this.build();
    this.onResize=()=>{ this.resize(); this.build(); }; window.addEventListener("resize", this.onResize);
    this.onMove=e=>{ this.tx=(e.clientX/innerWidth-0.5); this.ty=(e.clientY/innerHeight-0.5); }; window.addEventListener("pointermove", this.onMove);
    this.op=null; this.t0=performance.now();
    const f=now=>{ this.frame(now); this.raf=requestAnimationFrame(f); }; this.raf=requestAnimationFrame(f);
  },
  stop(){ cancelAnimationFrame(this.raf); window.removeEventListener("resize", this.onResize); window.removeEventListener("pointermove", this.onMove); this.cv=null; },
  focus(v){ this.zoomT=v?0.08:0; },
  resize(){ const r=this.cv.getBoundingClientRect(); this.dpr=Math.min(2,devicePixelRatio||1); this.W=r.width; this.H=r.height; this.cv.width=r.width*this.dpr; this.cv.height=r.height*this.dpr; },
  build(){

  if(fx.kind==="흉터" && age<2.5){ cx.strokeStyle=`rgba(201,74,74,${0.8*(1-age/2.5)})`; cx.lineWidth=4*devicePixelRatio; cx.beginPath(); const p=Math.min(1,age/0.4); cx.moveTo(W*0.3,H*0.2); cx.lineTo(W*0.3+W*0.4*p,H*0.2+H*0.6*p); cx.stroke(); }

  requestAnimationFrame(loop);

   · 대검(무거운) — 알버(바보 자세): 칼끝을 앞 아래로 늘어뜨려 넓게 선다. 평상: 칼끝을 땅에 꽂고 두 손을 손잡이 끝에 포갠다
   · 둔기 — 한 손으로 어깨 위에 들어 겨눔. 평상: 어깨에 걸쳐 멘다
   · 봉 — 중단: 가슴 높이로 수평, 두 손은 3등분 지점. 평상: 목 뒤로 두 어깨에 걸치고 두 손을 얹는다
   · 창 — 낮은 겨눔(멧돼지 이빨): 창을 낮게, 끝은 살짝 위로, 뒷다리에 무게. 평상: 어깨에 비스듬히 멘다
   · 랜스 — 겨드랑이에 끼워 수평(카우치), 몸을 앞으로. 평상: 세워서 밑동을 땅에 댄다

function ik2(S, T, L1, L2, pref){

   ③ 불꽃: 인스턴스 사각형을 속도 방향으로 늘린 빛줄기. 공기 저항·중력은 정점 셰이더에서 계산(상태 없음)
   ④ 먼지: 노이즈 덩어리 사각형이 퍼지며 옅어진다
   방향: down 내려베기(위→아래) · up 올려치기(아래→위) · horiz 가로베기(좌→우) · diag 대각선 베기(우하→좌상) · cross 교차 */

// 타격 순간 무기 종류에 따른 추가 효과(t0부터 약 0.6초)
function weaponFx(c, st, o, t, t0, fromX, fromY, x, y){
  const g0 = o.lead; if(!g0 || !g0.wtype || t<t0-0.35 || t>t0+1.4) return;
  const tf = c.getTransform(), SW = c.canvas.width/(tf.a||1), SH = c.canvas.height/(tf.d||1), V = sceneVFX(Math.round(SW), Math.round(SH));
  if(V){ const key = "sfx"+t0;
    if(t>=t0-0.12 && !st[key]){ st[key] = 1; const R = SH*0.17, sp = g0.spec || {};
      if(g0.wtype==="blunt" || g0.wtype==="fist") st.shake = (st.shake||0)+6;
      const cat = (WEAPON_KINDS[g0.wtype]||{}).cat, pool = cat==="slash" ? ["down","diag","horiz","up"] : cat==="impact" ? ["smash","swing","upper"] : ["thrust"];
      slashAt(V, g0.wtype, x, y, R, {face: x>=fromX ? 1 : -1, spec: sp, style: g0.wtype==="gun" ? "aim" : g0.wtype==="staff" ? "spin" : pool[Math.floor(t0*7)%pool.length], groundY: y + R*1.4, fromX, fromY, delay:0.12}); }
    if(V.active()){ V.render(); c.save(); c.setTransform(1,0,0,1,0,0); c.drawImage(V.canvas, 0, 0, c.canvas.width, c.canvas.height); c.restore(); }
    return; }
  if(t>t0+0.7) return;
  const g = Object.assign({}, g0, {wtype: g0.wtype==="twin" ? "blade" : g0.wtype==="fist" ? "blunt" : g0.wtype});
  const k = seg(t, t0, t0+0.6), key = "wfx"+t0;
  c.save(); c.globalCompositeOperation="lighter";
  if(g.wtype==="blade" || g.wtype==="great"){ const big = g.wtype==="great" ? 1.6 : 1;
    if(t>=t0){ c.strokeStyle=`rgba(235,240,255,${0.9*(1-k)})`; c.shadowColor="#dfe8ff"; c.shadowBlur=14; c.lineWidth=(3*big)*(1-k)+0.5;
      c.beginPath(); c.moveTo(x-28*big, y-22*big); c.lineTo(x+28*big, y+18*big); c.stroke(); c.beginPath(); c.moveTo(x-24*big, y+16*big); c.lineTo(x+20*big, y-20*big); c.stroke(); } }
  else if(g.wtype==="blunt"){ if(t>=t0){ if(!st[key]){ st[key]=1; st.shake=(st.shake||0)+6; }
      c.strokeStyle=`rgba(255,190,120,${0.7*(1-k)})`; c.lineWidth=5*(1-k)+1; c.beginPath(); c.arc(x, y, 8+k*40, 0, 7); c.stroke(); } }
  else if(g.wtype==="gun"){ [0,0.1,0.2].forEach((dl,i)=>{ const ts=t0-0.3+dl; if(t>ts && t<ts+0.12){ c.fillStyle="rgba(255,220,140,0.95)"; c.shadowColor="#ffcc66"; c.shadowBlur=16; c.beginPath(); c.arc(fromX, fromY, 5, 0, 7); c.fill();
      c.strokeStyle="rgba(255,230,170,0.8)"; c.lineWidth=1.2; c.beginPath(); c.moveTo(fromX, fromY); c.lineTo(x, y+(i-1)*6); c.stroke(); } }); }
  else if(g.wtype==="spear"){ if(t>=t0){ const len = 60*(1-k)+20; c.strokeStyle=`rgba(220,240,255,${0.9*(1-k)})`; c.shadowColor="#cfe8ff"; c.shadowBlur=12; c.lineWidth=2.5;
      c.beginPath(); c.moveTo(x-len, y); c.lineTo(x+18, y); c.stroke(); c.beginPath(); c.arc(x+18, y, 6*(1-k)+2, 0, 7); c.stroke(); } }
  else if(g.wtype==="drill"){ if(t>=t0){ for(let i=0;i<14;i++){ const a=i/14*Math.PI*2 + t*20, r=6+k*26; c.fillStyle=`rgba(255,${180+i*4},100,${0.9*(1-k)})`; c.fillRect(x+Math.cos(a)*r, y+Math.sin(a)*r*0.6, 2, 2); } } }
  c.restore();
}
function armorFx(c, o, t, t0, x, y){ const g=o.lead; if(!g || !g.armor || t<t0 || t>t0+0.5) return; const k=seg(t,t0,t0+0.5);

const SCENES = {};
/* ---- 일반 의뢰 ----
   원작 협회들의 전문 분야를 참고해 속성마다 다른 장면으로 만든다.
   물리(리우·외피 결): 은신처 셔터를 정면으로 부수고 쏟아지는 무리를 제압
   속도(데뱌트·시 결): 마감 시계가 도는 동안 옥상을 건너뛰며 표적을 추격
   정밀(세븐 결): 어두운 현장을 손전등으로 훑어 단서를 찾고 실로 이어 보고서를 완성 */
SCENES["일반"] = {
  dur: 4.6,
  init(o){ return {}; },
  draw(c, t, W, H, o, st){
    const f = {str: genBreach, agi: genChase, tec: genInvestigate}[o.attr] || genBreach;

  }

/* 물리: 정면 돌파 */
function genBreach(c, t, W, H, o, st){
  const gy = streetBG(c, W, H, t, st), ok = o.success;
  const n = Math.max(1, Math.min(5, o.team.length)), fh = Math.min(H*0.32, 58);
  // 은신처 건물과 셔터
  const hx = W*0.66, hw = W*0.22, sh = fh*1.5, sx = hx + hw*0.18, sw = hw*0.64, sy = gy - sh;
  c.fillStyle="#0f0d12"; c.fillRect(hx, gy-H*0.72, hw, H*0.72);
  c.fillStyle="#191620"; c.fillRect(hx, gy-H*0.72, hw, 4);
  c.save(); c.font=`800 10px "Noto Sans KR",sans-serif`; c.fillStyle="rgba(200,60,60,0.55)"; c.translate(hx+hw*0.5, sy-14); c.rotate(-0.06); c.textAlign="center"; c.fillText("출입 금지", 0, 0); c.restore();
  const hit = 1.55;
  const breakK = ok ? ease(seg(t, hit, hit+0.35)) : 0;
  // 셔터 조각: 성공이면 안쪽으로 휘며 위쪽부터 떨어져 나간다
  for(let k=0; k<sh; k+=5){
    const row = k/sh; let bend = 0, drop = 0, a = 1;
    if(ok && t>hit){ bend = Math.sin(row*Math.PI)*22*breakK; drop = breakK*row*row*30; a = 1-seg(t, hit+0.2, hit+0.9)*row; }
    if(!ok && t>hit && t<hit+0.25){ bend = Math.sin(row*Math.PI)*4*(1-seg(t,hit,hit+0.25)); }
    c.globalAlpha = a; c.fillStyle = (k/5)%2 ? "#2a2830" : "#34323b";
    c.beginPath(); c.moveTo(sx, sy+k+drop); c.quadraticCurveTo(sx+sw/2+bend, sy+k+drop+bend*0.3, sx+sw, sy+k+drop); c.lineTo(sx+sw, sy+k+5+drop); c.quadraticCurveTo(sx+sw/2+bend, sy+k+5+drop+bend*0.3, sx, sy+k+5+drop); c.closePath(); c.fill();
  }
  c.globalAlpha = 1;
  // 셔터 안쪽 붉은 불빛
  if(t>hit && (ok || t>hit+0.6)){ const k = ok ? breakK : seg(t,hit+0.6,hit+0.9); const g=c.createLinearGradient(0,sy,0,gy); g.addColorStop(0,`rgba(120,30,30,${0.25*k})`); g.addColorStop(1,`rgba(200,60,40,${0.4*k})`); c.fillStyle=g; c.fillRect(sx,sy,sw,sh); }
  // 행진(발 맞춘 걸음마다 땅이 울린다)
  const march = ease(seg(t, 0.15, 1.25));
  const front = lerp(-W*0.05, W*0.42, march);
  if(march<1){ const step = Math.floor(t*3.2); if(step!==st.lastStep){ st.lastStep=step; st.shake=1.6; } }
  let lx = front;
  if(t>1.25) lx = lerp(front, sx - fh*0.25, ease(seg(t, 1.25, hit)));
  if(ok && t>hit+0.5) lx = lerp(sx - fh*0.25, sx + sw*0.3, ease(seg(t, hit+0.5, hit+1.3)));
  if(!ok && t>hit+0.7) lx = lerp(sx - fh*0.25, sx - W*0.12, ease(seg(t, hit+0.7, hit+1.1)));
  // 쏟아지는 무리
  st.mob = st.mob || Array.from({length:6},(_,i)=>({d:0.15+Math.random()*0.5, y:(Math.random()-0.5)*6, h:0.8+Math.random()*0.15, r:0.9+Math.random()*0.7}));
  st.mob.forEach((m,i)=>{
    if(ok){ if(t<hit+0.15) return; const k = seg(t, hit+0.15+i*0.04, hit+0.9+i*0.04);
      const x = lerp(sx+sw*0.5, sx+sw*0.5 + W*0.12*m.r*(i%2?1:-0.4), ease(k)), rot = ease(k)*1.4*(i%2?1:-1);
      fig(c, x, gy+m.y*0.2, fh*m.h, {face:-1, side:"foe", rot, alpha: 1-seg(t,hit+1.2,hit+2.2)*0.6}); }
    else { if(t<hit+0.6) return; const k = seg(t, hit+0.6+i*0.06, hit+1.4+i*0.06);
      const x = lerp(sx+sw*0.5, sx - W*0.05 - i*fh*0.35, ease(k));
      fig(c, x, gy, fh*m.h, {face:-1, side:"foe", weapon:true, ewt:FOE_WEAPONS[i%FOE_WEAPONS.length], wRot:0.8}); }
  });
  // 해결사들
  for(let i=n-1;i>=0;i--){
    let x = i===0 ? lx : front - i*fh*0.45, rot = 0;
    if(!ok && t>hit+1.0 && i===0) rot = -ease(seg(t, hit+1.0, hit+1.4))*1.25;
    if(i>0 && ok && t>hit+0.6) x = lerp(front - i*fh*0.45, sx + sw*0.1 - i*fh*0.45, ease(seg(t, hit+0.6, hit+1.6)));
    if(i>0 && !ok && t>hit+0.8) x -= ease(seg(t, hit+0.8, hit+1.3))*W*0.06;
    // 의뢰 연출에서는 평상 자세(무기는 등·허리에 찬 채), 지면 부상 자세
    const state = !ok && t > hit+0.7 ? "hurt" : "idle";
    fig(c, x, gy, fh*(i===0?1:0.94), {face:1, weapon:true, state, coat:i===0, gear:i===0?o.lead:null, rot, rim:"rgba(255,210,150,0.55)"});
  }
  // 충돌
  if(t>hit && !st.boom){ st.boom=true; st.shake = ok?13:7; sparks(st, sx, gy-sh*0.5, ok?50:25, "#ffd9a0", ok?5:3.5, 0.9); }
  if(t>hit && t<hit+0.9){ const k=seg(t,hit,hit+0.9);
    [0,0.1,0.2].forEach((dl,j)=>{ const kk=seg(t,hit+dl,hit+0.8+dl); if(kk<=0||kk>=1) return; c.save(); c.globalCompositeOperation="lighter"; c.strokeStyle=`rgba(255,${200-j*30},${140-j*30},${(ok?0.55:0.3)*(1-kk)})`; c.lineWidth=6*(1-kk)+1; c.shadowColor="#ffb060"; c.shadowBlur=16; c.beginPath(); c.ellipse(sx, gy-sh*0.5, 8+ease(kk)*W*(ok?0.12:0.05), 8+ease(kk)*sh*(ok?0.9:0.4), 0, 0, 7); c.stroke(); c.restore(); });
    const fl=c.createRadialGradient(sx,gy-sh*0.5,0,sx,gy-sh*0.5,W*0.25); fl.addColorStop(0,`rgba(255,220,170,${0.4*(1-seg(t,hit,hit+0.3))})`); fl.addColorStop(1,"rgba(0,0,0,0)"); c.fillStyle=fl; c.fillRect(0,0,W,H); }
  if(ok && t>hit){ st.dust = st.dust || Array.from({length:16},()=>({a:Math.random()*Math.PI, r:0.5+Math.random(), s:10+Math.random()*16}));
    const k = seg(t,hit,hit+1.4); st.dust.forEach(du=>{ const r=du.s*(0.6+ease(k)*1.8), x=sx+sw*0.5+Math.cos(du.a)*ease(k)*W*0.1*du.r, y=gy-sh*0.4-Math.sin(du.a)*ease(k)*30*du.r;
      const g2=c.createRadialGradient(x,y,0,x,y,r); g2.addColorStop(0,`rgba(140,125,115,${0.28*(1-k)})`); g2.addColorStop(1,"rgba(0,0,0,0)"); c.fillStyle=g2; c.beginPath(); c.arc(x,y,r,0,7); c.fill(); }); }
  weaponFx(c, st, o, t, hit, lx+fh*0.25, gy-fh*0.62, sx, gy-sh*0.5);
  if(!ok) armorFx(c, o, t, hit+1.0, lx, gy-fh*0.6);
  if(!ok && t>hit+1.0){ const k=seg(t,hit+1.0,hit+1.8); c.fillStyle=`rgba(150,20,20,${0.25*Math.sin(Math.PI*Math.min(1,k*1.3))+0.12*k})`; c.fillRect(0,0,W,H); if(!st.ko){ st.ko=true; st.shake=10; sparks(st, lx, gy-fh*0.6, 26, "#ff6a6a", 4, 0.8); } }
  drawParts(c, st);
  if(ok && t>3.0 && !st.coins){ st.coins=true; for(let i=0;i<24;i++) st.parts.push({x:W*0.55+(Math.random()-0.5)*W*0.3,y:gy,vx:(Math.random()-0.5)*0.6,vy:-1.2-Math.random()*1.6,l:1.3,t:0,color:"#f2d27a",g:0.005,s:2}); }
  rainFG(c, W, H, st); vignette(c, W, H, ok || t<hit+1 ? "rgba(0,0,0,0.7)" : "rgba(70,0,0,0.8)");
}

/* 속도: 마감 시계가 도는 옥상 추격 */
function genChase(c, t, W, H, o, st){
  const ok = o.success, gy = H*0.78;
  if(!st.roofs){ const R=(a,b)=>a+Math.random()*(b-a); st.roofs=[]; let x=-40; while(x<W*6){ const w=R(150,280); st.roofs.push({x,w,h:R(-10,14),tank:Math.random()<0.35,ant:Math.random()<0.3}); x+=w+R(28,46); }
    st.sky=[]; x=-20; while(x<W*3){ const w=R(30,80); st.sky.push({x,w,h:R(H*0.25,H*0.6),wins:Array.from({length:6},()=>[Math.random(),Math.random()])}); x+=w+R(2,14); }
    st.bg={rain:Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,v:6+Math.random()*4}))}; }
  const scroll = (t<3.2 ? t : 3.2 + (t-3.2)*0.15) * W*0.42;
  let g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,"#06060b"); g.addColorStop(1,"#1b1420"); c.fillStyle=g; c.fillRect(0,0,W,H);
  const hz=c.createRadialGradient(W*0.5,H,0,W*0.5,H,W*0.6); hz.addColorStop(0,"rgba(180,80,60,0.22)"); hz.addColorStop(1,"rgba(0,0,0,0)"); c.fillStyle=hz; c.fillRect(0,0,W,H);
  // 먼 도시(느리게 흐름)
  st.sky.forEach(b=>{ const x = ((b.x - scroll*0.25) % (W*3) + W*3) % (W*3) - 60; c.fillStyle="#110f17"; c.fillRect(x, H*0.85-b.h, b.w, b.h);
    b.wins.forEach(w=>{ c.fillStyle="rgba(255,196,120,0.35)"; c.fillRect(x+w[0]*(b.w-6), H*0.85-b.h+8+w[1]*(b.h-20), 4, 5); }); });
  // 속도선
  c.strokeStyle="rgba(200,215,240,0.12)"; c.lineWidth=1; c.beginPath();
  for(let i=0;i<26;i++){ const y=(i*37.3)%H, x=((i*173 - scroll*1.6)%W+W)%W; c.moveTo(x,y); c.lineTo(x+60+i%5*20,y); } c.stroke();
  // 옥상(빠르게 흐름)
  const roofAt = x => st.roofs.find(r=> x >= r.x - scroll && x <= r.x - scroll + r.w);
  st.roofs.forEach(r=>{ const x=r.x-scroll; if(x>W+10||x+r.w<-10) return; const top=gy+r.h;
    c.fillStyle="#0c0b10"; c.fillRect(x, top, r.w, H-top); c.fillStyle="#1d1a23"; c.fillRect(x, top, r.w, 3);
    for(let k=8;k<r.w-8;k+=22){ c.fillStyle="#0a090d"; c.fillRect(x+k, top-7, 2, 7); } c.fillStyle="#0a090d"; c.fillRect(x+4, top-8, r.w-8, 1.5);
    if(r.tank){ c.fillStyle="#0c0b10"; c.fillRect(x+r.w*0.6, top-26, 26, 26); c.fillRect(x+r.w*0.6+4, top-32, 18, 6); }
    if(r.ant){ c.strokeStyle="#0c0b10"; c.lineWidth=2; c.beginPath(); c.moveTo(x+r.w*0.3, top); c.lineTo(x+r.w*0.3, top-34); c.stroke(); } });
  const fh = Math.min(H*0.3, 54);
  // 달리는 몸: 단순 실루엣을 기울여 달리는 느낌
  const runner = (x, phase, opts) => { const r = roofAt(x); const top = r ? gy + r.h : gy+6; const air = !r || (phase % 1 > 0.62);
    const jy = air ? -Math.sin(((phase%1)-0.62)/0.38*Math.PI)*fh*0.55 : -Math.abs(Math.sin(phase*Math.PI*2))*2;
    fig(c, x, top + jy, fh*(opts.s||1), Object.assign({rot: 0.18}, opts)); };
  // 표적(소포를 든 채무자)
  const gap0 = W*0.36, gap = ok ? lerp(gap0, fh*0.4, ease(seg(t, 0.5, 2.9))) : lerp(gap0, W*0.3, seg(t,0.5,2.2));
  const chaserX = W*0.3 + (ok ? 0 : 0), targetX = chaserX + gap;
  let tx = targetX, tAlpha = 1, tDrop = 0;
  if(!ok && t>2.3){ const k = ease(seg(t,2.3,2.9)); tx = targetX + k*W*0.05; tDrop = k*H*0.6; tAlpha = 1 - seg(t,2.6,3.0); }
  if(!(ok && t>2.95)){ c.save(); c.globalAlpha = tAlpha; c.translate(0, tDrop); runner(tx, t*2.2+0.3, {face:1, weapon:false, rim:"rgba(255,90,90,0.45)", s:0.92});
    c.fillStyle="#2a2018"; c.fillRect(tx-fh*0.05, gy-fh*0.62, fh*0.22, fh*0.16); c.restore(); }
  // 해결사들(뒤따라오는 동료)
  const n = Math.max(1, Math.min(5, o.team.length));
  for(let i=n-1;i>=1;i--) runner(chaserX - i*fh*0.6, t*2.2+i*0.17, {face:1, weapon:true, state:"idle", rim:"rgba(255,210,150,0.4)", s:0.94, alpha:0.85});
  let cxp = chaserX, crot = 0.18;
  if(ok && t>2.9){ cxp = lerp(chaserX, tx, ease(seg(t,2.9,3.1))); }
  if(!ok && t>2.6){ crot = 0; }
  // 잔상
  c.save(); c.globalCompositeOperation="lighter"; for(let k=1;k<=4;k++) fig(c, cxp - k*12, gy, fh, {face:1, rot:0.18, alpha:0.14-k*0.025, tint:"#7fe0a8"}); c.restore();
  runner(cxp, t*2.2, {face:1, weapon:true, wRot:-0.6, coat:true, gear:o.lead, rim:"rgba(255,210,150,0.6)", rot: crot});
  // 붙잡는 순간
  if(ok) weaponFx(c, st, o, t, 3.0, cxp+fh*0.2, gy-fh*0.62, tx, gy-fh*0.6);
  if(ok && t>3.0 && !st.grab){ st.grab=true; st.shake=8; sparks(st, tx, gy-fh*0.6, 34, "#cfeaff", 4, 0.8); }
  if(ok && t>3.0){ const k=seg(t,3.0,3.6); c.save(); c.globalCompositeOperation="lighter"; c.strokeStyle=`rgba(200,235,255,${1-k})`; c.lineWidth=3*(1-k)+0.5; c.shadowColor="#9fd6ff"; c.shadowBlur=14;
    for(let i=0;i<10;i++){ const a=i/10*Math.PI*2; c.beginPath(); c.moveTo(tx+Math.cos(a)*10, gy-fh*0.6+Math.sin(a)*10); c.lineTo(tx+Math.cos(a)*(14+k*60), gy-fh*0.6+Math.sin(a)*(14+k*40)); c.stroke(); } c.restore();
    // 되찾은 소포가 금빛으로 빛남
    const bx=tx, by=gy-fh*0.7-k*14; const gl=c.createRadialGradient(bx,by,0,bx,by,30); gl.addColorStop(0,"rgba(255,220,140,0.6)"); gl.addColorStop(1,"rgba(0,0,0,0)"); c.fillStyle=gl; c.fillRect(bx-30,by-30,60,60); c.fillStyle="#d8b47a"; c.fillRect(bx-7,by-5,14,10); }
  drawParts(c, st);
  // 마감 시계
  const cxk = W*0.07, cyk = H*0.24, rr = Math.min(22, H*0.13);
  const total = 3.0, left = ok ? Math.max(0.18, 1 - Math.min(t,3.0)/total*0.82) : Math.max(0, 1 - t/2.85);
  c.save(); c.lineWidth=4; c.strokeStyle="rgba(255,255,255,0.08)"; c.beginPath(); c.arc(cxk,cyk,rr,0,7); c.stroke();
  const col = left>0.35 ? "#9fd6ff" : left>0 ? "#ffb35a" : "#ff5a5a";
  c.strokeStyle=col; c.shadowColor=col; c.shadowBlur=10; c.beginPath(); c.arc(cxk,cyk,rr,-Math.PI/2,-Math.PI/2+Math.PI*2*left); c.stroke();
  c.shadowBlur=0; c.fillStyle=col; c.font=`700 10px "Noto Sans KR",sans-serif`; c.textAlign="center"; c.textBaseline="middle"; c.fillText(left<=0?"마감":ok&&t>3.0?"확보":"기한", cxk, cyk);
  c.restore();
  if(!ok && t>2.9){ const k=seg(t,2.9,3.6); c.fillStyle=`rgba(150,20,20,${0.22*k})`; c.fillRect(0,0,W,H); }
  // 비
  c.strokeStyle="rgba(180,190,215,0.22)"; c.lineWidth=1; c.beginPath(); st.bg.rain.forEach(r=>{ r.y+=r.v; r.x-=r.v*0.9; if(r.y>H||r.x<0){ r.y=-10; r.x=Math.random()*W*1.4; } c.moveTo(r.x,r.y); c.lineTo(r.x+9,r.y-10); }); c.stroke();
  vignette(c, W, H, ok || t<2.9 ? "rgba(0,0,0,0.65)" : "rgba(70,0,0,0.8)");
}

/* 정밀: 현장 조사와 보고서 */
function genInvestigate(c, t, W, H, o, st){
  const ok = o.success, fy = H*0.82;
  if(!st.clues){ const names=["발자국","탄피","찢긴 장부","의수 나사","피 묻은 천"]; st.clues = names.map((nm,i)=>({nm, x: W*(0.3+i*0.13) + (Math.random()-0.5)*W*0.04, y: i%2 ? H*(0.38+Math.random()*0.12) : fy - 6 - Math.random()*14, ts: 0.9+i*0.32})); st.bg={rain:[]}; }
  // 방: 벽, 바닥 원근, 창, 책상, 쓰러진 의자, 서류장
  let g=c.createLinearGradient(0,0,0,fy); g.addColorStop(0,"#0f0d13"); g.addColorStop(1,"#17141c"); c.fillStyle=g; c.fillRect(0,0,W,fy);
  for(let x=0;x<W;x+=18){ c.fillStyle = (x/18)%2 ? "rgba(255,255,255,0.012)" : "rgba(0,0,0,0.05)"; c.fillRect(x,0,18,fy); }
  g=c.createLinearGradient(0,fy,0,H); g.addColorStop(0,"#141118"); g.addColorStop(1,"#0a090c"); c.fillStyle=g; c.fillRect(0,fy,W,H-fy);
  c.strokeStyle="rgba(255,255,255,0.04)"; for(let i=-14;i<=14;i++){ c.beginPath(); c.moveTo(W/2+i*W*0.035, fy); c.lineTo(W/2+i*W*0.11, H); c.stroke(); }
  const wx=W*0.82, wy=H*0.12, ww=W*0.08, wh=H*0.38; c.fillStyle="#1a2030"; c.fillRect(wx,wy,ww,wh); c.fillStyle="#0e0c12"; c.fillRect(wx+ww/2-1,wy,2,wh); c.fillRect(wx,wy+wh/2-1,ww,2);
  const mg=c.createLinearGradient(wx,wy,wx-W*0.15,fy); mg.addColorStop(0,"rgba(140,160,210,0.12)"); mg.addColorStop(1,"rgba(140,160,210,0)"); c.fillStyle=mg; c.beginPath(); c.moveTo(wx,wy); c.lineTo(wx+ww,wy+wh); c.lineTo(wx-W*0.05,H); c.lineTo(wx-W*0.22,H); c.fill();
  c.fillStyle="#0b0a0e"; c.fillRect(W*0.55, fy-H*0.2, W*0.14, H*0.04); c.fillRect(W*0.56, fy-H*0.16, 4, H*0.16); c.fillRect(W*0.68-4, fy-H*0.16, 4, H*0.16);
  c.save(); c.translate(W*0.48, fy); c.rotate(-1.3); c.fillRect(0,-3,H*0.16,4); c.fillRect(H*0.08,-3,3,-H*0.07); c.restore();
  c.fillRect(W*0.92, fy-H*0.5, W*0.06, H*0.5);
  // 조사 보드(가운데 위)
  const bx=W*0.6, by=H*0.1, bw=W*0.15, bh=H*0.32;
  // 어두움
  c.fillStyle="rgba(0,0,0,0.55)"; c.fillRect(0,0,W,H);
  // 해결사들(왼쪽), 대표가 손전등을 든다
  const n = Math.max(1, Math.min(5, o.team.length)), fh = Math.min(H*0.34, 60);
  const walk = ease(seg(t,0.1,0.8)), lx = lerp(-W*0.04, W*0.17, walk);
  // 손전등 빛줄기: 단서를 차례로 훑는다
  let aim = st.clues[0];
  st.clues.forEach(cl=>{ if(t>cl.ts-0.25) aim = cl; });
  const tgt = (!ok && t>2.55) ? {x: W*0.86, y: H*0.6} : aim;
  st.ax = st.ax==null ? tgt.x : lerp(st.ax, tgt.x, 0.12); st.ay = st.ay==null ? tgt.y : lerp(st.ay, tgt.y, 0.12);
  const ox = lx + fh*0.25, oy = fy - fh*0.62;
  let flick = 1; if(!ok && t>2.6) flick = Math.sin(t*50)>0.2 ? 0.25 : 1; if(!ok && t>3.0) flick = 0.05;
  if(t>0.6){ const ang=Math.atan2(st.ay-oy, st.ax-ox), len=Math.hypot(st.ax-ox, st.ay-oy)+40;
    c.save(); c.globalCompositeOperation="lighter"; const lg=c.createRadialGradient(ox,oy,0,ox,oy,len); lg.addColorStop(0,`rgba(255,235,190,${0.28*flick})`); lg.addColorStop(0.7,`rgba(255,235,190,${0.08*flick})`); lg.addColorStop(1,"rgba(255,235,190,0)");
    c.fillStyle=lg; c.beginPath(); c.moveTo(ox,oy); c.lineTo(ox+Math.cos(ang-0.09)*len, oy+Math.sin(ang-0.09)*len); c.lineTo(ox+Math.cos(ang+0.09)*len, oy+Math.sin(ang+0.09)*len); c.fill();
    const sp=c.createRadialGradient(st.ax,st.ay,0,st.ax,st.ay,36); sp.addColorStop(0,`rgba(255,240,200,${0.4*flick})`); sp.addColorStop(1,"rgba(0,0,0,0)"); c.fillStyle=sp; c.fillRect(st.ax-40,st.ay-40,80,80); c.restore(); }
  for(let i=n-1;i>=0;i--) fig(c, i===0?lx:lx-i*fh*0.42, fy, fh*(i===0?1:0.94), {face:1, coat:i===0, gear:i===0?o.lead:null, color:"#0d0b10", rim:"rgba(255,215,160,0.75)"});
  // 단서 표식
  const found = st.clues.filter((cl,i)=> t>cl.ts && (ok || i<3));
  st.clues.forEach((cl,i)=>{ if(t<cl.ts) return; const k=ease(seg(t,cl.ts,cl.ts+0.3)); const miss = !ok && i>=3;
    c.save(); c.globalAlpha = miss ? 0.5*k : k;
    c.strokeStyle = miss ? "rgba(255,110,110,0.7)" : "rgba(120,255,200,0.9)"; c.shadowColor = miss?"#ff6a6a":"#78ffc8"; c.shadowBlur=10; c.lineWidth=1.3;
    c.beginPath(); c.arc(cl.x, cl.y, 6+ (1-k)*10, 0, 7); c.stroke();
    c.shadowBlur=0; c.fillStyle = miss ? "#ff9a9a" : "#c8ffe8"; c.font=`600 10px "Noto Sans KR",sans-serif`; c.textAlign="center"; c.fillText(miss?"?":cl.nm, cl.x, cl.y-12); c.restore(); });
  // 보드와 붉은 실
  if(t>2.0){ const k=ease(seg(t,2.0,2.4)); c.save(); c.globalAlpha=k; c.fillStyle="#2a2016"; c.fillRect(bx,by,bw,bh); c.strokeStyle="#4a3a26"; c.lineWidth=2; c.strokeRect(bx,by,bw,bh);
    c.fillStyle="#d8cfbf"; for(let i=0;i<4;i++) c.fillRect(bx+8+i*(bw-16)/4, by+8+(i%2)*14, (bw-16)/4-6, 16); c.restore();
    const hubX=bx+bw/2, hubY=by+bh*0.7;
    found.forEach((cl,i)=>{ const kk=ease(seg(t,2.2+i*0.12,2.6+i*0.12)); if(kk<=0) return;
      let ex = lerp(cl.x, hubX, kk), ey = lerp(cl.y, hubY, kk), snap = 0;
      if(!ok && t>2.75+i*0.08){ snap = seg(t, 2.75+i*0.08, 3.1+i*0.08); }
      c.save(); c.strokeStyle=`rgba(220,50,50,${0.85*(1-snap)})`; c.lineWidth=1.3; c.shadowColor="#ff3030"; c.shadowBlur=6;
      c.beginPath(); c.moveTo(cl.x, cl.y); if(snap>0){ c.quadraticCurveTo((cl.x+ex)/2, (cl.y+ey)/2+30*snap, lerp(cl.x,ex,0.5), lerp(cl.y,ey,0.5)+40*snap); } else c.lineTo(ex, ey); c.stroke(); c.restore(); });
    if(ok){ const n2=found.length; for(let i=0;i<n2;i++) for(let j=i+1;j<n2;j++){ const kk=ease(seg(t,2.7+(i+j)*0.04,3.0+(i+j)*0.04)); if(kk<=0) continue; const a=found[i], b=found[j];
      c.strokeStyle=`rgba(220,60,60,${0.25*kk})`; c.lineWidth=0.8; c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(lerp(a.x,b.x,kk), lerp(a.y,b.y,kk)); c.stroke(); } }
  }
  // 보고서 도장
  if(ok && t>3.1){ const k=seg(t,3.1,3.35), s=k<1?2.4-1.4*ease(k):1; if(k>=1 && !st.stamp){ st.stamp=true; st.shake=6; }
    c.save(); c.translate(bx+bw*0.78, by+bh*0.3); c.rotate(-0.25); c.scale(s,s); c.globalAlpha=Math.min(1,k*1.5);
    c.strokeStyle="#c94a4a"; c.lineWidth=2; c.strokeRect(-30,-11,60,22); c.fillStyle="#c94a4a"; c.font=`800 11px "Noto Sans KR",sans-serif`; c.textAlign="center"; c.textBaseline="middle"; c.fillText("보고서 제출",0,1); c.restore(); }
  if(!ok && t>3.0){ const k=seg(t,3.0,3.7); c.fillStyle=`rgba(90,10,10,${0.3*k})`; c.fillRect(0,0,W,H);
    c.save(); c.globalAlpha=k; c.fillStyle="#ff9a9a"; c.font=`600 12px "Noto Sans KR",sans-serif`; c.textAlign="center"; c.fillText("단서가 끊겼다", bx+bw/2, by+bh+18); c.restore(); }
  drawParts(c, st);
  vignette(c, W, H, ok || t<3 ? "rgba(0,0,0,0.75)" : "rgba(60,0,0,0.85)");
}

/* ---- 호위 의뢰 ----
   츠바이 협회의 '방패' 결: 의뢰인의 화물차를 해결사들이 둘러싸고 거리를 지난다.
   지붕에서 그림자들이 덮치면 푸른 육각 방벽이 펼쳐진다.
   성공: 막아 내고 차량이 무사히 빠져나간다 / 실패: 방벽이 깨지고 차량이 멈춰 연기에 싸인다 */
SCENES["호위"] = {
  dur: 4.8,
  init(o){ return { foes: Array.from({length:5},(_,i)=>({side: i%2?1:-1, x: 0.25+i*0.13+Math.random()*0.05, d: 1.35+i*0.09})) }; },
  draw(c, t, W, H, o, st){
    const gy = streetBG(c, W, H, t, st), ok = o.success;
    const fh = Math.min(H*0.3, 54), n = Math.max(1, Math.min(5, o.team.length));
    // 차량 진행: 습격 순간 잠시 느려지고, 성공이면 빠져나가고 실패면 멈춘다
    let vx;
    if(t<1.4) vx = lerp(-W*0.12, W*0.4, ease(seg(t,0.1,1.4))*0.95+0.05*seg(t,0.1,1.4));
    else if(ok) vx = lerp(W*0.4, W*0.47, seg(t,1.4,2.6)) + (t>2.6 ? ease(seg(t,2.6,4.0))*W*0.7 : 0);
    else vx = lerp(W*0.4, W*0.44, ease(seg(t,1.4,2.3)));
    const tw = Math.min(W*0.16, 170), th = fh*0.95, ty = gy - th - 8;
    // 전조등 빛
    const hl = !ok && t>2.6 ? (Math.sin(t*20)>0?0.15:0.05) : 1;
    c.save(); c.globalCompositeOperation="lighter"; const lg=c.createLinearGradient(vx+tw,0,vx+tw+W*0.3,0); lg.addColorStop(0,`rgba(255,240,200,${0.3*hl})`); lg.addColorStop(1,"rgba(255,240,200,0)");
    c.fillStyle=lg; c.beginPath(); c.moveTo(vx+tw, ty+th*0.55); c.lineTo(vx+tw+W*0.3, gy-th*0.1); c.lineTo(vx+tw+W*0.3, gy+12); c.lineTo(vx+tw, ty+th*0.75); c.fill(); c.restore();

    c.fillStyle="rgba(150,180,220,0.25)"; c.beginPath(); c.moveTo(vx+tw*0.76, ty+th*0.32); c.lineTo(vx+tw*0.88, ty+th*0.32); c.lineTo(vx+tw*0.95, ty+th*0.58); c.lineTo(vx+tw*0.76, ty+th*0.58); c.fill();
    c.fillStyle=SIDE_COL.friend.head; c.beginPath(); c.arc(vx+tw*0.84, ty+th*0.43, th*0.1, 0, 7); c.fill(); c.fillStyle=SIDE_COL.friend.fill; c.fillRect(vx+tw*0.79, ty+th*0.5, th*0.22, th*0.1);
    c.fillStyle=`rgba(255,235,180,${0.9*hl})`; c.fillRect(vx+tw-4, ty+th*0.62, 4, 5);
    if(!ok && t>2.6 && Math.sin(t*9)>0){ c.fillStyle="#ffb020"; c.fillRect(vx-2, ty+th*0.7, 3, 5); c.fillRect(vx+tw-2, ty+th*0.82, 3, 4); }
    const spin = ok ? t*8 : Math.min(t,2.3)*8;
    [vx+tw*0.18, vx+tw*0.82].forEach(wx=>{ c.fillStyle="#08070a"; c.beginPath(); c.arc(wx, gy-6, 9, 0, 7); c.fill(); c.strokeStyle="#3a3940"; c.lineWidth=1.5; c.beginPath(); c.arc(wx, gy-6, 5, spin, spin+4); c.stroke(); });
    // 츠바이 결의 푸른 육각 방벽
    const raise = seg(t, 1.25, 1.55), crack = !ok ? seg(t, 2.15, 2.6) : 0;
    if(raise>0 && (ok ? t<3.2 : t<2.75)){
      const cxs = vx+tw/2, cys = ty+th*0.45, rx = tw*0.75, ry = th*1.25, a0 = (ok ? 1-seg(t,2.8,3.2) : 1-seg(t,2.45,2.75));
      c.save(); c.globalCompositeOperation="lighter";
      const pulse = 0.5+0.5*Math.sin(t*14);
      const hex = (hx,hy,r)=>{ c.beginPath(); for(let k=0;k<6;k++){ const a=k/6*Math.PI*2+Math.PI/6; c.lineTo(hx+Math.cos(a)*r, hy+Math.sin(a)*r); } c.closePath(); };
      const R = 9;
      for(let row=-8; row<=8; row++) for(let col=-14; col<=14; col++){
        const hx = cxs + col*R*1.73 + (row%2?R*0.86:0), hy = cys + row*R*1.5;
        const d = ((hx-cxs)/rx)**2 + ((hy-cys)/ry)**2; if(d>1 || d<0.72) continue;

/* ---- 수색 의뢰 ----
   지하 수로 깊숙이 들어가며 손전등으로 훑는다. 물 위로 반짝이는 것을 찾아낸다.
   성공: 찾던 물건이 빛 속에 떠오른다 / 실패: 막다른 벽에 닿고 불빛이 꺼진다 */
SCENES["수색"] = {
  dur: 4.8,
  init(o){ return { drops: [], glints: Array.from({length:7},(_,i)=>({x:i===0?(Math.random()-0.5)*0.6:(Math.random()-0.5)*1.1, y:i===0?0.5+Math.random()*0.08:0.12+Math.random()*0.4, p:Math.random()*6})) }; },
  draw(c, t, W, H, o, st){
    const ok = o.success, vx = W*0.5, vy = H*0.46;
    const go = ease(seg(t, 0.1, 2.6)), travel = go*6 + (t>2.6 ? 0 : 0);
    // 배경
    c.fillStyle="#050607"; c.fillRect(0,0,W,H);
    // 터널 고리: 앞으로 나아가며 다가온다
    const ring = z => { const s = 1/z; return {rx: W*0.55*s, ry: H*0.9*s}; };
    const zs = []; for(let i=0;i<14;i++){ let z = 0.35 + ((i*0.55 - travel*0.55) % (14*0.55) + 14*0.55) % (14*0.55); zs.push(z); }
    zs.sort((a,b)=>b-a);
    // 막다른 벽(실패) 혹은 넓은 방(성공)
    const endZ = 7.2 - travel*0.55*1.0;
    zs.forEach(z=>{ if(z<0.4) return; const {rx,ry} = ring(z), a = clamp(1.4/z,0,1)*0.9;
      if(!ok && z>endZ+0.3) return;
      c.strokeStyle=`rgba(${70+30*a},${80+30*a},${75+25*a},${0.15+0.5*a})`; c.lineWidth = 1+3*a;
      c.beginPath(); c.ellipse(vx, vy, rx, ry, 0, Math.PI*1.02, Math.PI*1.98); c.stroke();
      c.beginPath(); c.moveTo(vx-rx, vy); c.lineTo(vx-rx, vy+ry*0.55); c.moveTo(vx+rx, vy); c.lineTo(vx+rx, vy+ry*0.55); c.stroke();
      // 벽의 배관
      c.strokeStyle=`rgba(90,80,70,${0.25*a})`; c.lineWidth=2*a+0.5; c.beginPath(); c.moveTo(vx-rx*0.92, vy-ry*0.25); c.lineTo(vx-rx*0.92, vy+ry*0.5); c.stroke(); });
    // 벽돌 결(원근선)
    c.strokeStyle="rgba(120,110,95,0.07)"; c.lineWidth=1; for(let i=0;i<24;i++){ const a=Math.PI+i/23*Math.PI; c.beginPath(); c.moveTo(vx+Math.cos(a)*6, vy+Math.sin(a)*10); c.lineTo(vx+Math.cos(a)*W*1.5, vy+Math.sin(a)*H*2.4); c.stroke(); }
    // 물길
    const wy = vy + H*0.2; let g=c.createLinearGradient(0,vy,0,H); g.addColorStop(0,"#0b1214"); g.addColorStop(1,"#081012"); c.fillStyle=g;
    c.beginPath(); c.moveTo(vx-8, vy+4); c.lineTo(vx+8, vy+4); c.lineTo(W*1.1, H); c.lineTo(-W*0.1, H); c.fill();
    for(let i=0;i<9;i++){ const yy = vy+8+Math.pow(i/9,1.7)*(H-vy); const ww = (yy-vy)*2.4; c.strokeStyle=`rgba(140,190,200,${0.04+0.05*(i/9)})`; c.beginPath(); c.moveTo(vx-ww+Math.sin(t*2+i)*4, yy); c.lineTo(vx+ww+Math.sin(t*2+i)*4, yy); c.stroke(); }
    // 막다른 벽
    if(!ok && endZ < 6){ const {rx,ry} = ring(Math.max(0.6,endZ)); const a = clamp(1.4/endZ,0,1);
      c.save(); c.beginPath(); c.ellipse(vx, vy, rx, ry, 0, Math.PI, Math.PI*2); c.lineTo(vx+rx, vy+ry*0.55); c.lineTo(vx-rx, vy+ry*0.55); c.closePath(); c.clip();
      const wg=c.createRadialGradient(vx,vy,0,vx,vy,rx); wg.addColorStop(0,`rgba(78,70,62,${0.7+0.3*a})`); wg.addColorStop(1,`rgba(34,31,28,${0.7+0.3*a})`); c.fillStyle=wg; c.fillRect(vx-rx,vy-ry,rx*2,ry*2);
      const bh=Math.max(4,ry*0.11), bw=bh*2.4; c.strokeStyle=`rgba(20,18,16,${0.8*a})`; c.lineWidth=1;
      for(let yy=-ry, r=0; yy<ry*0.55; yy+=bh, r++){ c.beginPath(); c.moveTo(vx-rx, vy+yy); c.lineTo(vx+rx, vy+yy); c.stroke(); for(let xx=-rx+(r%2?bw/2:0); xx<rx; xx+=bw){ c.beginPath(); c.moveTo(vx+xx, vy+yy); c.lineTo(vx+xx, vy+yy+bh); c.stroke(); } }
      c.restore();
      if(t>2.9){ c.save(); c.globalAlpha=seg(t,2.9,3.3); c.fillStyle="#d8a0a0"; c.font=`600 12px "Noto Sans KR",sans-serif`; c.textAlign="center"; c.fillText("막다른 길", vx, vy+ry*0.25); c.restore(); } }
    // 손전등: 해결사 수만큼 빛줄기
    const n = Math.max(1, Math.min(5, o.team.length)), fh = Math.min(H*0.5, 92);
    let power = 1; if(!ok && t>3.0) power = Math.sin(t*40)>0.3 ? 0.2 : 0.9; if(!ok && t>3.4) power = 0.03;
    st.glints.forEach(gl=>{ gl.sx = vx + gl.x*W*0.2*(0.4+gl.y); gl.sy = vy + gl.y*H*0.5; });
    const beamT = t;
    c.save(); c.globalCompositeOperation="lighter";
    for(let i=0;i<n;i++){
      const px = W*(0.36 + (i - (n-1)/2)*0.07), py = H*0.98 - fh*0.62;
      let ax = vx + Math.sin(beamT*1.3+i*1.7)*W*0.18*(t>2.4?1.4:0.6), ay = vy + Math.cos(beamT*1.1+i)*H*0.1 + H*0.08;
      if(ok && t>2.9){ ax = lerp(ax, st.glints[0].sx, ease(seg(t,2.9,3.2))); ay = lerp(ay, st.glints[0].sy, ease(seg(t,2.9,3.2))); }
      const ang = Math.atan2(ay-py, ax-px), len = Math.hypot(ax-px, ay-py)*1.15;
      const lg=c.createRadialGradient(px,py,0,px,py,len); lg.addColorStop(0,`rgba(255,240,205,${0.22*power})`); lg.addColorStop(1,"rgba(255,240,205,0)");
      c.fillStyle=lg; c.beginPath(); c.moveTo(px,py); c.lineTo(px+Math.cos(ang-0.1)*len, py+Math.sin(ang-0.1)*len); c.lineTo(px+Math.cos(ang+0.1)*len, py+Math.sin(ang+0.1)*len); c.fill();
      const sp=c.createRadialGradient(ax,ay,0,ax,ay,40); sp.addColorStop(0,`rgba(255,240,210,${0.3*power})`); sp.addColorStop(1,"rgba(0,0,0,0)"); c.fillStyle=sp; c.fillRect(ax-40,ay-40,80,80);
      st.glints.forEach((gl,j)=>{ if(Math.hypot(gl.sx-ax, gl.sy-ay)<45 && power>0.5){ gl.lit = t; } });
    }
    c.restore();
    // 물 위의 반짝임(쓸모없는 것들)
    st.glints.forEach((gl,j)=>{ if(j===0 && ok) return; const lit = gl.lit && t-gl.lit<0.5 ? 1-(t-gl.lit)/0.5 : 0; if(lit<=0) return;
      c.save(); c.globalCompositeOperation="lighter"; c.fillStyle=`rgba(220,240,255,${0.8*lit})`; c.beginPath(); c.arc(gl.sx, gl.sy, 1.5+lit*1.5, 0, 7); c.fill();
      c.strokeStyle=`rgba(220,240,255,${0.5*lit})`; c.beginPath(); c.moveTo(gl.sx-6*lit, gl.sy); c.lineTo(gl.sx+6*lit, gl.sy); c.moveTo(gl.sx, gl.sy-6*lit); c.lineTo(gl.sx, gl.sy+6*lit); c.stroke(); c.restore(); });
    // 찾던 물건
    if(ok && t>3.1){ const g0 = st.glints[0], k = ease(seg(t,3.1,3.7)), bx = g0.sx, by = g0.sy - k*H*0.06;
      if(!st.found){ st.found=true; st.shake=4; sparks(st, bx, by, 26, "#bff5c8", 3, 0.9, 0.02); }
      c.save(); c.globalCompositeOperation="lighter"; const gl=c.createRadialGradient(bx,by,0,bx,by,60); gl.addColorStop(0,`rgba(170,255,190,${0.55*k})`); gl.addColorStop(1,"rgba(0,0,0,0)"); c.fillStyle=gl; c.fillRect(bx-60,by-60,120,120);
      for(let i=0;i<8;i++){ const a=i/8*Math.PI*2+t; c.strokeStyle=`rgba(190,255,205,${0.5*k})`; c.beginPath(); c.moveTo(bx+Math.cos(a)*10, by+Math.sin(a)*10); c.lineTo(bx+Math.cos(a)*(16+k*20), by+Math.sin(a)*(16+k*20)); c.stroke(); } c.restore();
      c.fillStyle="#e8d6a8"; c.fillRect(bx-9, by-6, 18, 12); c.strokeStyle="#7a6440"; c.strokeRect(bx-9, by-6, 18, 12);
      c.save(); c.globalAlpha=k; c.fillStyle="#c8ffd6"; c.font=`700 12px "Noto Sans KR",sans-serif`; c.textAlign="center"; c.fillText("찾았다", bx, by-20); c.restore(); }
    // 물방울
    if(Math.random()<0.15) st.drops.push({x:vx+(Math.random()-0.5)*W*0.6, y:vy-H*0.4*Math.random(), v:0});
    c.fillStyle="rgba(170,200,210,0.5)"; st.drops = st.drops.filter(d=>{ d.v+=0.4; d.y+=d.v; c.fillRect(d.x,d.y,1,4); return d.y<H; });
    // 해결사들(등을 보이며 앞으로)
    for(let i=0;i<n;i++){ const px = W*(0.36 + (i - (n-1)/2)*0.07), bob = go<1 ? Math.sin(t*8+i)*2 : 0;
      fig(c, px, H*1.02 + bob, fh*(i===0?1:0.92), {coat:i===0, color:"#030405", rim:"rgba(255,230,190,0.35)"}); }
    drawParts(c, st);
    if(!ok && t>3.3){ c.fillStyle=`rgba(80,10,10,${0.3*seg(t,3.3,3.9)})`; c.fillRect(0,0,W,H); }
    vignette(c, W, H, ok || t<3.3 ? "rgba(0,0,0,0.8)" : "rgba(50,0,0,0.85)");
    banner(c, W, H, t, 0.2, 1.1, "수색 의뢰 · 속도+정밀", "#7fb069", o.client||"");
    if(t>3.45) banner(c, W, H, t, 3.45, 99, ok?"수색 성공":"수색 실패", ok?"#c8ffd6":"#ff6a6a", o.team.join(" · "));
  }

/* ================= 도시의 소문(상단 연출) ================= */
let floats = [];
function spawnRumors(){
  floats = []; const now = performance.now(); const n = rnd(3,5); let mainUsed = false; const used = new Set();
  for(let i=0;i<n;i++){
    const main = !mainUsed && Math.random()<0.04;
    let text; do { text = main ? pick(MAIN_RUMORS) : pick(WHISPERS); } while(used.has(text)); used.add(text);
    if(main){ mainUsed = true; if(S) addLog(text, "rumor"); }
    floats.push({text, main, start: now + 1500 + i*rnd(2200,3600), dur: rnd(15000,21000), lane: i%3, layer: main?1:(Math.random()<0.45?0:1), dir: Math.random()<0.5?-1:1, ph: Math.random()*6,
      path: Math.random()<0.5 ? "h" : "diag",
      // 대각선: 문장 자체를 30~40° 기울이고, 기울어진 방향을 따라 미끄러지듯 지나간다
      tilt: (Math.random()<0.5?1:-1) * (0.52 + Math.random()*0.18), move: Math.random()<0.5?1:-1, cxr: 0.12+Math.random()*0.76});
    const f = floats[floats.length-1]; if(f.path==="diag") f.dur = rnd(9000,13000);
  }
}
function drawRumors(now, L){
  const W=cv.width, H=cv.height, d=devicePixelRatio;
  floats.forEach(f=>{
    if(f.layer!==L || now<f.start) return;
    const p = (now-f.start)/f.dur; if(p>1){ f.dead=true; return; }
    const size = (f.main?15:(L===0?11:13))*d;
    cx.save(); cx.font = `${f.main?700:400} ${size}px "Noto Sans KR",sans-serif`; cx.textBaseline="middle";
    const tw = cx.measureText(f.text).width;
    let x, y;
    const a = Math.sin(Math.PI*Math.min(1,Math.max(0,p)))**0.7 * (f.main?0.95:(L===0?0.32:0.5));
    if(f.path==="diag"){
      // 기울어진 문장의 방향(ux,uy)을 따라 이동. move=1이면 글 읽는 방향으로, -1이면 반대로
      const ux=Math.cos(f.tilt), uy=Math.sin(f.tilt);
      const D = (H + tw*Math.abs(uy) + 40*d) / Math.abs(uy);
      const c0x = W*f.cxr, c0y = H*0.5, t = (p-0.5)*D*f.move;
      cx.translate(c0x + ux*t, c0y + uy*t + Math.sin(now/1600+f.ph)*2*d); cx.rotate(f.tilt);
      x = -tw/2; y = 0;
    } else {
      const span = W + tw + 80*d;
      x = f.dir<0 ? W + 40*d - span*p : -tw - 40*d + span*p;
      y = H*(0.16 + f.lane*0.15) + (L===0?-6*d:6*d) + Math.sin(now/1600+f.ph)*3*d;
    }
    cx.globalAlpha = a; cx.shadowColor="#000"; cx.shadowBlur=8*d;
    if(f.main){
      cx.fillStyle="#e8d27a"; cx.shadowColor="rgba(232,210,122,0.6)"; cx.shadowBlur=14*d;
      const jit = Math.sin(now/90+f.ph)>0.93 ? (Math.random()-0.5)*4*d : 0;
      cx.fillText(f.text, x+jit, y);
    } else { cx.fillStyle = L===0 ? "#9a948a" : "#cfc8bb"; cx.fillText(f.text, x, y); }
    cx.restore();
  });
  if(L===1) floats = floats.filter(f=>!f.dead);
}

// 테스트: 참격·히트 VFX 시험장
// [이름, 무기, 모양 번호, 공격 동작, 연속 횟수]
const SLASH_LAB = [
  ["양날검 내려베기","blade",0,"down"],["외날검 올려베기","blade",1,"up"],["톱날검 가로베기","blade",2,"horiz"],["단검 대각선 베기","blade",3,"diag"],
  ["양손검 내려베기","long",0,"down"],["양손검(장도) 가로베기","long",1,"horiz"],["쌍검 교차 베기","twin",0,"diag"],
  ["대검 내려치기","great",0,"smash"],["망치 내려치기","blunt",0,"smash"],["메이스 후려치기","blunt",1,"swing"],["몽둥이 올려치기","blunt",2,"upper"],["도끼 내려찍기","blunt",3,"smash"],
  ["봉 휘돌려 치기","staff",0,"spin"],["건틀릿 지르기","fist",0,"jab"],
  ["창 찌르기","spear",0,"thrust"],["랜스 돌격","lance",1,"thrust"],["레이피어 삼연 찌르기","rapier",0,"thrust",3],["권총 사격","gun",0,"aim"],["산탄총 사격","gun",1,"aim"],["장총 사격","gun",2,"aim"]
];
// 공격 동작 시간표(초): 젖힘 0~0.2 → 휘두름 0.2~0.29 → 멈춤 → 대기로 0.38~0.74. 연속이면 0.2~0.38 사이에 여러 번
function atkPhase(k, multi=1, tm=[200,90,90,360]){
  const a = tm[0]/1000, b = a + tm[1]/1000, c2 = b + tm[2]/1000, d = c2 + tm[3]/1000;
  if(k<0) return 0; if(k<a) return k/a;
  if(k<c2 && multi>1){ const f = (k-a)/(c2-a)*multi, fr = f - Math.floor(f); return Math.floor(f)>=multi-1 && fr>0.5 ? 2 : (fr<0.5 ? 1+ease(fr/0.5) : 2-ease((fr-0.5)/0.5)); }
  if(k<b) return 1 + ease((k-a)/(b-a)); if(k<c2) return 2; return Math.min(3, 2 + (k-c2)/(d-c2));
}
async function openSlashLab(){
  let auto = true, idx = -1, glow = null;
  await modal("참격 · 타격 · 관통 VFX", `<canvas id="slc" style="width:100%;aspect-ratio:720/360;display:block;border-radius:8px;border:1px solid var(--line)"></canvas>
    <div class="fg-seg" style="margin-top:8px">${SLASH_LAB.map((s,i)=>`<button data-sl="${i}">${s[0]}</button>`).join("")}<button data-sauto="1" class="on">자동 반복</button></div>
    <div class="fg-row" style="margin-top:8px"><span>발광색</span><div class="fg-sw">${GLOWS.map(cl=>`<button class="sw ${cl===glow?"on":""}" data-sg="${cl||"none"}" style="background:${cl||"transparent"}">${cl?"":"✕"}</button>`).join("")}</div></div>`, [{t:"닫기"}], false, root=>{
    root.querySelector(".modal").classList.add("modal-wide");
    const cv = root.querySelector("#slc"), c = cv.getContext("2d"), W = 720, H = 360, V = SlashFX.make(W, H), AX = 250, TX = 470, GY = 305;
    let last = -9, cur = null;
    const fire = i => { idx = i; const s = SLASH_LAB[i], spec = Object.assign(defaultSpec(s[1]), {v:s[2], glow});
      cur = {i, t0: performance.now()/1000, spec};
      // 손이 맞는 자리에 닿는 순간(0.29초)에 맞춘다
      const tm = timingOf(s[1]); slashAt(V, s[1], TX, 200, 92, {face:1, style:s[3], multi:s[4]||1, spec, groundY:GY, fromX: AX+82, fromY: 182, delay:(tm[0]+tm[1])/1000}); };
    const lbl = root.querySelectorAll("[data-sl]");
    const loop = ()=>{ if(!cv.isConnected) return; const d = devicePixelRatio||1; if(cv.width !== W*d){ cv.width = W*d; cv.height = H*d; }
      c.setTransform(d,0,0,d,0,0); const g = c.createLinearGradient(0,0,0,H); g.addColorStop(0,"#17141f"); g.addColorStop(1,"#09080c"); c.fillStyle = g; c.fillRect(0,0,W,H);
      c.fillStyle = "rgba(255,255,255,0.04)"; c.beginPath(); c.ellipse(TX, GY, 120, 16, 0, 0, 7); c.fill(); c.beginPath(); c.ellipse(AX, GY, 120, 16, 0, 0, 7); c.fill();
      const t = performance.now()/1000, s = cur ? SLASH_LAB[cur.i] : SLASH_LAB[0], k = cur ? t - cur.t0 : 9, tm = timingOf(s[1]), ph = atkPhase(k, s[4]||1, tm);
      const im = (tm[0]+tm[1])/1000, hl = im + tm[2]/1000, go = k<im ? ease(Math.max(0,k)/im) : 1 - ease(clamp((k-hl)/(tm[3]/1000),0,1)), reach = s[1]==="gun" ? 10 : s[1]==="rapier"||s[1]==="spear"||s[1]==="lance" ? 30 : 60;
      drawFixer(c, AX + go*reach, GY, 172, {face:1, col:SIDE_COL.ally.fill, state:"combat", weapon: cur ? cur.spec : defaultSpec("blade"), atk: {style:s[3], ph}, rot: 0.08*go});
      const hk = k-im, fl = hk>0 && hk<0.2 ? (1-hk/0.2) : 0;
      drawFixer(c, TX + (hk>0 && hk<0.4 ? Math.sin(hk/0.4*Math.PI)*12 : 0), GY, 160, {face:-1, col: fl>0 ? hexMix(SIDE_COL.foe.fill, "#fff4e8", fl*0.35) : SIDE_COL.foe.fill, state:"combat", rot: hk>0 && hk<0.4 ? -0.1*Math.sin(hk/0.4*Math.PI)*-1 : 0, weapon: Object.assign(defaultSpec("blade"),{metal:"#b9aca9"})});
      if(V){ V.render(); c.drawImage(V.canvas, 0, 0, W, H); } else { c.fillStyle="#f88"; c.fillText("WebGL을 쓸 수 없는 환경", 20, 20); }
      c.fillStyle = "#e6e1d8"; c.font = `700 15px "Noto Sans KR",sans-serif`; c.fillText(s[0] + (cur ? "" : ""), 18, 28);
      c.fillStyle = "#9a9387"; c.font = `500 12px "Noto Sans KR",sans-serif`; c.fillText(`${CAT_NAME[WEAPON_KINDS[s[1]].cat]} · ${WEAPON_KINDS[s[1]].n}`, 18, 46);
      if(auto && t - last > 1.8){ last = t; fire((idx+1) % SLASH_LAB.length); lbl.forEach((b,j)=>b.classList.toggle("on", j===idx)); }
      requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
    root.addEventListener("click", e=>{ const d = e.target.dataset;
      if(d.sl!=null){ auto = false; root.querySelector("[data-sauto]").classList.remove("on"); fire(+d.sl); lbl.forEach((b,j)=>b.classList.toggle("on", j===idx)); }
      else if(d.sauto){ auto = !auto; e.target.classList.toggle("on", auto); }
      else if(d.sg){ glow = d.sg==="none" ? null : d.sg; root.querySelectorAll("[data-sg]").forEach(x=>x.classList.toggle("on", x.dataset.sg===d.sg)); } });
  });
}
