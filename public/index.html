<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해결사 사무소 — Problem Solver Office</title>
<style>
:root{
  --bg:#0d0d10; --panel:#16161b; --panel2:#1d1d24; --line:#2c2c36; --text:#e6e1d8; --muted:#8f8a80;
  --accent:#c9a86a; --red:#c94a4a; --yellow:#d8b24a; --green:#7fb069; --violet:#a37ad1; --blue:#6aa0c9;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:#3a2f1c;border-color:var(--accent);color:#f3e3c0}
button.danger{border-color:var(--red);color:#f0b0b0}
input,select{font:inherit;color:var(--text);background:#101014;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.wrap{max-width:1200px;margin:0 auto;padding:12px}
/* top bar */
.topbar{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.topbar .office{font-weight:700;font-size:16px}
.topbar .stat{color:var(--muted)} .topbar .stat b{color:var(--text)}
.scars span{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid var(--red);margin-left:3px;vertical-align:-1px}
.scars span.on{background:var(--red)}
/* stage */
.stage{position:relative;margin-top:10px;height:190px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#07070a}
.stage canvas{width:100%;height:100%;display:block}
.stage .cap{position:absolute;left:0;right:0;bottom:14px;text-align:center;pointer-events:none;text-shadow:0 0 12px #000,0 0 4px #000}
.stage .cap .t{font-size:20px;font-weight:700;letter-spacing:.05em}
.stage .cap .s{font-size:13px;color:#d6cfc2}
.stage{cursor:default}
.fxtest{position:fixed;right:10px;bottom:10px;z-index:60;background:rgba(15,14,18,.95);border:1px solid var(--accent);border-radius:8px;padding:10px;width:250px;font-size:12px}
.fxtest h4{margin:0 0 6px}.fxtest .g{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}.fxtest button{padding:4px 7px;font-size:12px}
/* layout */
.main{display:grid;grid-template-columns:1fr 360px;gap:10px;margin-top:10px}
@media (max-width:900px){.main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.panel h2{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.panel h2 small{color:var(--muted);font-weight:400;font-size:12px}
.reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.req{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.req.special{border-color:var(--accent)} .req.distort{border-color:var(--red)}
.req .head{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.badge.k{color:#111;border:none;font-weight:700}
.req .client{color:var(--muted);font-size:12px}
.req .txt{font-size:13px}
.req .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.req .row b{color:var(--text)}
.req .loot{font-size:12px;color:var(--accent)}
.req .assign{display:flex;gap:6px;margin-top:auto}
.req .assign{justify-content:flex-end}
.req .party{font-size:12px;color:var(--muted)} .req .party b{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:3px 9px;font-size:12px;border-radius:14px;background:#121217}
.chip small{color:var(--muted);font-size:10px}
.chip.on{border-color:var(--accent);background:#3a2f1c;color:#f3e3c0}
.req .est{font-size:12px;color:var(--muted);min-height:18px}
.fixers{display:flex;flex-direction:column;gap:8px}
.fx{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px}
.fx .n{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.fx .n b{font-size:14px} .fx .n span{font-size:12px;color:var(--muted)}
.fx .title{color:var(--accent);font-size:12px}
.bar{height:7px;background:#0b0b0e;border-radius:4px;overflow:hidden;margin:3px 0}
.bar i{display:block;height:100%}
.lv{font-size:11px;margin-left:4px}
.lv.s{color:#a9a59d}.lv.b{color:var(--yellow)}.lv.d{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:12px;margin-top:4px}
.stats div{background:#121217;border-radius:4px;text-align:center;padding:2px 0}
.stats small{color:var(--muted)}
.fx .state{font-size:12px;color:var(--muted);margin-top:4px}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.nav button{flex:1;min-width:110px;padding:10px}
.log{margin-top:10px;max-height:160px;overflow:auto;font-size:12px;color:var(--muted)}
.log div{padding:2px 0;border-bottom:1px dashed #22222a}
.log .rumor{color:#9aa7b8}
footer{margin:18px 0 8px;text-align:center;font-size:12px;color:var(--muted);line-height:1.6}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:640px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal .mh{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.modal .mb{padding:14px 16px;overflow:auto}
.modal .mf{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.item .d{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button.on{border-color:var(--accent);color:var(--accent)}
/* 공방 · 고유 장비 제작 */
.modal.modal-wide{max-width:860px}
.sh-mk{margin:14px 0 6px;font-size:14px} .sh-mk .muted{font-weight:400;font-size:12px;margin-left:6px}
.sh-item{justify-content:flex-start} .wicon{width:64px;height:40px;flex:none;display:block} .sh-slot{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:6px}
.fg-steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;font-size:12px} .fg-steps span{padding:3px 9px;border-radius:12px;border:1px solid var(--line);color:var(--muted)} .fg-steps span.on{border-color:var(--accent);color:var(--accent)} .fg-steps span.done{color:var(--text)}
.fg-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px} .fg-pick button{padding:18px 12px;display:flex;flex-direction:column;gap:4px;text-align:left} .fg-pick b{font-size:16px} .fg-pick small,.fg-kinds small{color:var(--muted);font-size:11px}
.fg-kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px} .fg-kinds button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px} .fg-kinds button.on{border-color:var(--accent)} .fg-kinds .wicon{width:90px;height:46px}
.fg-body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
.fg-prev .fg-cv{width:100%;aspect-ratio:4/3.4;display:block;border-radius:8px;border:1px solid var(--line)} .fg-view{margin-top:6px}
.fg-row{display:flex;align-items:center;gap:10px;margin-bottom:9px} .fg-row>span{width:62px;flex:none;font-size:12px;color:var(--muted)} .fg-row input[type=range]{flex:1} .fg-row input#fgname{flex:1}
.fg-seg{display:flex;gap:4px;flex-wrap:wrap} .fg-seg button{padding:4px 9px;font-size:12px} .fg-seg button.on{border-color:var(--accent);color:var(--accent)}
.fg-sw{display:flex;gap:5px;flex-wrap:wrap} .fg-sw .sw{width:24px;height:24px;padding:0;border-radius:50%;font-size:11px;color:var(--muted)} .fg-sw .sw.on{outline:2px solid var(--accent);outline-offset:2px}
.fg-nav{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.mg-prev{display:flex;gap:10px;align-items:flex-end;margin-bottom:10px} .mg-prev canvas{width:180px;height:170px;border-radius:8px;border:1px solid var(--line);flex:none}
.rig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px} .rig-grid figure{margin:0;text-align:center;font-size:12px;color:var(--muted)} .rig-grid canvas{width:100%;aspect-ratio:1/1.05;display:block;border-radius:6px;border:1px solid var(--line)}
@media (max-width:640px){ .fg-body{grid-template-columns:1fr} .fg-kinds{grid-template-columns:repeat(2,1fr)} }
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:13px}
.kv span{color:var(--muted)}
.field{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.field label{width:90px;color:var(--muted)}
.field input{flex:1}
.muted{color:var(--muted)}
.big{font-size:22px;font-weight:700}
.start{max-width:560px;margin:40px auto}
/* title */
body.on-title{overflow:hidden}
body.on-title .wrap{padding:0;max-width:none}
body.on-title footer{position:fixed;left:0;right:0;bottom:6px;margin:0;z-index:5;color:rgba(200,190,175,.55);font-size:11px;pointer-events:none;text-shadow:0 0 6px #000}
.title-screen{position:fixed;inset:0;z-index:1;background:#05050a}
.title-screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.title-ui{position:absolute;left:7vw;top:50%;transform:translateY(-55%);transition:opacity .5s,transform .5s}
.title-ui.hide{opacity:0;transform:translate(-30px,-55%);pointer-events:none}
.logo-sub{letter-spacing:.42em;font-size:12px;color:#c9a86a;opacity:.85}
.logo h1{margin:6px 0 4px;font-size:clamp(40px,6.4vw,76px);font-weight:900;letter-spacing:.02em;color:#efe6d4;text-shadow:0 0 30px rgba(201,168,106,.25),0 4px 0 #000}
.logo-tag{color:#a69e90;font-size:14px;letter-spacing:.06em}
.logo-tag::before{content:"";display:inline-block;width:28px;height:1px;background:#c94a4a;vertical-align:middle;margin-right:10px}
.menu{display:flex;flex-direction:column;gap:10px;margin-top:38px;width:260px}
.mbtn{text-align:left;padding:12px 18px;font-size:15px;background:rgba(14,13,18,.72);border:1px solid #2c2a33;border-left:3px solid #3a3740;border-radius:4px;backdrop-filter:blur(4px);transition:all .2s}
.mbtn:hover{border-left-color:#c9a86a;padding-left:24px;background:rgba(30,26,22,.85)}
.mbtn.primary{border-left-color:#c94a4a;color:#f3e3c0;background:rgba(40,22,20,.78)}
.ver{margin-top:26px;font-size:11px;color:#6d675e}
.name-panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,92vw);background:rgba(18,16,22,.92);border:1px solid #2f2c35;border-top:3px solid #c9a86a;border-radius:6px;backdrop-filter:blur(6px);animation:npIn .45s ease}
@keyframes npIn{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
.np-h{padding:14px 18px;border-bottom:1px dashed #34313a;font-weight:800;font-size:17px;display:flex;justify-content:space-between;align-items:baseline}
.np-h span{font-size:11px;color:#8f8a80;font-weight:400;letter-spacing:.1em}
.np-body{padding:14px 18px}.np-body .field label{width:90px}
.np-f{padding:12px 18px;border-top:1px solid #2a2830;display:flex;justify-content:space-between}
.warn{color:#e08a8a;font-size:12px;margin:6px 0 0}
.skip{position:absolute;right:20px;bottom:34px;z-index:6;background:rgba(0,0,0,.5)}
@media (max-width:640px){.title-ui{left:6vw;right:6vw}.menu{width:auto}}
/* achievements */
.ach{display:flex;gap:12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;opacity:.55}
.ach.on{opacity:1;border-color:var(--accent)}
.ach-ic{font-size:22px;color:var(--accent);width:28px;text-align:center}
.ach .d{font-size:12px;color:var(--muted)}
.ach-empty{text-align:center;padding:26px 10px}
.ach-empty-ic{font-size:40px;color:#3a3740;margin-bottom:6px}
.ach-empty .d{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
.repay .amt{font-size:26px;font-weight:800;text-align:center;padding:8px;background:#101014;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;color:#f3e3c0}
.repay .steps{display:flex;flex-wrap:wrap;gap:6px}.repay .steps button{flex:1;min-width:64px}
.mg-bg{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:70;display:flex;align-items:center;justify-content:center;padding:10px}
.mg{width:min(760px,100%);background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:10px;overflow:hidden}
.mg-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line)} .mg-h span{color:var(--muted);font-size:12px}
.mg-desc{padding:8px 14px;font-size:13px;color:#cfc8bb}
.mg-stage{padding:0 14px;position:relative} .mg-stage canvas.mg-gl{position:absolute;left:14px;top:0;width:calc(100% - 28px)} .mg-stage canvas.mg-over{position:relative;background:transparent} .mg-stage canvas{width:100%;aspect-ratio:720/300;display:block;border-radius:6px;background:#000;touch-action:none}
.mg-info{padding:8px 14px;font-size:13px;min-height:44px} .mg-log{font-size:12px;color:var(--muted);margin-top:4px}
.mg-ctrl{display:flex;gap:8px;padding:0 14px 6px} .mg-ctrl button{flex:1;padding:10px;font-size:15px}
.mg-f{display:flex;justify-content:flex-end;padding:6px 14px 12px}
.pk-text{background:#0f0e13;border:1px solid #3a3740;border-radius:6px;padding:9px 12px;font-size:14px;min-height:40px;cursor:pointer}
.mg-ctrl{flex-wrap:wrap}.pk-moves{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1 1 100%}
.pk-moves button{text-align:left;padding:8px 10px;font-size:14px;display:flex;flex-direction:column;gap:2px}.pk-moves small{color:var(--muted);font-size:11px}
.pk-moves i{font-style:normal}.pk-moves i.good{color:var(--green)}.pk-moves i.bad{color:var(--red)}
.pk-sw{flex:1 1 100%;margin-top:2px}
.pk-moves.pk-4{grid-template-columns:repeat(4,1fr)}
@media (max-width:640px){.pk-moves.pk-4{grid-template-columns:1fr 1fr}}
/* 전투 창: 선택지가 바뀔 때 창 높이가 출렁이지 않도록 아래 칸 높이를 미리 잡아 둔다 */
.mg-fixed .mg-info{min-height:80px} .mg-fixed .mg-ctrl{min-height:200px;align-content:flex-start}
.pk-fin{flex:1 1 100%;margin-top:2px;background:#3a2f1c;border-color:#f2d27a;color:#f8e6b0;font-weight:700}
.pk-moves i{font-style:normal;font-size:10px;padding:0 5px;border-radius:8px;margin-right:4px;color:#111;font-weight:700}
.pk-moves i.cat-big{background:#ff9a6a}.pk-moves i.cat-gap{background:#f2d27a}.pk-moves i.cat-counter{background:#8fd0ff}.pk-moves i.cat-evade{background:#b9b3a8}
.sh-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1}.sh-pad button{font-size:18px;padding:10px}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-20px);opacity:0;background:#241d14;border:1px solid var(--accent);color:#f3e3c0;padding:10px 18px;border-radius:6px;z-index:80;transition:all .35s}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<footer>이 게임은 Project Moon 세계관을 바탕으로 비영리적인 목적으로 만들어진 팬게임입니다. 플레이를 제외한 일체의 수익성 행위를 금지합니다.<br>또한 모든 수치와 사건은 이 게임을 위해 만든 허구입니다.</footer>
<div id="modal-root"></div>
<script>
"use strict";
/* ================= 데이터 ================= */
const VERSION = "1.0.0";
const SAVE_KEY = "problem-solver-office-save-v1";
const ATTRS = ["str","agi","tec","wil"];
const ATTR_NAME = {str:"근력",agi:"민첩",tec:"재주",wil:"의지"};
const REQ_TYPE = {str:"물리",agi:"속도",tec:"정밀",wil:"이상"};
const gName = g => g===0 ? "특색" : g+"급";
const START_DEBT = 4000000;
// 의뢰 등급별: 기준 보수, 요구치, 재해 등급
// [기준 보수, 요구치(권장 인원 팀이 75%가 되는 값), 재해 등급]
const REQ_BASE = {9:[3000,9,"뜬소문"],8:[6000,14,"도시 괴담"],7:[9000,28,"도시 괴담"],6:[18000,38,"도시 전설"],5:[36000,46,"도시 전설"],4:[72000,70,"도시 질병"],3:[144000,83,"도시 질병"],2:[180000,97,"도시 악몽"],1:[300000,132,"도시 악몽"],0:[675000,145,"도시의 별"]};
const RISK = g => g>=8?"ZAYIN":g>=6?"TETH":g>=4?"HE":g>=2?"WAW":"ALEPH";
// 승급 기준: 현재 등급 -> 다음 등급 필요 총합
const PROMO = {9:48,8:70,7:95,6:120,5:145,4:170,3:200,2:230};
const COLOR_REQ_TOTAL = 250;
const HIRE_COST = {9:10000,8:20000,7:40000,6:80000,5:160000,4:320000,3:640000,2:1280000};
const KIND_COLOR = {"일반":"#c9a86a","호위":"#6aa0c9","수색":"#7fb069","환상체":"#a37ad1","뒤틀림 토벌":"#c94a4a","특색 심사":"#e8d27a","지명":"#e8d27a"};

const PERSONALITIES = [
 ["공격적","weapon","들끓는 맹세"],["신중함","armor","겹겹의 숙고"],["헌신","armor","닳지 않는 등"],["냉소","weapon","식은 웃음"],
 ["충동적","weapon","꺼지지 않는 불씨"],["침착함","armor","고요한 수면"],["집요함","weapon","놓지 않는 갈고리"],["낙천적","armor","내일의 햇볕"],
 ["비관적","armor","무너질 지붕"],["오만함","weapon","하늘을 긋는 선"],["소심함","armor","작은 껍데기"],["정의감","weapon","굽지 않는 저울"],
 ["탐욕","weapon","모자란 주머니"],["다정함","armor","내민 손바닥"],["무심함","armor","빈 액자"],["광기","weapon","웃는 톱니"]
];

function genStats(grade){
  // 9급: 최고 11, 나머지 6~10 / 그 외: 등급 구간 안의 총합
  const keys = ATTRS.slice().sort(()=>Math.random()-0.5);
  const st = {};
  if(grade===9){ st[keys[0]]=11; for(let i=1;i<4;i++) st[keys[i]]=rnd(6,10); return st; }
  const lo = PROMO[grade+1]||48, hi = (PROMO[grade]||250)-1;
  const tot = rnd(lo, hi);
  const w = [rnd(32,40), rnd(22,28), rnd(18,24), rnd(14,20)];
  const ws = w.reduce((a,b)=>a+b,0);
  let sum=0; keys.forEach((k,i)=>{ st[k]=Math.max(4,Math.round(tot*w[i]/ws)); sum+=st[k]; });
  st[keys[0]] += tot-sum;
  ATTRS.forEach(a=>st[a]=clamp(st[a],1,70));
  return st;
}

function makeRequest(grade, opts={}){
  let kind = "일반", attrs;
  if(opts.kind){ kind = opts.kind; attrs = opts.attrs; }
  else {
    const r = Math.random();
    if(r<0.2){ kind="환상체"; attrs=["wil"]; }
    else if(grade<=6 && r<0.45){ if(Math.random()<0.5){kind="호위"; attrs=["str","agi"];} else {kind="수색"; attrs=["agi","tec"];} }
    else { attrs=[pick(["str","agi","tec"])]; }
  }
  const [base, req, threat] = REQ_BASE[grade];
  const key = attrs[0];
  let text, client;
  if(kind==="호위"){ text=pick(ESCORT); client=pick(CLIENTS.agi.concat(CLIENTS.str)); }
  else if(kind==="수색"){ text=pick(SEARCH); client=pick(CLIENTS.tec.concat(CLIENTS.agi)); }
  else { text=pick(TEXTS[key]); client=pick(CLIENTS[key]); }
  // 물리 일반 의뢰는 제압 / 사살로 나뉜다
  let goal = null;
  if(kind==="일반" && key==="str"){ goal = Math.random()<0.35 ? "사살" : "제압"; if(goal==="사살") text = pick(TEXTS.str_kill); }
  const lootChance = kind==="수색"?0.07:kind==="환상체"?0.05:0.03;
  // 환상체 의뢰 일부는 고위험(75% 기준을 넘김)
  const hazard = kind==="환상체" && !opts.kind && Math.random()<0.25;
  const q = {
    id:S.nextId++, kind, attrs, grade, threat, risk: kind==="환상체"?RISK(grade):null, hazard, goal,
    client, text, reward: Math.round(base*(hazard?1.5:1)*(0.85+Math.random()*0.3)/100)*100,
    req: Math.round(req*(hazard?1.25:1)) + rnd(-1,1), deadline: rnd(1,3),
    loot: Math.random()<lootChance*(hazard?2:1) ? Object.assign({},pick(LOOT)) : null, special:false
  };
  return Object.assign(q, opts.over||{});
}
function genRequests(){
  const n = 12 - S.officeGrade; // 9급 3개, 8급 4개, 7급 5개 ...
  if(S.day<=3){
    // 초반 3일: 각 해결사의 가장 높은 능력치에 맞춘 쉬운 의뢰(성공률 90% 이상)
    for(let i=0;i<n;i++){
      const f = S.fixers[i % S.fixers.length], a = topAttr(f);
      const g = f.grade>=9 || i>=S.fixers.length ? 9 : Math.max(S.officeGrade, f.grade);
      const q = makeRequest(g, {kind: a==="wil"?"환상체":"일반", attrs:[a]});
      if(a==="str"){ q.goal = Math.random()<0.3 ? "사살" : "제압"; q.text = q.goal==="사살" ? pick(TEXTS.str_kill) : pick(TEXTS.str); }
      q.req = Math.max(3, power(f,[a]) - 4 - rnd(0,1));
      S.requests.push(q);
    }
    return;
  }
  for(let i=0;i<n;i++){
    const r = Math.random();
    const g = clamp(S.officeGrade + (r<0.5?0:r<0.8?1:2), S.officeGrade, 9);
    S.requests.push(makeRequest(g));
  }
  // 1급 사무소: 가끔 도시의 별 지명 의뢰
  if(S.officeGrade===1 && Math.random()<0.1 && !S.requests.some(q=>q.grade===0&&q.kind==="지명")){
    const a = pick(ATTRS), b = pick(ATTRS.filter(x=>x!==a));
    S.requests.push(makeRequest(0,{kind:"지명",attrs:[a,b],over:{deadline:null,special:true,client:"익명의 의뢰인",text:"도시의 별 등급 위협을 처리해 달라. 아는 자는 적을수록 좋다."}}));
  }
}

/* ================= 판정 ================= */
// 의뢰 등급별 [권장 인원, 최대 인원]
const PARTY = {9:[1,2],8:[1,2],7:[2,3],6:[2,3],5:[2,4],4:[3,4],3:[3,5],2:[3,5],1:[4,5],0:[4,5]};
const partyRec = q => q.kind==="특색 심사" ? 1 : PARTY[q.grade][0];
const partyMax = q => q.kind==="특색 심사" ? 1 : PARTY[q.grade][1];
function gearList(f){ return [f.gear.weapon,f.gear.armor,f.gear.acc].filter(Boolean); }
function power(f, attrs){
  let p = attrs.reduce((s,a)=>s+f.stats[a],0)/attrs.length;
  gearList(f).forEach(g=>{ if(g.bonus) p += attrs.reduce((s,a)=>s+(g.bonus[a]||0),0)/attrs.length; });
  if(f.ego) p += f.ego.type==="weapon" ? 8 : 3;
  return p;
}
// 팀 전력: 가장 강한 1명 + 나머지의 40%
function teamPower(team, attrs){ const ps = team.map(f=>power(f,attrs)).sort((a,b)=>b-a); return ps[0] + 0.4*ps.slice(1).reduce((s,v)=>s+v,0); }
function redHP(f){ let r=0; gearList(f).forEach(g=>r+=g.hpRed||0); if(f.ego&&f.ego.type==="armor") r+=0.35; return Math.min(r,0.7); }
function redMP(f){ let r=0; gearList(f).forEach(g=>r+=g.mpRed||0); if(f.ego&&f.ego.type==="armor") r+=0.35; return Math.min(r,0.7); }
// 요구치와 같으면 75%, 넘을수록 높아짐(요구치가 클수록 1점의 무게는 작아짐)
function rate(team, q){ const P = teamPower(team,q.attrs); return clamp(Math.round(75 + (P-q.req)*4*15/Math.max(15,q.req)), 5, 97); }
function isMental(q){ return q.attrs.includes("wil") && (q.kind==="환상체"||q.kind==="뒤틀림 토벌"||q.attrs[0]==="wil"); }
function dmgFactor(team,q){ const P = teamPower(team,q.attrs); return clamp(1 + (q.req-P)/Math.max(10,q.req)*2, 0.5, 2.5); }
const shareMul = n => n<=1 ? 1 : 1/(0.7*n);
function estimate(team,q){
  const k = dmgFactor(team,q)*shareMul(team.length), mental = isMental(q);
  const red = team.reduce((s,f)=>s+(mental?redMP(f):redHP(f)),0)/team.length;
  const s = [Math.round(4*k*(1-red)), Math.round(9*k*(1-red))];
  const l = [Math.round(14*k*(1-red)), Math.round(26*k*(1-red))];
  return {rate:rate(team,q), stat: mental?"정신력":"체력", s, l};
}
function canGo(f){ return f.lastDispatch!==S.day && f.unavailUntil < S.day; }
function level(cur,max){ const p = cur/max*100; return p>=60?["안정","s"]:p>30?["나쁨","b"]:["위험","d"]; }

function weaponTypeOf(g){ if(!g) return null; if(g.wtype) return g.wtype==="drill" ? "lance" : g.wtype; const s = SHOP.find(i=>i.name===g.name); return s ? s.wtype : "blade"; }
function leadGear(f){

  return { wtype: weaponTypeOf(w), weaponName: w ? w.name : null, spec: weaponSpecOf(w), armorSpec: armorSpecOf(f.gear.armor), armor: !!f.gear.armor, acc: !!acc,

}

const gamesFor = q => q.kind==="호위" ? ["shield"] : q.attrs.filter(a=>a!=="wil");
function chooseMode(q, team){
  const base = rate(team, q), games = gamesFor(q);
  const lo = clamp(base-25,3,97);
  return modal("출동 방식", `<div class="kv">
      <span>기본 성공률</span><b>${base}%</b>

      <span>자동 진행</span><b>성공률 ${base}% 그대로 · <span style="color:var(--yellow)">보수 80%</span></b></div>`,
    [{t:"취소", v:null}, {t:"자동 진행", v:"auto"}, {t:"직접 수행", v:"play", primary:true}]);
}
async function runMinigames(q, team){
  const games = gamesFor(q); let sum = 0;
  for(let i=0;i<games.length;i++){
    const a = games[i], ctx = {q, team, idx:i+1, total:games.length};
    sum += a==="shield" ? await mgShield(ctx) : a==="str" ? await mgCombat(ctx) : a==="agi" ? await mgCircles(ctx) : await mgClues(ctx);
  }
  return games.length ? sum/games.length : 0;
}

function mgOpen(title, desc, ctx, H=300){
  const bg = document.createElement("div"); bg.className = "mg-bg";
  bg.innerHTML = `<div class="mg"><div class="mg-h"><b>${title}</b><span>${ctx.total>1?`미니게임 ${ctx.idx} / ${ctx.total} · `:""}${esc(ctx.q.client)}</span></div>
    <div class="mg-desc">${desc}</div><div class="mg-stage"><canvas width="720" height="${H}" style="aspect-ratio:720/${H}"></canvas></div>
    <div class="mg-info"></div><div class="mg-ctrl"></div><div class="mg-f"><button class="mg-quit">포기</button></div></div>`;
  document.body.appendChild(bg);
  const cvs = bg.querySelector("canvas"), c = cvs.getContext("2d");
  const d = Math.min(2, devicePixelRatio||1); cvs.width = 720*d; cvs.height = H*d; c.setTransform(d,0,0,d,0,0);
  const pos = e => { const r = cvs.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*720, y:(e.clientY-r.top)/r.height*H}; };
  return { bg, cvs, c, pos, info: bg.querySelector(".mg-info"), ctrl: bg.querySelector(".mg-ctrl"), quit: bg.querySelector(".mg-quit"), close(){ bg.remove(); } };
}
function mgResult(m, score, text){
  return new Promise(res=>{ m.info.innerHTML = `<b style="color:${score>=0.7?"var(--green)":score>=0.4?"var(--yellow)":"var(--red)"}">${text} · ${Math.round(score*100)}점</b>`; m.ctrl.innerHTML=""; m.quit.textContent="계속";
    m.quit.onclick = ()=>{ m.close(); res(score); }; setTimeout(()=>{ if(document.body.contains(m.bg)){ m.close(); res(score); } }, 1800); });
}
const powK = (ctx, a) => clamp(teamPower(ctx.team, [a]) / Math.max(1, ctx.q.req), 0.55, 1.7);

/* ================= 전투 무대(WebGL2) =================
   2D 화면 위에 그리는 셰이더 연출. 과하지 않게, 실루엣은 은은한 입체감만 준다.
   ① 배경 패스: 노이즈로 만든 3겹 야경(창문·네온 번짐), 젖은 아스팔트 반사, 안개, 비, 포켓몬식 원형 발판
   ② 인물 패스: 납작한 실루엣을 텍스처로 받아, 흐린 알파로 만든 가짜 법선으로 두 단계 명암(밝은 면 따뜻·그늘 차갑게)과 림 하이라이트를 넣는다. 발밑엔 젖은 바닥 반사.
   ③ 효과 패스: 무기별 궤적 메시(호 잔상·찌르기·탄도), 충격 고리, GPU 파티클(정점 셰이더에서 시드로 궤적 계산)
   ④ 후처리: 충격파 굴절, 약한 색수차, 빛 번짐, 비네트, 그레인
   WebGL2가 안 되면 null을 돌려주고 기존 2D 연출을 쓴다. */
const CombatGL = (function(){
  const VS_FULL = `#version 300 es
  in vec2 aP; out vec2 vUv; void main(){ vUv = aP*0.5+0.5; gl_Position = vec4(aP,0.,1.); }`;
  const NOISE = `
  float h11(float x){ return fract(sin(x*127.1)*43758.5453); }
  float h21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
  float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
    return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x), f.y); }
  float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return s; }`;
  // ① 배경
  const FS_BG = `#version 300 es
  precision highp float; in vec2 vUv; out vec4 o;
  uniform vec2 uRes; uniform float uT, uHz; uniform vec4 uPlat[2];
  ${NOISE}
  // 빌딩 한 겹: x 위치와 지평선 위 높이(hy)로 실루엣·창문·간판을 돌려준다
  vec4 layer(float x, float hy, float sc, float seed, out vec3 em){
    em = vec3(0.);
    float w = 34.*sc, id = floor(x/w + seed*13.), lx = fract(x/w + seed*13.);
    float bh = (34. + h11(id+seed)*120. + step(.86,h11(id*1.7+seed))*60.)*sc;
    float gap = step(.06, lx)*step(lx, .94);
    float inside = step(hy, bh)*gap;
    // 창문 격자
    vec2 cell = vec2(floor(lx*w/(5.*sc)), floor(hy/(7.*sc)));
    vec2 cf = vec2(fract(lx*w/(5.*sc)), fract(hy/(7.*sc)));
    float win = step(.25,cf.x)*step(cf.x,.75)*step(.3,cf.y)*step(cf.y,.8);
    float lit = step(.74, h21(cell + id*3.1 + seed)) * win * step(hy, bh-6.*sc) * step(4.*sc, hy);
    vec3 wc = mix(vec3(1.,.72,.38), vec3(.55,.75,1.), step(.7, h21(cell*1.3+id)));
    em += lit*wc*(.55+.45*sin(uT*.6+id*7.)*step(.97,h21(cell+id)));
    // 간판 네온(이웃 빌딩 것까지 번짐을 더한다)
    for(int k=-1;k<=1;k++){
      float j = id+float(k); if(h11(j*3.7+seed) < .72) continue;
      float sx = (j - seed*13. + .5)*w, sy = (20. + h11(j*5.1)*60.)*sc;
      vec3 nc = h11(j*9.3)<.5 ? vec3(1.,.25,.55) : (h11(j*2.9)<.5 ? vec3(.2,.85,1.) : vec3(1.,.6,.15));
      float fl = .75+.25*step(.15, fract(sin(floor(uT*8.+j)*91.3)*43.));
      vec2 d = vec2(x - sx, hy - sy); float box = step(abs(d.x), 7.*sc)*step(abs(d.y), 3.*sc);
      em += nc*fl*(box*1.4 + .5*exp(-dot(d,d)/(260.*sc*sc)));
    }
    return vec4(inside);
  }
  vec3 city(float x, float hy, float t){
    vec3 col = mix(vec3(.10,.07,.16), vec3(.02,.02,.05), clamp(hy/220.,0.,1.));      // 하늘
    col += vec3(.45,.22,.12)*exp(-max(hy,0.)/38.)*.55;                                // 지평선의 도시 불빛
    col += vec3(.15,.12,.22)*fbm(vec2(x*.006+t*.01, hy*.012))*.5;                    // 구름
    vec3 em;
    vec4 L = layer(x+t*1.5, hy, .62, .3, em); col = mix(col, vec3(.12,.10,.17)+em*.35, L.x*.95);
    L = layer(x+t*3., hy, .85, 1.7, em);       col = mix(col, vec3(.07,.06,.10)+em*.6, L.x);
    L = layer(x+t*5., hy, 1.15, 4.1, em);      col = mix(col, vec3(.035,.03,.05)+em*.9, L.x);
    col += em*.18*(1.-L.x);                                                           // 네온 번짐
    return col;
  }
  void main(){
    vec2 p = vec2(vUv.x, 1.-vUv.y)*uRes;   // 화면 픽셀(위가 0)
    float t = uT, hy = uHz - p.y; vec3 col;
    if(hy >= 0.) col = city(p.x, hy, t);
    else {
      // 젖은 아스팔트: 원근 + 일렁이는 반사
      float d = -hy, z = 40./(d+4.);
      vec2 g = vec2((p.x-uRes.x*.5)*z*.06, z*3.);
      float puddle = smoothstep(.45,.62, fbm(vec2(p.x*.012, 30./(d+3.))*vec2(1.,3.)));
      float rip = (vnoise(vec2(p.x*.08, d*.3 - t*2.))-.5)*(6.+puddle*6.);
      vec3 refl = city(p.x + rip, d*1.15 + 2., t);
      col = vec3(.03,.028,.04) + vec3(.02)*fbm(p*.05);
      col += refl*mix(.18, .55, puddle)*exp(-d/140.);
      float grid = smoothstep(.97,1.,abs(sin(g.x*3.14159)))*.5 + smoothstep(.96,1.,abs(sin(g.y)))*.4;
      col += vec3(.08,.07,.1)*grid*exp(-d/60.);
    }
    // 안개
    float fog = fbm(vec2(p.x*.004 + t*.03, p.y*.01 - t*.01));
    col = mix(col, vec3(.16,.12,.2), fog*.22*smoothstep(uRes.y*.1, uRes.y*.5, p.y)*(1.-smoothstep(uRes.y*.5,uRes.y,p.y)*.6));
    // 원형 발판 (윗면 + 옆면 + 테두리 빛)
    for(int i=0;i<2;i++){
      vec4 P = uPlat[i]; float th = P.w*.35;
      vec2 q = (p-P.xy)/P.zw; float e = length(q);
      vec2 q2 = (p-P.xy-vec2(0.,th))/P.zw; float e2 = length(q2);
      float side = step(e2,1.)*step(1.,e)*step(P.y, p.y);
      col = mix(col, vec3(.05,.045,.06)+vec3(.05,.04,.07)*(1.-abs(q2.x)), side*.95);
      if(e < 1.){
        vec3 top = mix(vec3(.13,.12,.15), vec3(.07,.065,.08), e);
        top += vec3(.03)*smoothstep(.0,.1, abs(fract(e*5.)-.5))*.0;
        top += vec3(.05,.045,.07)*(.5+.5*sin(e*34.))*.25;
        top *= .55 + .45*fbm(q*3.+float(i)*7.);
        top += vec3(.45,.35,.6)*smoothstep(.86,.99,e)*(.35+.65*smoothstep(.2,-.9,q.y));  // 테두리 빛
        top *= 1. - .55*exp(-dot(q*vec2(1.6,1.),q*vec2(1.6,1.))*3.5);                     // 발밑 그림자
        col = mix(col, top, smoothstep(1.,.985,e));
      }
    }
    // 비
    for(int k=0;k<2;k++){
      float sp = k==0 ? 620. : 380., cw = k==0 ? 9. : 6.;
      float cx = floor((p.x + p.y*.18)/cw), lx = fract((p.x + p.y*.18)/cw);
      float off = h11(cx*1.3+float(k)*5.)*900.;
      float y = fract((p.y + t*sp + off)/(k==0?110.:70.));
      float s = smoothstep(.0,.04,y)*smoothstep(.22,.04,y)*step(abs(lx-.5), .06)*step(.55, h11(cx+float(k)*3.));
      col += vec3(.55,.6,.75)*s*(k==0?.10:.06);
    }
    o = vec4(col,1.);
  }`;
  // ② 인물: 납작한 실루엣을 텍스처로 받는다. 알파를 흐려 만든 '부풀린 높이'로 가짜 법선을 구해
  //   (TF2식) 밝은 면/그늘 두 단계 + 따뜻·차가운 색 이동(Gooch) + 경계 채도, 실루엣은 어두운 외곽선 대신 림 하이라이트로 살린다.
  //   발밑 젖은 바닥에는 일렁이는 반사를 옅게 깐다.
  const FS_BLUR = `#version 300 es
  precision highp float; in vec2 vUv; out vec4 o; uniform sampler2D uSrc; uniform vec2 uStep; uniform float uFlip;
  float A(vec2 uv){ return texture(uSrc, uFlip > .5 ? vec2(uv.x, 1.-uv.y) : uv).a + texture(uSrc, uFlip > .5 ? vec2(uv.x, 1.-uv.y) : uv).r*0.; }
  void main(){ float w[5] = float[](.227,.194,.121,.054,.016); float a = A(vUv)*w[0];
    for(int i=1;i<5;i++){ a += (A(vUv+uStep*float(i)) + A(vUv-uStep*float(i)))*w[i]; } o = vec4(a,a,a,a); }`;
  const FS_FIG = `#version 300 es
  precision highp float; in vec2 vUv; out vec4 o;
  uniform sampler2D uFig, uBlur; uniform vec2 uTex, uBT; uniform float uSc, uDis, uT; uniform vec4 uDisRect, uFeet;
  ${NOISE}
  float B(vec2 uv){ return texture(uBlur, uv).a; }
  void main(){
    vec2 uv = vec2(vUv.x, 1.-vUv.y), sp = uv*uTex/uSc;
    vec4 f = texture(uFig, uv);
    // 발밑 반사(젖은 바닥)
    vec4 refl = vec4(0.);
    if(f.a < .99){
      float gy = sp.x > uFeet.z ? uFeet.x : uFeet.y, d = sp.y - gy;
      if(d > 0. && d < 80.){
        float rip = (vnoise(vec2(sp.x*.07, sp.y*.22 - uT*1.6)) - .5)*5.;
        vec4 r = texture(uFig, vec2(sp.x + rip, gy - d)*uSc/uTex); float fade = pow(1.-d/80., 1.6)*.2;
        refl = vec4(r.rgb*.55*r.a*fade, r.a*fade);
      }
    }
    if(f.a < .01){ if(refl.a < .002) discard; o = refl; return; }
    // 부풀린 높이 → 가짜 법선
    vec2 px = 1./uBT; float H = B(vUv);
    float hx = B(vUv+vec2(px.x,0.)) - B(vUv-vec2(px.x,0.)), hy = B(vUv+vec2(0.,px.y)) - B(vUv-vec2(0.,px.y));
    vec3 n = normalize(vec3(-hx*4.5, -hy*4.5, 1.));
    vec3 L = normalize(vec3(-.6,.55,.58));
    float ndl = dot(n, L);
    float lit = smoothstep(.22, .34, ndl);                                  // 두 단계(경계만 살짝 부드럽게)
    vec3 base = f.rgb;
    vec3 warm = base*vec3(1.07,1.03,.98) + .02, cool = base*vec3(.74,.77,.9);  // 밝은 면은 따뜻하게, 그늘은 차갑게
    vec3 col = mix(cool, warm, lit);
    float term = exp(-pow((ndl-.28)/.05, 2.));                               // 명암 경계는 채도를 살짝 올린다
    col = mix(col, col*vec3(1.12,.95,.95), term*.35);
    // 림 하이라이트: 뒤쪽 네온(오른쪽 위)을 향한 가장자리만, 얇고 단단하게
    vec2 out2 = length(vec2(hx,hy)) > 1e-4 ? normalize(vec2(-hx,-hy)) : vec2(0.);
    float edge = smoothstep(.62, .5, H);
    float rim = edge * smoothstep(.15, .45, dot(out2, normalize(vec2(1.,.45))));
    col = mix(col, base*1.25 + vec3(.2,.18,.32), smoothstep(.35,.6, rim)*.85);
    float up = edge * smoothstep(.3, .7, out2.y) * lit;                     // 머리·어깨 위쪽에 아주 약한 하늘빛
    col += vec3(.25,.22,.35)*up*.25;
    col *= 1.03 - .1*smoothstep(-40., 60., sp.y - (sp.x > uFeet.z ? uFeet.x : uFeet.y) + 60.);  // 발치로 갈수록 살짝 어둡게
    // 사살: 노이즈 문턱으로 재처럼 흩어진다
    if(uDis > 0. && sp.x > uDisRect.x && sp.x < uDisRect.z && sp.y > uDisRect.y && sp.y < uDisRect.w){
      float nz = vnoise(sp*.09)*.7 + vnoise(sp*.31)*.3;
      if(nz < uDis){ if(refl.a < .002) discard; o = refl; return; }
      col += vec3(1.,.55,.25)*smoothstep(uDis+.07, uDis, nz)*1.6;
    }
    o = vec4(col*f.a, f.a) + refl*(1.-f.a);
  }`;
  // ③ 효과: 궤적·충격·파티클
  const VS_FX = `#version 300 es
  in vec2 aP; in vec2 aUV; uniform vec2 uRes; out vec2 vUV; out vec2 vP;
  void main(){ vUV=aUV; vP=aP; gl_Position=vec4(aP.x/uRes.x*2.-1., 1.-aP.y/uRes.y*2., 0., 1.); }`;
  const FS_FX = `#version 300 es
  precision highp float; in vec2 vUV; in vec2 vP; out vec4 o;
  uniform int uKind; uniform float uK; uniform vec3 uCol; uniform float uT;
  ${NOISE}
  void main(){
    float k=uK; vec3 c=uCol; float a=0.;
    if(uKind==0){ // 호 잔상: u=호 길이 방향, v=폭(-1~1)
      float u=vUV.x, v=vUV.y, head=k*1.25, tail=head-.55;
      float along = smoothstep(tail, head, u)*step(u, head);
      float across = exp(-v*v*5.)*(1.-smoothstep(.75,1.,abs(v)));
      float streak = .65+.35*vnoise(vec2(u*30., v*3.+uT*4.));
      a = along*across*streak*(1.-smoothstep(.75,1.,k));
      c = mix(c, vec3(1.), exp(-v*v*30.)*along);
    } else if(uKind==1){ // 충격: 중심 빛 + 퍼지는 고리 + 방사 줄기
      vec2 q=vUV*2.-1.; float r=length(q), ang=atan(q.y,q.x);
      float ring = exp(-pow((r-k*.95)/.06,2.))*(1.-k);
      float core = exp(-r*r*18.)*(1.-k)*.6;
      float rays = pow(vnoise(vec2(ang*5., 3.)),3.)*exp(-r*2.5)*(1.-k)*1.2*step(r,1.);
      a = ring + core + rays;
    } else { // 직선 궤적(찌르기·탄도)
      float u=vUV.x, v=vUV.y; float along = smoothstep(k-.5,k,u)*step(u,k+.02);
      a = along*exp(-v*v*6.)*(1.-smoothstep(.7,1.,k));
      c = mix(c, vec3(1.), exp(-v*v*40.));
    }
    o = vec4(c*a, a);
  }`;
  const VS_PT = `#version 300 es
  in float aI; uniform vec2 uRes; uniform vec2 uO; uniform float uK, uSeed, uSpd, uN; uniform vec2 uDir;
  out float vA; out float vH;
  float h(float x){ return fract(sin(x*78.233+uSeed)*43758.5453); }
  void main(){
    float ang = atan(uDir.y,uDir.x) + (h(aI)-.5)*2.4, sp = uSpd*(.35+h(aI+1.)*.9), life = .55+h(aI+2.)*.45;
    float t = min(uK/life, 1.);
    vec2 p = uO + vec2(cos(ang),sin(ang))*sp*t*(1.-t*.45) + vec2(0., 55.*t*t);
    vA = 1.-t; vH = h(aI+3.);
    gl_PointSize = (1.4+h(aI+4.)*2.6)*(1.-t*.6)*${'${DPR}'};
    gl_Position = vec4(p.x/uRes.x*2.-1., 1.-p.y/uRes.y*2., 0., 1.);
  }`;
  const FS_PT = `#version 300 es
  precision highp float; in float vA; in float vH; uniform vec3 uCol; out vec4 o;
  void main(){ vec2 q=gl_PointCoord*2.-1.; float d=dot(q,q); if(d>1.) discard;
    vec3 c = mix(uCol, vec3(1.,.95,.8), vH*.6); float a = vA*(1.-d); o = vec4(c*a, a); }`;
  // ④ 후처리
  const FS_POST = `#version 300 es
  precision highp float; in vec2 vUv; out vec4 o;
  uniform sampler2D uTex; uniform vec2 uRes; uniform float uT, uAb, uFlash; uniform vec4 uWave[2]; uniform vec2 uShake; uniform vec3 uFlashCol;
  ${NOISE}
  void main(){
    vec2 uv = vUv + uShake/uRes;
    vec2 px = vec2(uv.x, 1.-uv.y)*uRes;
    for(int i=0;i<2;i++){ vec4 w=uWave[i]; if(w.w<=0.) continue;
      vec2 d = px-w.xy; float r=length(d), R=w.z, band=exp(-pow((r-R)/14.,2.));
      uv -= (d/max(r,1.))/uRes*band*16.*w.w*vec2(1.,-1.); }
    vec2 cd = (uv-.5)*uAb*.012;
    vec3 col = vec3(texture(uTex, uv+cd).r, texture(uTex, uv).g, texture(uTex, uv-cd).b);
    // 빛 번짐: 밝은 부분만 둥글게 모은다
    vec3 bl = vec3(0.); for(int i=0;i<12;i++){ float a=float(i)*.5236; for(int j=1;j<=2;j++){
      vec2 o2 = vec2(cos(a),sin(a))*float(j)*5./uRes; vec3 s = texture(uTex, uv+o2).rgb; bl += max(s-.55, 0.); } }
    col += bl/24.*1.1;
    col = mix(col, uFlashCol, uFlash);
    col = pow(col, vec3(.95))*vec3(1.02,1.,1.04);
    float vg = smoothstep(1.15, .35, length((vUv-.5)*vec2(1.25,1.)));
    col *= mix(.55, 1., vg);
    col += (h21(px+fract(uT)*91.)-.5)*.035;
    o = vec4(col,1.);
  }`;

  function make(cv, W, H){
    const gl = cv.getContext("webgl2", {antialias:false, premultipliedAlpha:false, alpha:false});
    if(!gl) return null;
    const DPR = cv.width/W;
    const sh = (type, src)=>{ const s=gl.createShader(type); gl.shaderSource(s, src.replace("${DPR}", DPR.toFixed(2))); gl.compileShader(s);
      if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
    const prog = (vs, fs)=>{ const p=gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
      if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
      const u={}; const n=gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); for(let i=0;i<n;i++){ const nm=gl.getActiveUniform(p,i).name.replace("[0]",""); u[nm]=gl.getUniformLocation(p, gl.getActiveUniform(p,i).name); }
      return {p, u}; };
    let P;
    try { P = { bg:prog(VS_FULL, FS_BG), fig:prog(VS_FULL, FS_FIG), blur:prog(VS_FULL, FS_BLUR), fx:prog(VS_FX, FS_FX), pt:prog(VS_PT, FS_PT), post:prog(VS_FULL, FS_POST) }; }
    catch(e){ console.warn("CombatGL", e); return null; }
    // 화면 전체 사각형
    const quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
    const vaoFull = gl.createVertexArray(); gl.bindVertexArray(vaoFull); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
    [P.bg, P.post].forEach(x=>gl.bindAttribLocation(x.p,0,"aP"));
    // 인물 텍스처(매 프레임 2D 캔버스에서 올린다)
    const figTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, figTex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

      if(st.lastAct !== act){ st.enterAt = st.lastAct==null ? -9999 : clock; st.lastAct = act; }
      if(outcome && st.koAt==null) st.koAt = clock+300;
      st.shake = (st.shake||0)*0.86; st.aberr = (st.aberr||0)*0.9; st.flash = (st.flash||0)*0.88;
      if(outcome==="사살" && st.koAt!=null && !st.ember && clock-st.koAt>650){ st.ember = 1; const [x,y] = chestOf("foe"); addFx({kind:"pt", x:x+20, y:y+30, n:90, spd:40, dx:0, dy:-1, col:[1,0.55,0.25], seed:7}, 1600); }
      if(G){
        const gd = fcv.width/W; fctx.setTransform(1,0,0,1,0,0); fctx.clearRect(0,0,fcv.width,fcv.height); fctx.setTransform(gd,0,0,gd,0,0);
        drawFighters(fctx, now);
        const fx = []; st.fx = st.fx.filter(f=>clock-f.t0 < f.dur);
        st.fx.forEach(f=>{ const k = (clock-f.t0)/f.dur; if(k>=0) fx.push(Object.assign({}, f, {k})); });
        st.waves = st.waves.filter(w=>clock-w.t0 < 520);
        const waves = st.waves.map(w=>{ const k = (clock-w.t0)/520; return [w.x, w.y, 20+k*170, (1-k)*w.k]; });
        const dis = outcome==="사살" && st.koAt!=null ? {v: clamp((clock-st.koAt-500)/1400,0,1)*0.95, rect:[POS.foe.x-160, POS.foe.gy-150, POS.foe.x+160, POS.foe.gy+40]} : null;
        G.render({t: now/1000, horizon: 150, plats: PLATS, fig: fcv, dis, feet:[POS.foe.gy, POS.me.gy, 360, 0], fx, waves, aberr: st.aberr, flash: st.flash, flashCol:[1,0.96,0.9], shake:[(Math.random()-0.5)*st.shake, (Math.random()-0.5)*st.shake]});
      } else {
        // WebGL이 안 되는 기기: 기존 2D 그림
        const c = m.c; c.save(); streetBG(c, W, H, now/1000, st); drawFighters(c, now);
        if(outcome==="사살" && st.koAt!=null) { c.globalAlpha = clamp((clock-st.koAt-500)/1400,0,1)*0.9; c.fillStyle = "#08070b"; c.fillRect(POS.foe.x-160, POS.foe.gy-150, 320, 190); c.globalAlpha = 1; }
        c.restore();
      }
      overlay(now, !G);
      raf = requestAnimationFrame(draw);
    }
    raf = requestAnimationFrame(draw);
    pickFoeCard();
    m.info.innerHTML = `<div class="pk-text">${foe.name}이(가) 앞을 막아섰다. ${foe.aug ? `<b style="color:#ffb35a">${foe.aug.n}</b> — ${foe.aug.desc}.` : "개조하지 않은 맨몸이다."}</div>`;
    setTimeout(partMenu, 1400);
  });
}

/* ---- 속도: 1인칭 추격 ----
   달아나는 표적을 뒤쫓는 시점. 표적이 던지는 방해물에 원이 생기고, 날아와 부딪히기 전에 누르면 쳐낸다.
   민첩이 높을수록 원이 크고 오래 버틴다. 빈 곳을 누르면 감점. */
function mgCircles(ctx){
  return new Promise(resolve=>{
    const m = mgOpen("추격 · 방해물 쳐내기", "달아나는 표적을 쫓는다. 표적이 던지는 방해물에 원이 뜨면, 부딪히기 전에 눌러 쳐낸다. 빈 곳을 누르면 감점.", ctx);
    const k = powK(ctx,"agi"), N = 6, life = clamp(2000*Math.pow(k,0.8), 1300, 2800), R = clamp(30*Math.sqrt(k), 22, 42), gap = 1150;
    const st = {}, G = {hits:0, miss:0, spawned:0, list:[], start: performance.now()+1300, done:false, dist:0.5, hurt:0}; if(FXTEST) window.__mg = G;
    let raf; const VX=360, VY=128;
    const target = () => ({x: VX + Math.sin(performance.now()/700)*60, y: 196 - (1-G.dist)*10, s: 0.55 + (1-G.dist)*0.5});
    m.cvs.style.cursor = "crosshair";
    m.cvs.addEventListener("pointerdown", e=>{
      if(G.done || performance.now() < G.start) return; const p = m.pos(e), now = performance.now();
      const o = G.list.find(o=>!o.hit && !o.gone && Math.hypot(o.cx-p.x, o.cy-p.y) <= o.r+6);
      if(o){ o.hit = now; G.hits++; G.dist = Math.max(0, G.dist-0.07); sparks(st, o.cx, o.cy, 22, "#cfeaff", 4, 0.6, 0.12); st.shake=3; }
      else { G.miss++; G.flash = now; }
      ui();
    });
    m.quit.onclick = ()=>{ if(G.done) return; G.done=true; cancelAnimationFrame(raf); m.close(); resolve(0); };
    function ui(){ m.info.innerHTML = `쳐냄 <b>${G.hits}</b> / ${N} · 헛손질 <b style="color:var(--red)">${G.miss}</b> <span class="muted">(민첩 보정: 원 크기 ${Math.round(R)} · 유지 ${(life/1000).toFixed(1)}초)</span>`; }
    function finish(){ G.done = true; const score = clamp((G.hits - 0.5*G.miss)/N, 0, 1); setTimeout(()=>{ cancelAnimationFrame(raf); mgResult(m, score, score>=0.8?"표적을 덮쳤다":score>=0.5?"거리를 좁혔다":"표적이 멀어졌다").then(resolve); }, 500); }
    const t0 = performance.now(), KINDS=["box","can","bottle"];
    function draw(){
      const now = performance.now(), t=(now-t0)/1000, c=m.c, W=720, H=300;
      c.save(); if(st.shake>0.2){ c.translate((Math.random()-0.5)*st.shake,(Math.random()-0.5)*st.shake); st.shake*=0.85; }
      // 1인칭 골목: 소실점을 향해 흐르는 건물과 바닥
      let g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,"#07070c"); g.addColorStop(0.45,"#1a1420"); g.addColorStop(1,"#0c0b0f"); c.fillStyle=g; c.fillRect(0,0,W,H);
      const hz=c.createRadialGradient(VX,VY,0,VX,VY,260); hz.addColorStop(0,"rgba(200,110,70,0.25)"); hz.addColorStop(1,"rgba(0,0,0,0)"); c.fillStyle=hz; c.fillRect(0,0,W,H);
      c.fillStyle="#0f0d12"; c.beginPath(); c.moveTo(VX,VY+4); c.lineTo(W,H); c.lineTo(0,H); c.fill();
      const run = t*1.6;
      for(let i=0;i<12;i++){ const z = 1 - ((i/12 + run*0.18) % 1); const sc = 1/(0.15+z*3); const yy = VY + 4 + (H-VY)*Math.min(1, sc*0.33);
        c.strokeStyle=`rgba(255,255,255,${0.03+0.06*(1-z)})`; c.beginPath(); c.moveTo(VX-(yy-VY)*2.2, yy); c.lineTo(VX+(yy-VY)*2.2, yy); c.stroke(); }
      for(let i=0;i<10;i++){ const z = 1 - ((i/10 + run*0.15) % 1); const s = 1/(0.12+z*2.6);
        [-1,1].forEach(side=>{ const x0 = VX + side*s*95, x1 = VX + side*s*95*1.35, top = VY - s*80, bot = VY + s*52;
          const shade = Math.round(14+14*(1-z)); c.fillStyle=`rgb(${shade},${shade-2},${shade+4})`;
          c.beginPath(); c.moveTo(x0, top); c.lineTo(x1, top-s*20); c.lineTo(x1, bot+s*14); c.lineTo(x0, bot); c.fill();
          if(i%2===0){ c.fillStyle=`rgba(255,196,120,${0.25*(1-z)})`; c.fillRect(Math.min(x0,x1)+Math.abs(x1-x0)*0.3, top+s*20, Math.max(2,Math.abs(x1-x0)*0.2), s*10); }
          if(i%3===0){ const col = ["#ff5a5a","#5ad1ff","#ffd35a"][i%3===0?(i/3)%3:0]; c.fillStyle=col; c.globalAlpha=0.5*(1-z); c.fillRect(side>0?x0+2:x0-6, top+s*8, 4, s*28); c.globalAlpha=1; } }); }
      // 속도선
      c.strokeStyle="rgba(220,230,255,0.08)"; c.beginPath(); for(let i=0;i<24;i++){ const a=i/24*Math.PI*2, r0=60+((t*400+i*53)%300); c.moveTo(VX+Math.cos(a)*r0, VY+Math.sin(a)*r0*0.6); c.lineTo(VX+Math.cos(a)*(r0+40), VY+Math.sin(a)*(r0+40)*0.6); } c.stroke();
      // 표적(달아나는 뒷모습)
      const tg = target(), bob = Math.abs(Math.sin(t*9))*4;
      fig(c, tg.x, tg.y - bob, 70*tg.s, {coat:true, rim:"rgba(255,90,90,0.55)"});
      c.fillStyle="#2a2018"; c.fillRect(tg.x+8*tg.s, tg.y-bob-45*tg.s, 14*tg.s, 10*tg.s);
      if(now < G.start){ c.font=`800 34px "Noto Sans KR",sans-serif`; c.textAlign="center"; c.fillStyle="#9fd6ff"; c.shadowColor="#9fd6ff"; c.shadowBlur=18; c.fillText((G.start-now)>500?"놓치지 마라":"쫓아라!", W/2, 90); c.shadowBlur=0; c.textAlign="left"; }
      else if(!G.done){
        if(G.spawned < N && now - (G.lastSpawn||0) > gap){ G.lastSpawn = now; G.spawned++; const ex = 90 + Math.random()*540, ey = 70 + Math.random()*170;
          G.list.push({sx:tg.x, sy:tg.y-40*tg.s, ex, ey, t0: now, r: R, kind: pick(KINDS), rot: Math.random()*6}); }
        if(G.spawned>=N && G.list.every(o=>o.hit||o.gone)) finish();
      }
      // 방해물: 표적에게서 화면 쪽으로 날아오며 커진다
      G.list.forEach(o=>{ const a=(now-o.t0)/life;
        if(!o.hit && !o.gone && a>=1){ o.gone = now; G.dist = Math.min(1, G.dist+0.1); st.shake=12; G.hurt = now; }
        const k2 = Math.min(1,a), e2 = k2*k2; o.cx = lerp(o.sx, o.ex, ease(k2)); o.cy = lerp(o.sy, o.ey, ease(k2)) - Math.sin(k2*Math.PI)*30; const sz = 6 + e2*44;
        if(o.hit){ const h=(now-o.hit)/350; if(h>1) return; c.strokeStyle=`rgba(200,240,255,${1-h})`; c.lineWidth=3; c.beginPath(); c.arc(o.cx,o.cy,o.r+h*24,0,7); c.stroke(); return; }
        if(o.gone) return;
        c.save(); c.translate(o.cx,o.cy); c.rotate(o.rot + a*6); c.fillStyle = o.kind==="box"?"#5a4630":o.kind==="can"?"#4a5058":"#3f6a55"; c.strokeStyle="rgba(0,0,0,0.6)";
        if(o.kind==="box"){ c.fillRect(-sz/2,-sz/2,sz,sz); c.strokeRect(-sz/2,-sz/2,sz,sz); c.beginPath(); c.moveTo(-sz/2,-sz/2); c.lineTo(sz/2,sz/2); c.stroke(); }
        else if(o.kind==="can"){ c.fillRect(-sz*0.35,-sz/2,sz*0.7,sz); c.fillStyle="rgba(255,255,255,0.15)"; c.fillRect(-sz*0.35,-sz*0.3,sz*0.7,sz*0.12); }
        else { c.fillRect(-sz*0.15,-sz/2,sz*0.3,sz*0.35); c.fillRect(-sz*0.25,-sz*0.18,sz*0.5,sz*0.68); }
        c.restore();
        c.save(); c.shadowColor="#9fd6ff"; c.shadowBlur=14; c.strokeStyle="rgba(170,220,255,0.95)"; c.lineWidth=2; c.beginPath(); c.arc(o.cx,o.cy,o.r,0,7); c.stroke();
        c.strokeStyle="rgba(255,255,255,0.85)"; c.lineWidth=3; c.beginPath(); c.arc(o.cx,o.cy,o.r+6,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-a)); c.stroke(); c.restore(); });
      if(G.hurt && now-G.hurt<300){ c.fillStyle=`rgba(200,40,40,${0.35*(1-(now-G.hurt)/300)})`; c.fillRect(0,0,W,H); }
      if(G.flash && now-G.flash<200){ c.fillStyle=`rgba(200,40,40,${0.15*(1-(now-G.flash)/200)})`; c.fillRect(0,0,W,H); }
      // 거리 표시
      c.fillStyle="rgba(0,0,0,0.5)"; c.fillRect(20,16,160,8); c.fillStyle = G.dist<0.4?"#7fb069":G.dist<0.7?"#d8b24a":"#c94a4a"; c.fillRect(20,16,160*(1-G.dist),8);
      c.fillStyle="#cfc8bb"; c.font=`600 11px "Noto Sans KR",sans-serif`; c.fillText("표적과의 거리", 20, 38);
      drawParts(c, st); vignette(c, W, H, "rgba(0,0,0,0.6)"); c.restore();
      raf = requestAnimationFrame(draw);
    }
    ui(); raf = requestAnimationFrame(draw);
  });
}

/* ---- 호위: 의뢰 화물을 지키는 방벽 막기 ----
   가운데의 화물을 노리고 네 방향에서 날붙이가 날아온다. 방향키(또는 WASD, 화면 버튼, 화면 해당 쪽 누르기)로
   방벽을 돌려 막는다. 9급 의뢰는 4개, 도시의 별 등급은 30개. 근력·민첩(팀 전력)이 높으면 조금 느려진다. */
function mgShield(ctx){
  return new Promise(resolve=>{
    const q = ctx.q, m = mgOpen("호위 · 방벽 막기", "화물을 노리고 날아오는 것을 방벽으로 막는다. <b>방향키·WASD</b> 또는 아래 버튼, 화면의 해당 쪽을 눌러 방벽을 돌린다.", ctx);
    const g = q.grade!=null ? q.grade : 9, lvl = (9-g)/9;
    const k = clamp(teamPower(ctx.team, ["str","agi"]) / Math.max(1,q.req), 0.55, 1.7);
    const N = Math.round(4 + lvl*26), speed = lerp(150, 330, lvl) / Math.pow(k,0.4), interval = lerp(1150, 420, lvl) / Math.pow(k,0.3);
    const CX=360, CY=158, SR=52, st={}, G={dir:0, shown:0, blocked:0, hits:0, list:[], start:performance.now()+1200, done:false, hp:100}; if(FXTEST) window.__sh = G;
    const DIRS=[[1,0],[0,1],[-1,0],[0,-1]], ANG=[0,Math.PI/2,Math.PI,-Math.PI/2];
    let raf;
    const setDir = d=>{ G.dir = d; ui(); };
    const key = e=>{ const map={ArrowRight:0,KeyD:0,ArrowDown:1,KeyS:1,ArrowLeft:2,KeyA:2,ArrowUp:3,KeyW:3}; if(e.code in map){ e.preventDefault(); setDir(map[e.code]); } };
    window.addEventListener("keydown", key);
    m.cvs.addEventListener("pointerdown", e=>{ const p=m.pos(e), dx=p.x-CX, dy=(p.y-CY)*2.4; setDir(Math.abs(dx)>Math.abs(dy) ? (dx>0?0:2) : (dy>0?1:3)); });
    m.ctrl.innerHTML = `<div class="sh-pad"><button data-d="3">▲</button><button data-d="2">◀</button><button data-d="1">▼</button><button data-d="0">▶</button></div>`;
    m.ctrl.onclick = e=>{ const d=e.target.dataset.d; if(d!==undefined) setDir(+d); };
    const close = v=>{ window.removeEventListener("keydown", key); cancelAnimationFrame(raf); return v; };
    m.quit.onclick = ()=>{ if(G.done) return; G.done=true; close(); m.close(); resolve(0); };
    function ui(){ m.info.innerHTML = `막음 <b>${G.blocked}</b> · 놓침 <b style="color:var(--red)">${G.hits}</b> · 남은 공격 <b>${N-G.shown}</b> / ${N} <span class="muted">(${gName(g)} 의뢰 · 팀 전력 보정 속도 ×${(1/Math.pow(k,0.4)).toFixed(2)})</span>`; }
    function finish(){ G.done=true; const score = N ? G.blocked/N : 1; setTimeout(()=>{ close(); mgResult(m, score, score>=0.85?"화물을 지켜 냈다":score>=0.5?"흠집은 났지만 버텼다":"화물이 크게 상했다").then(resolve); }, 500); }
    let last = performance.now(); const t0 = performance.now();
    function draw(){
      const now = performance.now(), dt = Math.min(0.05,(now-last)/1000); last = now; const t=(now-t0)/1000, c=m.c, W=720, H=300;
      c.save(); if(st.shake>0.2){ c.translate((Math.random()-0.5)*st.shake,(Math.random()-0.5)*st.shake); st.shake*=0.85; }
      let gr=c.createRadialGradient(CX,CY,0,CX,CY,420); gr.addColorStop(0,"#1a1d28"); gr.addColorStop(1,"#07070b"); c.fillStyle=gr; c.fillRect(0,0,W,H);
      // 네 갈래 길
      c.fillStyle="rgba(255,255,255,0.03)"; c.fillRect(0,CY-22,W,44); c.fillRect(CX-30,0,60,H);
      c.strokeStyle="rgba(110,170,255,0.12)"; c.setLineDash([6,10]); c.beginPath(); c.moveTo(0,CY); c.lineTo(W,CY); c.moveTo(CX,0); c.lineTo(CX,H); c.stroke(); c.setLineDash([]);
      // 화물과 의뢰인
      c.fillStyle="#2a2620"; c.fillRect(CX-20,CY-14,40,28); c.strokeStyle="#5a4c38"; c.strokeRect(CX-20,CY-14,40,28); c.fillStyle="rgba(230,200,120,0.6)"; c.font=`700 9px "Noto Sans KR",sans-serif`; c.textAlign="center"; c.fillText("의뢰 화물",CX,CY+3); c.textAlign="left";
      fig(c, CX+30, CY+16, 34, {side:"friend", face:-1});
      // 방벽(츠바이 결 푸른 육각 호)
      const a0 = ANG[G.dir]; c.save(); c.globalCompositeOperation="lighter"; c.strokeStyle="rgba(110,170,255,0.9)"; c.shadowColor="#6aa0ff"; c.shadowBlur=16; c.lineWidth=5;
      c.beginPath(); c.arc(CX,CY,SR,a0-0.75,a0+0.75); c.stroke();
      for(let i=-2;i<=2;i++){ const a=a0+i*0.3, hx=CX+Math.cos(a)*SR, hy=CY+Math.sin(a)*SR; c.lineWidth=1; c.beginPath(); for(let j=0;j<6;j++){ const b=j/6*Math.PI*2; c.lineTo(hx+Math.cos(b)*7, hy+Math.sin(b)*7); } c.closePath(); c.stroke(); }
      c.restore();
      c.strokeStyle="rgba(110,170,255,0.12)"; c.beginPath(); c.arc(CX,CY,SR,0,7); c.stroke();
      if(now < G.start){ c.font=`800 30px "Noto Sans KR",sans-serif`; c.textAlign="center"; c.fillStyle="#9fc8ff"; c.shadowColor="#9fc8ff"; c.shadowBlur=16; c.fillText("방벽 전개", W/2, 60); c.shadowBlur=0; c.textAlign="left"; }
      else if(!G.done){
        if(G.shown < N && now-(G.lastSpawn||0) > interval*(0.75+Math.random()*0.5)){ G.lastSpawn=now; G.shown++; const d=Math.floor(Math.random()*4); const far = d%2===0 ? 380 : 170;
          G.list.push({d, dist: far, v: speed*(0.9+Math.random()*0.25)}); ui(); }
        if(G.shown>=N && G.list.every(o=>o.done)) finish();
      }
      G.list.forEach(o=>{ if(o.done){ return; } o.dist -= o.v*dt;
        const [dx,dy] = DIRS[o.d], x = CX+dx*o.dist, y = CY+dy*o.dist;
        if(o.dist <= SR+6){ o.done = true;
          if(G.dir===o.d){ G.blocked++; sparks(st, CX+dx*SR, CY+dy*SR, 16, "#a8c8ff", 3.5, 0.5, 0.05); st.shake=3; }
          else { G.hits++; G.hp = Math.max(0,G.hp-100/N); sparks(st, CX, CY, 18, "#ff8a6a", 3.5, 0.6, 0.05); st.shake=9; G.hurt=now; }
          ui(); return; }
        // 날붙이: 꼬리 빛 + 날 모양
        c.save(); c.translate(x,y); c.rotate(Math.atan2(-dy,-dx)); const tl=c.createLinearGradient(-40,0,0,0); tl.addColorStop(0,"rgba(255,90,90,0)"); tl.addColorStop(1,"rgba(255,120,110,0.6)"); c.fillStyle=tl; c.fillRect(-40,-2,40,4);
        c.fillStyle="#e8e2d8"; c.beginPath(); c.moveTo(10,0); c.lineTo(-4,-4); c.lineTo(-10,0); c.lineTo(-4,4); c.closePath(); c.fill(); c.fillStyle="#7a2c2c"; c.fillRect(-16,-2,7,4); c.restore(); });
      if(G.hurt && now-G.hurt<250){ c.fillStyle=`rgba(200,40,40,${0.3*(1-(now-G.hurt)/250)})`; c.fillRect(0,0,W,H); }
      c.fillStyle="rgba(0,0,0,0.5)"; c.fillRect(20,16,160,8); c.fillStyle = G.hp>60?"#7fb069":G.hp>30?"#d8b24a":"#c94a4a"; c.fillRect(20,16,160*G.hp/100,8);
      c.fillStyle="#cfc8bb"; c.font=`600 11px "Noto Sans KR",sans-serif`; c.fillText("화물 상태", 20, 38);
      drawParts(c, st); vignette(c, W, H, "rgba(0,0,0,0.45)"); c.restore();
      raf = requestAnimationFrame(draw);
    }
    ui(); raf = requestAnimationFrame(draw);
  });
}

/* ---- 정밀: 손전등으로 현장을 비춰 단서를 모은다 ----
   재주(팀 전력)가 높을수록 손전등이 넓고, 시간이 길고, 단서가 가끔 반짝여 위치를 알려 준다. 잡동사니는 시간을 빼앗는다. */
function mgClues(ctx){
  return new Promise(resolve=>{
    const m = mgOpen("현장 조사 · 단서 찾기", "손전등으로 어두운 현장을 비추며 단서 4개를 눌러 모은다. 잡동사니를 누르면 시간을 잃는다.", ctx);
    const k = powK(ctx,"tec"), T = clamp(7+4*(k-1), 6, 11), LR = clamp(62*k*1.25, 52, 119), decoyN = k<0.9?3:k<1.2?2:1, hintEvery = k>=1.25?1.2:k>=0.95?2.0:99;
    const NAMES = ["발자국","탄피","찢긴 장부","의수 나사","피 묻은 천","부러진 열쇠","젖은 영수증"], JUNK = ["빈 깡통","신문지","병뚜껑","담배꽁초"];
    const items = [], place = () => { for(let tries=0;tries<200;tries++){ const x=60+Math.random()*600, y=70+Math.random()*190; if(items.every(o=>Math.hypot(o.x-x,o.y-y)>70)) return {x,y}; } return {x:360,y:150}; };
    NAMES.sort(()=>Math.random()-0.5).slice(0,4).forEach(nm=>items.push(Object.assign(place(),{nm, clue:true})));
    JUNK.sort(()=>Math.random()-0.5).slice(0,decoyN).forEach(nm=>items.push(Object.assign(place(),{nm, clue:false})));
    const G = {lx:360, ly:150, left:T, found:0, done:false, msg:"", msgT:0}, st = {}; if(FXTEST) window.__clue = {G, items};
    const mask = document.createElement("canvas"); mask.width=720; mask.height=300; const mc = mask.getContext("2d");
    const bgc = document.createElement("canvas"); bgc.width=720; bgc.height=300; const b = bgc.getContext("2d");
    // 방 배경(한 번만 그림)
    let g=b.createLinearGradient(0,0,0,300); g.addColorStop(0,"#2a2530"); g.addColorStop(1,"#1d1a22"); b.fillStyle=g; b.fillRect(0,0,720,300);
    for(let x=0;x<720;x+=18){ b.fillStyle=(x/18)%2?"rgba(255,255,255,0.025)":"rgba(0,0,0,0.06)"; b.fillRect(x,0,18,185); }
    b.fillStyle="#232027"; b.fillRect(0,185,720,115); b.strokeStyle="rgba(255,255,255,0.05)"; for(let i=-14;i<=14;i++){ b.beginPath(); b.moveTo(360+i*22,185); b.lineTo(360+i*70,300); b.stroke(); }
    b.fillStyle="#141218"; b.fillRect(430,120,150,14); b.fillRect(436,134,6,51); b.fillRect(568,134,6,51); b.fillRect(640,40,60,145); b.fillRect(40,60,70,125);
    b.fillStyle="#3a3240"; b.fillRect(560,30,60,60); b.fillStyle="#141218"; b.fillRect(589,30,2,60); b.fillRect(560,59,60,2);
    let last = performance.now(), raf;
    const move = e=>{ const p=m.pos(e); G.lx=p.x; G.ly=p.y; };
    m.cvs.addEventListener("pointermove", move); m.cvs.style.cursor="none";
    m.cvs.addEventListener("pointerdown", e=>{ move(e); if(G.done) return;
      const it = items.find(o=>!o.got && Math.hypot(o.x-G.lx,o.y-G.ly)<18 && Math.hypot(o.x-G.lx,o.y-G.ly)<LR);
      if(!it) return; it.got = performance.now();
      if(it.clue){ G.found++; sparks(st, it.x, it.y, 14, "#b8ffe2", 2.5, 0.6, 0.02); G.msg=`단서 발견: ${it.nm}`; }
      else { G.left = Math.max(0, G.left-0.8); G.msg=`${it.nm} — 쓸모없는 잡동사니 (-0.8초)`; }
      G.msgT = performance.now(); ui(); if(G.found>=4) finish("단서를 모두 모았다"); });
    m.quit.onclick = ()=>{ if(G.done) return; G.done=true; cancelAnimationFrame(raf); m.close(); resolve(0); };
    function ui(){ m.info.innerHTML = `단서 <b>${G.found}</b> / 4 · 남은 시간 <b>${G.left.toFixed(1)}초</b> <span class="muted">(재주 보정: 손전등 ${Math.round(LR)} · 시간 ${T.toFixed(0)}초${hintEvery<99?" · 반짝임 힌트":""})</span>${G.msg && performance.now()-G.msgT<1500?`<div class="mg-log"><div>${G.msg}</div></div>`:""}`; }
    function finish(txt){ if(G.done) return; G.done=true; const score = G.found/4; setTimeout(()=>{ cancelAnimationFrame(raf); mgResult(m, score, txt).then(resolve); }, 500); }
    const t0 = performance.now();
    function draw(){
      const now = performance.now(), dt = (now-last)/1000; last = now; const c = m.c;
      if(!G.done){ G.left -= dt; if(G.left<=0){ G.left=0; finish(G.found>=2?"시간이 다 됐다":"단서가 끊겼다"); } }
      if(Math.floor(now/250)!==G.tick){ G.tick=Math.floor(now/250); ui(); }
      c.drawImage(bgc,0,0,720,300);
      items.forEach(o=>{ c.save(); c.translate(o.x,o.y);
        c.fillStyle = o.clue ? "#c9b48a" : "#8a8580"; c.strokeStyle="rgba(0,0,0,0.6)";
        c.beginPath(); c.ellipse(0,0,9,5,0.3,0,7); c.fill(); c.stroke(); c.fillRect(-3,-7,6,4); c.restore();
        if(o.got && o.clue){ c.save(); c.strokeStyle="rgba(120,255,200,0.95)"; c.lineWidth=1.5; c.shadowColor="#78ffc8"; c.shadowBlur=10; c.beginPath(); c.arc(o.x,o.y,14,0,7); c.stroke(); c.restore(); } });
      // 어둠과 손전등
      mc.globalCompositeOperation="source-over"; mc.clearRect(0,0,720,300); mc.fillStyle="rgba(3,3,5,0.988)"; mc.fillRect(0,0,720,300);
      mc.globalCompositeOperation="destination-out"; const lg=mc.createRadialGradient(G.lx,G.ly,0,G.lx,G.ly,LR); lg.addColorStop(0,"rgba(0,0,0,1)"); lg.addColorStop(0.7,"rgba(0,0,0,0.85)"); lg.addColorStop(1,"rgba(0,0,0,0)");
      mc.fillStyle=lg; mc.beginPath(); mc.arc(G.lx,G.ly,LR,0,7); mc.fill();
      items.forEach(o=>{ if(o.got&&o.clue){ const r2=mc.createRadialGradient(o.x,o.y,0,o.x,o.y,22); r2.addColorStop(0,"rgba(0,0,0,0.8)"); r2.addColorStop(1,"rgba(0,0,0,0)"); mc.fillStyle=r2; mc.fillRect(o.x-22,o.y-22,44,44); } });
      c.drawImage(mask,0,0,720,300);
      c.save(); c.globalCompositeOperation="lighter"; const warm=c.createRadialGradient(G.lx,G.ly,0,G.lx,G.ly,LR); warm.addColorStop(0,"rgba(255,230,180,0.12)"); warm.addColorStop(1,"rgba(0,0,0,0)"); c.fillStyle=warm; c.fillRect(G.lx-LR,G.ly-LR,LR*2,LR*2); c.restore();
      // 재주가 높으면 단서가 가끔 반짝인다
      const ph = ((now-t0)/1000) % hintEvery; if(hintEvery<99 && ph<0.35 && !G.done){ const o = items.find(x=>x.clue&&!x.got); if(o){ c.save(); c.globalCompositeOperation="lighter"; c.fillStyle=`rgba(200,255,230,${0.8*(1-ph/0.35)})`; c.beginPath(); c.arc(o.x,o.y,2.5,0,7); c.fill(); c.strokeStyle=`rgba(200,255,230,${0.5*(1-ph/0.35)})`; c.beginPath(); c.moveTo(o.x-8,o.y); c.lineTo(o.x+8,o.y); c.moveTo(o.x,o.y-8); c.lineTo(o.x,o.y+8); c.stroke(); c.restore(); } }
      items.forEach(o=>{ if(!o.got) return; c.save(); c.font=`600 11px "Noto Sans KR",sans-serif`; c.textAlign="center"; c.fillStyle = o.clue?"#c8ffe8":"#aaa"; c.globalAlpha = o.clue?1:Math.max(0,1-(now-o.got)/1200); c.fillText(o.nm, o.x, o.y-18); c.restore(); });
      c.strokeStyle="rgba(255,240,200,0.6)"; c.lineWidth=1; c.beginPath(); c.arc(G.lx,G.ly,LR,0,7); c.stroke();
      c.fillStyle="rgba(255,255,255,0.12)"; c.fillRect(20,288,680,4); c.fillStyle="#78ffc8"; c.fillRect(20,288,680*G.left/T,4);
      drawParts(m.c, st);
      raf = requestAnimationFrame(draw);
    }
    ui(); raf = requestAnimationFrame(draw);
  });
}

/* ================= 출동 ================= */
async function dispatch(qid, fids){
  const q = S.requests.find(x=>x.id===qid);
  const team = fids.map(id=>S.fixers.find(x=>x.id===id)).filter(f=>f && canGo(f));
  if(!q || !team.length || team.length>partyMax(q)) return;
  const mental = isMental(q);
  const risky = team.filter(f=>{ const lh=level(f.hp,f.hpMax)[1], lm=level(f.mp,f.mpMax)[1]; return lh==="d" || (mental && lm==="d"); });
  if(risky.length){
    const ok = await confirmBox("위험 상태", `${risky.map(f=>esc(f.name)).join(", ")}의 상태가 위험 단계다. 그래도 보내겠는가?`);
    if(!ok) return;
  }
  // 출동 방식: 직접 수행(기본-25%p에서 미니게임으로 최대 +25%p) / 자동 진행(기본 성공률, 보수 80%)
  const hasGame = q.attrs.some(a=>a!=="wil");
  let mode = "auto";
  if(hasGame){ mode = await chooseMode(q, team); if(!mode) return; }
  team.forEach(f=>f.lastDispatch = S.day);
  const base = rate(team,q); let pr = base, payMul = 1, mgLine = "";
  if(mode==="play"){ const sc = await runMinigames(q, team); pr = clamp(Math.round(base - 25 + 25*sc), 3, 97); mgLine = `미니게임 ${Math.round(sc*100)}점 · 성공률 ${base}% → <b>${pr}%</b>`; }
  else if(hasGame){ payMul = 0.8; mgLine = `자동 진행 · 성공률 ${pr}% · 보수 80%`; }
  const pay = Math.round(q.reward*payMul/100)*100;
  const success = Math.random()*100 < pr;
  const k = dmgFactor(team,q)*shareMul(team.length);
  const names = team.map(f=>f.name).join(", ");
  let lines = [ ...(mgLine?[mgLine]:[]), `${team.length}명 출동 · 성공률 ${pr}% → <b>${success?"성공":"실패"}</b>`];
  team.forEach(f=>{
    const main = (success ? rnd(4,9) : rnd(14,26))*k, minor = rnd(0,2);
    let dH, dM;
    if(mental){ dM = Math.round(main*(1-redMP(f))); dH = minor; } else { dH = Math.round(main*(1-redHP(f))); dM = minor; }
    f.hp = Math.max(0, f.hp-dH); f.mp = Math.max(0, f.mp-dM);
    lines.push(`${esc(f.name)}: 체력 -${dH}, 정신력 -${dM}`);
  });
  S.requests = S.requests.filter(x=>x.id!==qid || (!success && q.kind==="뒤틀림 토벌"));
  if(success){
    S.money += pay; S.todayIncome += pay;
    lines.push(`보수 +${won(pay)}`);
    if(q.grade===S.officeGrade) S.reviewSuccess++;
    team.forEach(f=>{
      f.done++;
      if(q.grade===0 && f.grade===1) f.starCleared = true;
      // 경험: 관련 능력치 +1, 2회마다 능력치 +1, 상위 등급 의뢰는 2배
      const gain = (q.grade < f.grade || (q.grade===0 && f.grade>0)) ? 2 : 1;
      q.attrs.forEach(a=>{
        f.exp[a] += gain;
        while(f.exp[a]>=2){ f.exp[a]-=2; if(f.stats[a]<f.cap){ f.stats[a]++; lines.push(`${esc(f.name)} ${ATTR_NAME[a]} +1 (${f.stats[a]})`);} }
      });
    });
    if(q.loot){ lines.push(`전리품: <b>${esc(q.loot.name)}</b> 획득(관리에서 장착)`); S.inventory = S.inventory||[]; S.inventory.push(q.loot); }
    if(q.kind==="특색 심사") await passColor(team[0]);
  } else {
    lines.push(q.kind==="뒤틀림 토벌" ? "토벌에 실패했다. 뒤틀림은 아직 남아 있다." : "의뢰는 다른 곳으로 넘어갔다.");
    if(q.kind==="특색 심사"){ team[0].unavailUntil = S.day+2; lines.push("심사 실패. 2일간 출동할 수 없다."); }
  }
  await playScene(q.kind, {attr:q.attrs[0], success, team:team.map(f=>f.name), lead:leadGear(team[0]), client:q.client, grade:q.grade, risk:q.risk, hazard:q.hazard});
  playFx(q.kind, `${q.kind} — ${success?"성공":"실패"}`, `${names} · ${q.client}`, success);
  addLog(`[${q.kind}] ${names}: ${q.text} → ${success?"성공":"실패"}${success?" (+"+won(pay)+")":""}${mode==="play"?" · 직접 수행":hasGame?" · 자동":""}`);
  await modal(`${q.kind} 결과`, `<div class="muted">${esc(q.client)} — ${esc(q.text)}</div><p>${lines.join("<br>")}</p>`, [{t:"확인",primary:true}]);
  for(const f of team){ if(!S || S.over) break; if(S.fixers.includes(f)) await checkCollapse(f); }
  if(!S) return;
  delete teamSel[qid];
  save(); render();
  if(S && !S.over) await maybeEndDay();
}

async function checkCollapse(f){
  if(f.hp<=0){
    if(f.isLeader){ return gameOver("대표 사망", `${esc(f.name)}이(가) 숨을 거두었다. 사무소는 그날로 문을 닫았다.`); }
    removeFixer(f, "사망", "체력 소진으로 사망");
    playFx("사망", "사망", f.name, false);
    await modal("사망", `${esc(f.name)}이(가) 돌아오지 못했다. 사무소 인사 기록에 이름이 남는다.`, [{t:"확인"}]);
    return;
  }
  if(f.mp<=0){
    if(f.ego){
      f.mp = Math.round(f.mpMax*0.25); f.unavailUntil = S.day+1;
      await modal("기절", `${esc(f.name)}은(는) E.G.O. 사용 후유증으로 쓰러졌다. 다음 날 출동할 수 없다.`, [{t:"확인"}]);
      return;
    }
    const r = Math.random()*100;
    if(r<45){
      if(f.isLeader) return gameOver("대표 사망", `${esc(f.name)}의 정신이 끝내 버티지 못했다.`);
      removeFixer(f,"사망","정신력 소진으로 사망");
      await modal("사망", `${esc(f.name)}의 정신이 무너졌고, 다시 눈을 뜨지 않았다.`, [{t:"확인"}]);
    } else if(r<75){
      playFx("뒤틀림", "뒤틀림", f.name, false);
      if(f.isLeader) return gameOver("대표 뒤틀림", `${esc(f.name)}은(는) 목소리를 들었다. 사무소의 대표는 더 이상 사람이 아니다.`);
      const g = f.grade, threatGrade = g>=8?6:g>=6?4:g>=3?2:0;
      const [base, req, threat] = REQ_BASE[threatGrade];
      removeFixer(f,"뒤틀림","목소리를 듣고 뒤틀림이 됨");
      S.requests.unshift({id:S.nextId++, kind:"뒤틀림 토벌", attrs:["wil", topAttr(f)==="wil"?"str":topAttr(f)], grade:threatGrade, threat, risk:null,
        client:"하나 협회 (강제 배정)", text:`뒤틀림이 된 ${f.name}을(를) 토벌하라.`, reward:base, req:req+3, deadline:5, loot:null, special:true, distorted:f.name});
      await modal("뒤틀림", `${esc(f.name)}은(는) 목소리를 들었다.<br>사무소에 <b>'뒤틀림 토벌'</b> 의뢰가 강제로 배정되었다. 재해 등급: ${threat}. 기한 5일.<br><span class="muted">기한을 넘기면 다른 사무소가 처리하고, 대표를 제외한 모든 해결사의 정신력이 15% 줄어든다.</span>`, [{t:"확인",primary:true}]);
    } else {
      await bloomEgo(f);
    }
  }
}
async function bloomEgo(f){
  let type;
  const p = PERSONALITIES.find(x=>x[0]===f.personality) || PERSONALITIES[0];
  if(f.isLeader){
    type = await modal("E.G.O. 개화", `${esc(f.name)}의 안에서 무언가가 피어난다. 어떤 형태로 드러낼 것인가?`, [{t:"무기",v:"weapon",primary:true},{t:"방어구",v:"armor"}], true);
  } else type = p[1];
  f.ego = {type, name: f.isLeader ? (await promptBox("E.G.O. 이름", "개화한 E.G.O.의 이름을 정한다.", p[2])) || p[2] : p[2]};
  f.mp = Math.round(f.mpMax*0.5);
  playFx("에고", "E.G.O. 개화", `${f.name} — ${f.ego.name}`, true);
  S.records.push({day:S.day, name:f.name, what:"E.G.O. 개화", note:`${f.ego.name} (${type==="weapon"?"무기":"방어구"})`});
  await modal("E.G.O. 개화", `${esc(f.name)}이(가) <b>${esc(f.ego.name)}</b>(${type==="weapon"?"무기":"방어구"})를 개화했다.<br>전투력이 크게 오르고, 이제 뒤틀림 현상에 휩쓸리지 않는다.`, [{t:"확인",primary:true}]);
}
function removeFixer(f, what, note){
  S.fixers = S.fixers.filter(x=>x.id!==f.id);
  S.records.push({day:S.day, name:f.name, what, note:`${gName(f.grade)} · ${note}`});
  addLog(`${f.name}: ${note}`);
}
async function passColor(f){
  const title = f.isLeader ? ((await promptBox("특색 칭호", "하나 협회가 칭호를 묻는다. 직접 정할 수 있다.", randomColorTitle())) || randomColorTitle()) : randomColorTitle();
  f.grade = 0; f.title = title; f.cap = 80;
  f.unique = f.unique || {};
  S.records.push({day:S.day, name:f.name, what:"특색 지정", note:title});
  playFx("특색 심사", title, f.name, true); save();
  const go = await modal("특색 지정", `${esc(f.name)}이(가) 특색 <b>[${esc(title)}]</b>(으)로 지정되었다.<br>능력치 최대치가 80으로 오르고, <b>고유 장비 제작</b> 칸이 열렸다.<br><span class="muted">공방 → 고유 장비에서 무기·방어구를 한 벌씩 주문 제작할 수 있다.</span>`, [{t:"나중에",v:false},{t:"지금 만들기",v:true,primary:true}]);
  if(go) await openForge(f);
}
function randomColorTitle(){
  let t; do { t = pick(COLOR_WORDS)+" "+pick(COLOR_NOUNS); } while(COLOR_BANNED.includes(t) || S.fixers.some(f=>f.title===t));
  return t;
}

/* ================= 하루 흐름 ================= */
function startDay(first){
  genRequests();
  genRecruits();
  spawnRumors();
  S.todayIncome = 0;
}
async function maybeEndDay(){
  const open = S.requests.length;
  const avail = S.fixers.filter(canGo).length;
  if(open===0 || avail===0) await endDay(open===0 ? "받은 의뢰를 모두 처리했다." : "출동할 수 있는 해결사가 없다.");
}
async function endDay(reason){
  if(!S || S.over || S.ending) return;
  S.ending = true;
  try { await endDayInner(reason); } finally { if(S) S.ending = false; }
}
async function endDayInner(reason){
  const ended = S.day;
  // 회복
  S.fixers.forEach(f=>{ f.hp = Math.min(f.hpMax, f.hp + Math.round(f.hpMax*0.2)); f.mp = Math.min(f.mpMax, f.mp + Math.round(f.mpMax*0.2)); });
  // 마감
  const expired = [];
  S.requests.forEach(q=>{ if(q.deadline!=null){ q.deadline--; if(q.deadline<=0) expired.push(q);} });
  S.requests = S.requests.filter(q=>!expired.includes(q));
  let html = `<p class="muted">${reason||""}</p><div class="kv">
    <span>오늘 수입</span><b>${won(S.todayIncome)}</b>
    <span>보유 자금</span><b>${won(S.money)}</b>
    <span>남은 빚</span><b>${won(S.debt)}</b>
    <span>회복</span><b>전원 체력·정신력 20% 회복</b>
    <span>마감된 의뢰</span><b>${expired.length}건</b></div>`;
  const distortExpired = expired.filter(q=>q.kind==="뒤틀림 토벌");
  if(distortExpired.length){
    S.fixers.forEach(f=>{ if(!f.isLeader) f.mp = Math.max(1, f.mp - Math.round(f.mpMax*0.15)); });
    html += `<p style="color:var(--red)">토벌 기한이 지났다. ${distortExpired.map(q=>esc(q.distorted)).join(", ")}의 뒤틀림은 다른 해결사 사무소가 처리했다. 대표를 제외한 모든 해결사의 정신력이 15% 줄었다.</p>`;
  }
  await modal(`${ended}일차 정산`, html, [{t:"다음으로",primary:true}]);
  if(ended%14===0) await review();
  if(ended%7===0 && S.debt>0) { await scarVisit(); if(!S||S.over) return; }
  if(ended%7===0) await weekly();
  S.day++;
  startDay(false);
  save(); render();
  playFx("아침", `${S.day}일차`, `의뢰 ${S.requests.length}건이 게시판에 올라왔다.`, true);
}

function scarDue(){ return Math.min(S.debt, Math.max(Math.floor(S.money*0.35), 10000)); }
async function scarVisit(){

  const due = scarDue(), paid = S.paidThisWeek||0;

  } else if(S.money<=10000){
    S.scars++;
    html = `<p>[남겨진 흉터]가 사무소 문을 열고 들어왔다. 금고를 들여다보고는 아무 말 없이 손을 뻗었다.</p><p style="color:var(--red)">흉터가 새겨졌다. (${S.scars} / 3)</p>`;
    if(S.scars>=3){ await modal("남겨진 흉터", html, [{t:"..."}]); return gameOver("세 번째 흉터", "세 번째 흉터가 새겨졌다. 사무소의 이름은 장부에서 지워졌다."); }
  } else {
    const take = Math.min(due - paid, S.money, S.debt);
    S.money -= take; S.debt -= take;
    html = `<p>[남겨진 흉터]가 사무소 문을 열고 들어왔다. ${paid>0?"이번 주에 갚은 돈을 빼고, ":""}모자란 만큼을 금고에서 세어 챙긴다.</p><div class="kv"><span>최소 수금액</span><b>${won(due)}</b>${paid>0?`<span>이번 주 상환</span><b>${won(paid)}</b>`:""}<span>수금액</span><b>${won(take)}</b><span>남은 빚</span><b>${won(S.debt)}</b><span>보유 자금</span><b>${won(S.money)}</b></div>`;
    if(S.debt<=0) html += `<p style="color:var(--accent)">마지막 수금이었다. 흉터는 장부를 덮고 돌아갔다. 빚을 모두 갚았다.</p>`;
  }
  S.paidThisWeek = 0;
  addLog(`남겨진 흉터 방문. 남은 빚 ${won(S.debt)}, 흉터 ${S.scars}/3`);
  await modal("남겨진 흉터", html, [{t:"확인",primary:true}]);

}

async function openRepay(){
  if(S.debt<=0) return alertBox("상환", "갚을 빚이 남아 있지 않다.");
  let amt = 0;
  const unitMax = () => Math.floor(Math.min(S.money, S.debt)/10000)*10000;
  const draw = () => {
    const due = scarDue(), paid = S.paidThisWeek||0, left = Math.max(0, due-paid), nv = 7 - ((S.day-1)%7) - 1;
    return `<div class="kv">
      <span>보유 자금</span><b>${won(S.money)}</b>
      <span>남은 빚</span><b>${won(S.debt)}</b>
      <span>이번 주 상환</span><b>${won(paid)}</b>
      <span>흉터 방문</span><b>${nv===0?"오늘 밤":nv+"일 뒤"} · 지금 기준 최소 수금액 ${won(due)} ${left>0?`<span class="muted">(모자란 ${won(left)}은 흉터가 걷어 간다)</span>`:`<span style="color:var(--green)">(이번 주는 걷어 가지 않는다)</span>`}</b>
    </div>
    <p class="muted" style="font-size:12px;margin:10px 0 6px">상환은 1만 안 단위로 언제든 할 수 있다. 그 주에 갚은 돈이 최소 수금액 이상이면 흉터는 걷어 가지 않는다.</p>
    <div class="repay"><div class="amt">${won(amt)}</div>
      <div class="steps">${[[-1000000,"-100만"],[-100000,"-10만"],[-10000,"-1만"],[10000,"+1만"],[100000,"+10만"],[1000000,"+100만"]].map(([v,t])=>`<button data-step="${v}">${t}</button>`).join("")}
      <button data-step="max">최대</button><button data-step="due">최소 수금분</button></div>
      <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:10px">
        ${S.money>=S.debt?`<button data-pay="all">전액 상환 (${won(S.debt)})</button>`:""}
        <button class="primary" data-pay="amt" ${amt<=0?"disabled":""}>${won(amt)} 상환</button></div></div>`;
  };
  await modal("상환", `<div id="rp">${draw()}</div>`, [{t:"닫기"}], false, root=>{
    const box = root.querySelector("#rp");
    root.addEventListener("click", async e=>{
      const st = e.target.dataset.step, py = e.target.dataset.pay;
      if(st){
        const mx = unitMax();
        if(st==="max") amt = mx;
        else if(st==="due") amt = Math.min(mx, Math.ceil(Math.max(0, scarDue()-(S.paidThisWeek||0))/10000)*10000);
        else amt = clamp(amt + (+st), 0, mx);
      } else if(py){
        const pay = py==="all" ? S.debt : amt;
        if(pay<=0 || pay>S.money || pay>S.debt) return;
        S.money -= pay; S.debt -= pay; S.paidThisWeek = (S.paidThisWeek||0) + pay; amt = 0;
        addLog(`빚 ${won(pay)}을 상환했다. 남은 빚 ${won(S.debt)}`);
        save(); render();
        if(S.debt<=0){ closeAll(); await checkRepaid(); save(); render(); return; }
      } else return;
      box.innerHTML = draw();
    });
  });
}

      f.grade--; f.hpMax+=10; f.mpMax+=10; f.hp+=10; f.mp+=10;

      lines.push(`${esc(f.name)}: <b>특색 심사 지명</b>을 받았다.`);

  }

  playFx("심사", "하나 협회 등급 심사", lines.length?"결과가 나왔다.":"변동 없음", true);

function genRecruits(){
  const og = S.officeGrade;
  const n = og>=8?2: og>=5?3:4;
  const top = Math.max(2, og-1);
  S.recruitPool = [];
  for(let i=0;i<n;i++){
    const g = rnd(top, 9);
    const f = newFixer(randomName(), g, genStats(g));
    f.hpMax = f.mpMax = 100 + (9-g)*10; f.hp=f.hpMax; f.mp=f.mpMax;
    f.cost = Math.round(HIRE_COST[g]*(0.9+Math.random()*0.2)/100)*100;
    S.recruitPool.push(f);
  }
}

function gearDesc(g){
  const p=[]; if(g.bonus) Object.entries(g.bonus).forEach(([k,v])=>p.push(`${ATTR_NAME[k]}+${v}`));
  if(g.hpRed) p.push(`체력 피해 -${Math.round(g.hpRed*100)}%`); if(g.mpRed) p.push(`정신력 피해 -${Math.round(g.mpRed*100)}%`);
  return p.join(" · ");
}

/* ================= 공방 ================= */
// 미리보기: 캔버스 하나에 해결사 실루엣을 계속 그린다(캔버스가 화면에서 사라지면 멈춘다)
function animPreview(cv, getOpts){
  const c = cv.getContext("2d");
  const loop = ()=>{
    if(!cv.isConnected) return;
    const d = devicePixelRatio||1, W = cv.clientWidth||300, H = cv.clientHeight||200;
    if(cv.width !== Math.round(W*d)){ cv.width = Math.round(W*d); cv.height = Math.round(H*d); }
    c.setTransform(d,0,0,d,0,0);
    const g = c.createLinearGradient(0,0,0,H); g.addColorStop(0,"#15131c"); g.addColorStop(1,"#0a090d"); c.fillStyle = g; c.fillRect(0,0,W,H);
    const o = getOpts(), t = performance.now()/1000, gy = H*0.9;
    c.fillStyle = "rgba(255,255,255,0.05)"; c.beginPath(); c.ellipse(W/2, gy, W*0.3, H*0.05, 0, 0, 7); c.fill();
    let atk = null;
    if(o.state==="combat"){ const kd = o.weapon ? o.weapon.kind : "none", cat = (WEAPON_KINDS[kd]||{}).cat;
      const pool = kd==="gun" ? ["aim"] : kd==="staff" ? ["spin","smash"] : kd==="fist" || kd==="none" ? ["jab","upper"] : cat==="pierce" ? ["thrust"] : cat==="impact" ? ["smash","swing","upper"] : ["down","up","horiz","diag"];
      const cyc = Math.floor(t/1.8); atk = {style: pool[cyc % pool.length], ph: Math.min(3, atkPhase((t % 1.8) - 0.3, kd==="rapier" ? 3 : 1, timingOf(kd)))}; }
    drawFixer(c, W/2 - (o.state==="combat" ? H*0.08 : 0), gy, H*0.82, {face:1, col:SIDE_COL.ally.fill, state:o.state, weapon:o.weapon, armor:o.armor, atk, acc:o.acc});
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
const STATE_TABS = [["idle","평상"],["combat","전투"],["hurt","부상"]];
const stateOpts = k => ({state:k});
function fixerLook(f){ const lg = leadGear(f); return {weapon: lg.spec, armor: lg.armorSpec, acc: lg.acc ? lg.accColor : null}; }

async function openShop(startTab){
  const tierMax = S.officeGrade<=3?2 : S.officeGrade<=6?1 : 0;
  const colors = () => S.fixers.filter(x=>x.grade===0);
  let who = S.fixers[0]?.id, tab = startTab!=null ? startTab : 0;
  const lockMsg = t => t===1 ? (tierMax<1 ? "6급 사무소부터 거래할 수 있다." : "") : t===2 ? (tierMax<2 ? "3급 사무소부터 거래할 수 있다." : "") : t===3 ? (colors().length ? "" : "특색이 된 해결사가 생기면 열린다.") : "";
  const draw = () => {
    const f = S.fixers.find(x=>x.id===who);
    const tabs = `<div class="tabs">${TIER_NAME.map((t,i)=>`<button data-tab="${i}" class="${i===tab?"on":""}">${t}${lockMsg(i)?" 🔒":""}</button>`).join("")}</div>`;
    if(tab===3){
      const cs = colors();
      return tabs + `<p class="muted" style="font-size:12px">특색이 되면 그 사람만의 고유 장비를 무기·방어구 한 벌씩 주문 제작할 수 있다. 무기/방어구 → 종류 → 생김새 → 확정 순서로 만든다. 만든 장비는 의뢰 연출에도 그대로 나온다.</p>
        ${cs.length ? `<div class="list">${cs.map(x=>{ const u = x.unique||{}, w = x.gear.weapon, a = x.gear.armor;
          return `<div class="item"><div><b>${esc(x.name)}</b> <span class="badge">특색 · ${esc(x.title||"")}</span>
            <div class="d">무기: ${u.weapon && w ? esc(w.name) : "<span style='color:var(--accent)'>제작 가능</span>"} · 방어구: ${u.armor && a ? esc(a.name) : "<span style='color:var(--accent)'>제작 가능</span>"}</div></div>
            <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="primary" data-forge="${x.id}" data-slot="weapon">${u.weapon?"무기 다시 만들기":"무기 제작"}</button><button class="primary" data-forge="${x.id}" data-slot="armor">${u.armor?"방어구 다시 만들기":"방어구 제작"}</button></div></div>`; }).join("")}</div>`
          : `<p class="muted">${lockMsg(3)}</p>`}`;
    }
    const items = SHOP.filter(i=>i.tier===tab), locked = !!lockMsg(tab), makers = [...new Set(items.map(i=>i.maker))];
    return `<div class="field"><label>장착할 사람</label><select id="who">${S.fixers.map(x=>`<option value="${x.id}" ${x.id===who?"selected":""}>${esc(x.name)} (${gName(x.grade)})</option>`).join("")}</select></div>
    ${tabs}
    <p class="muted" style="font-size:12px">${["보통 7급 의뢰까지 쓸 만한 양산품.","원작 세계관의 공방 제품. 보통 4급 의뢰까지 쓸 만하다.","원작 세계관의 고급 공방·인더스트리·아틀리에 제품. 1급 의뢰까지 쓸 만하다."][tab]}</p>
    ${locked?`<p class="muted">${lockMsg(tab)}</p>`:""}
    ${makers.map(mk=>`<h4 class="sh-mk">${esc(mk)} <span class="muted">${esc(MAKERS[mk]||"")}</span></h4>
      <div class="list">${items.filter(i=>i.maker===mk).map(i=>{ const cur=f&&f.gear[i.slot];
        return `<div class="item sh-item">${i.slot==="weapon"?`<canvas class="wicon" data-icon="${i.id}"></canvas>`:`<div class="wicon sh-slot">${{armor:"방어구",acc:"장신구"}[i.slot]}</div>`}
        <div style="flex:1"><b>${esc(i.name)}</b> <span class="badge">${i.slot==="weapon" ? WEAPON_KINDS[i.wtype].n+" · "+WEAPON_KINDS[i.wtype].vars[i.look.v||0] : {armor:"방어구",acc:"장신구"}[i.slot]}</span>
          <div class="d">${gearDesc(i)}</div><div class="d">${won(i.price)}${cur?` · 현재: ${esc(cur.name)}`:""}</div></div>
        <button class="primary" data-buy="${i.id}" ${locked||!f||S.money<i.price||(cur&&cur.unique)?"disabled":""}>${cur&&cur.unique?"고유 장비 착용 중":"구매·장착"}</button></div>`;}).join("")}</div>`).join("")}
    <p class="muted" style="font-size:12px">원래 끼고 있던 장비는 보관함으로 옮겨진다. 공방 이름과 특징만 원작에서 따왔고, 물건과 수치는 이 게임을 위해 만든 것이다.</p>`;
  };
  const paint = box => { box.innerHTML = draw(); box.querySelectorAll("canvas[data-icon]").forEach(cv=>{ const it = SHOP.find(i=>i.id===cv.dataset.icon); drawWeaponIcon(cv, weaponSpecOf(it)); }); };
  await modal("공방", `<div id="sh"></div>`, [{t:"닫기"}], false, root=>{
