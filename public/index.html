<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해결사 사무소 — Problem Solver Office</title>
<style>
:root{
  --bg:#0d0d10; --panel:#16161b; --panel2:#1d1d24; --line:#2c2c36; --text:#e6e1d8; --muted:#8f8a80;
  --accent:#c9a86a; --red:#c94a4a; --yellow:#d8b24a; --green:#7fb069; --violet:#a37ad1; --blue:#6aa0c9;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:#3a2f1c;border-color:var(--accent);color:#f3e3c0}
button.danger{border-color:var(--red);color:#f0b0b0}
input,select{font:inherit;color:var(--text);background:#101014;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.wrap{max-width:1200px;margin:0 auto;padding:12px}
/* top bar */
.topbar{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.topbar .office{font-weight:700;font-size:16px}
.topbar .stat{color:var(--muted)} .topbar .stat b{color:var(--text)}
.scars span{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid var(--red);margin-left:3px;vertical-align:-1px}
.scars span.on{background:var(--red)}
/* stage */
.stage{position:relative;margin-top:10px;height:190px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#07070a}
.stage canvas{width:100%;height:100%;display:block}
.stage .cap{position:absolute;left:0;right:0;bottom:14px;text-align:center;pointer-events:none;text-shadow:0 0 12px #000,0 0 4px #000}
.stage .cap .t{font-size:20px;font-weight:700;letter-spacing:.05em}
.stage .cap .s{font-size:13px;color:#d6cfc2}
.stage{cursor:default}
.fxtest{position:fixed;right:10px;bottom:10px;z-index:60;background:rgba(15,14,18,.95);border:1px solid var(--accent);border-radius:8px;padding:10px;width:250px;font-size:12px}
.fxtest h4{margin:0 0 6px}.fxtest .g{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}.fxtest button{padding:4px 7px;font-size:12px}
/* layout */
.main{display:grid;grid-template-columns:1fr 360px;gap:10px;margin-top:10px}
@media (max-width:900px){.main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.panel h2{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.panel h2 small{color:var(--muted);font-weight:400;font-size:12px}
.reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.req{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.req.special{border-color:var(--accent)} .req.distort{border-color:var(--red)}
.req .head{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.badge.k{color:#111;border:none;font-weight:700}
.req .client{color:var(--muted);font-size:12px}
.req .txt{font-size:13px}
.req .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.req .row b{color:var(--text)}
.req .loot{font-size:12px;color:var(--accent)}
.req .assign{display:flex;gap:6px;margin-top:auto}
.req .assign{justify-content:flex-end}
.req .party{font-size:12px;color:var(--muted)} .req .party b{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:3px 9px;font-size:12px;border-radius:14px;background:#121217}
.chip small{color:var(--muted);font-size:10px}
.chip.on{border-color:var(--accent);background:#3a2f1c;color:#f3e3c0}
.req .est{font-size:12px;color:var(--muted);min-height:18px}
.fixers{display:flex;flex-direction:column;gap:8px}
.fx{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px}
.fx .n{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.fx .n b{font-size:14px} .fx .n span{font-size:12px;color:var(--muted)}
.fx .title{color:var(--accent);font-size:12px}
.bar{height:7px;background:#0b0b0e;border-radius:4px;overflow:hidden;margin:3px 0}
.bar i{display:block;height:100%}
.lv{font-size:11px;margin-left:4px}
.lv.s{color:#a9a59d}.lv.b{color:var(--yellow)}.lv.d{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:12px;margin-top:4px}
.stats div{background:#121217;border-radius:4px;text-align:center;padding:2px 0}
.stats small{color:var(--muted)}
.fx .state{font-size:12px;color:var(--muted);margin-top:4px}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.nav button{flex:1;min-width:110px;padding:10px}
.log{margin-top:10px;max-height:160px;overflow:auto;font-size:12px;color:var(--muted)}
.log div{padding:2px 0;border-bottom:1px dashed #22222a}
.log .rumor{color:#9aa7b8}
footer{margin:18px 0 8px;text-align:center;font-size:12px;color:var(--muted);line-height:1.6}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:640px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal .mh{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.modal .mb{padding:14px 16px;overflow:auto}
.modal .mf{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.item .d{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button.on{border-color:var(--accent);color:var(--accent)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:13px}
.kv span{color:var(--muted)}
.field{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.field label{width:90px;color:var(--muted)}
.field input{flex:1}
.muted{color:var(--muted)}
.big{font-size:22px;font-weight:700}
.start{max-width:560px;margin:40px auto}
/* title */
body.on-title{overflow:hidden}
body.on-title .wrap{padding:0;max-width:none}
body.on-title footer{position:fixed;left:0;right:0;bottom:6px;margin:0;z-index:5;color:rgba(200,190,175,.55);font-size:11px;pointer-events:none;text-shadow:0 0 6px #000}
.title-screen{position:fixed;inset:0;z-index:1;background:#05050a}
.title-screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.title-ui{position:absolute;left:7vw;top:50%;transform:translateY(-55%);transition:opacity .5s,transform .5s}
.title-ui.hide{opacity:0;transform:translate(-30px,-55%);pointer-events:none}
.logo-sub{letter-spacing:.42em;font-size:12px;color:#c9a86a;opacity:.85}
.logo h1{margin:6px 0 4px;font-size:clamp(40px,6.4vw,76px);font-weight:900;letter-spacing:.02em;color:#efe6d4;text-shadow:0 0 30px rgba(201,168,106,.25),0 4px 0 #000}
.logo-tag{color:#a69e90;font-size:14px;letter-spacing:.06em}
.logo-tag::before{content:"";display:inline-block;width:28px;height:1px;background:#c94a4a;vertical-align:middle;margin-right:10px}
.menu{display:flex;flex-direction:column;gap:10px;margin-top:38px;width:260px}
.mbtn{text-align:left;padding:12px 18px;font-size:15px;background:rgba(14,13,18,.72);border:1px solid #2c2a33;border-left:3px solid #3a3740;border-radius:4px;backdrop-filter:blur(4px);transition:all .2s}
.mbtn:hover{border-left-color:#c9a86a;padding-left:24px;background:rgba(30,26,22,.85)}
.mbtn.primary{border-left-color:#c94a4a;color:#f3e3c0;background:rgba(40,22,20,.78)}
.ver{margin-top:26px;font-size:11px;color:#6d675e}
.name-panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,92vw);background:rgba(18,16,22,.92);border:1px solid #2f2c35;border-top:3px solid #c9a86a;border-radius:6px;backdrop-filter:blur(6px);animation:npIn .45s ease}
@keyframes npIn{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
.np-h{padding:14px 18px;border-bottom:1px dashed #34313a;font-weight:800;font-size:17px;display:flex;justify-content:space-between;align-items:baseline}
.np-h span{font-size:11px;color:#8f8a80;font-weight:400;letter-spacing:.1em}
.np-body{padding:14px 18px}.np-body .field label{width:90px}
.np-f{padding:12px 18px;border-top:1px solid #2a2830;display:flex;justify-content:space-between}
.warn{color:#e08a8a;font-size:12px;margin:6px 0 0}
.skip{position:absolute;right:20px;bottom:34px;z-index:6;background:rgba(0,0,0,.5)}
@media (max-width:640px){.title-ui{left:6vw;right:6vw}.menu{width:auto}}
/* achievements */
.ach{display:flex;gap:12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;opacity:.55}
.ach.on{opacity:1;border-color:var(--accent)}
.ach-ic{font-size:22px;color:var(--accent);width:28px;text-align:center}
.ach .d{font-size:12px;color:var(--muted)}
.ach-empty{text-align:center;padding:26px 10px}
.ach-empty-ic{font-size:40px;color:#3a3740;margin-bottom:6px}
.ach-empty .d{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
.repay .amt{font-size:26px;font-weight:800;text-align:center;padding:8px;background:#101014;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;color:#f3e3c0}
.repay .steps{display:flex;flex-wrap:wrap;gap:6px}.repay .steps button{flex:1;min-width:64px}
.mg-bg{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:70;display:flex;align-items:center;justify-content:center;padding:10px}
.mg{width:min(760px,100%);background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:10px;overflow:hidden}
.mg-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line)} .mg-h span{color:var(--muted);font-size:12px}
.mg-desc{padding:8px 14px;font-size:13px;color:#cfc8bb}
.mg-stage{padding:0 14px} .mg-stage canvas{width:100%;aspect-ratio:720/300;display:block;border-radius:6px;background:#000;touch-action:none}
.mg-info{padding:8px 14px;font-size:13px;min-height:44px} .mg-log{font-size:12px;color:var(--muted);margin-top:4px}
.mg-ctrl{display:flex;gap:8px;padding:0 14px 6px} .mg-ctrl button{flex:1;padding:10px;font-size:15px}
.mg-f{display:flex;justify-content:flex-end;padding:6px 14px 12px}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-20px);opacity:0;background:#241d14;border:1px solid var(--accent);color:#f3e3c0;padding:10px 18px;border-radius:6px;z-index:80;transition:all .35s}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

function total(f){ return ATTRS.reduce((s,a)=>s+f.stats[a],0); }
function topAttr(f){ return ATTRS.reduce((b,a)=>f.stats[a]>f.stats[b]?a:b, "str"); }
function alive(){ return S.fixers; }
function leader(){ return S.fixers.find(f=>f.isLeader); }

function genStats(grade){
  // 9급: 최고 11, 나머지 6~10 / 그 외: 등급 구간 안의 총합
  const keys = ATTRS.slice().sort(()=>Math.random()-0.5);
  const st = {};
  if(grade===9){ st[keys[0]]=11; for(let i=1;i<4;i++) st[keys[i]]=rnd(6,10); return st; }
  const lo = PROMO[grade+1]||48, hi = (PROMO[grade]||250)-1;
  const tot = rnd(lo, hi);
  const w = [rnd(32,40), rnd(22,28), rnd(18,24), rnd(14,20)];
  const ws = w.reduce((a,b)=>a+b,0);
  let sum=0; keys.forEach((k,i)=>{ st[k]=Math.max(4,Math.round(tot*w[i]/ws)); sum+=st[k]; });
  st[keys[0]] += tot-sum;
  ATTRS.forEach(a=>st[a]=clamp(st[a],1,70));
  return st;
}

/* ================= 의뢰 생성 ================= */
function makeRequest(grade, opts={}){
  let kind = "일반", attrs;
  if(opts.kind){ kind = opts.kind; attrs = opts.attrs; }
  else {
    const r = Math.random();
    if(r<0.2){ kind="환상체"; attrs=["wil"]; }
    else if(grade<=6 && r<0.45){ if(Math.random()<0.5){kind="호위"; attrs=["str","agi"];} else {kind="수색"; attrs=["agi","tec"];} }
    else { attrs=[pick(["str","agi","tec"])]; }
  }
  const [base, req, threat] = REQ_BASE[grade];
  const key = attrs[0];
  let text, client;
  if(kind==="호위"){ text=pick(ESCORT); client=pick(CLIENTS.agi.concat(CLIENTS.str)); }
  else if(kind==="수색"){ text=pick(SEARCH); client=pick(CLIENTS.tec.concat(CLIENTS.agi)); }
  else { text=pick(TEXTS[key]); client=pick(CLIENTS[key]); }
  const lootChance = kind==="수색"?0.07:kind==="환상체"?0.05:0.03;
  // 환상체 의뢰 일부는 고위험(75% 기준을 넘김)
  const hazard = kind==="환상체" && !opts.kind && Math.random()<0.25;
  const q = {
    id:S.nextId++, kind, attrs, grade, threat, risk: kind==="환상체"?RISK(grade):null, hazard,
    client, text, reward: Math.round(base*(hazard?1.5:1)*(0.85+Math.random()*0.3)/100)*100,
    req: Math.round(req*(hazard?1.25:1)) + rnd(-1,1), deadline: rnd(1,3),
    loot: Math.random()<lootChance*(hazard?2:1) ? Object.assign({},pick(LOOT)) : null, special:false
  };
  return Object.assign(q, opts.over||{});
}
function genRequests(){
  const n = 12 - S.officeGrade; // 9급 3개, 8급 4개, 7급 5개 ...
  if(S.day<=3){
    // 초반 3일: 각 해결사의 가장 높은 능력치에 맞춘 쉬운 의뢰(성공률 90% 이상)
    for(let i=0;i<n;i++){
      const f = S.fixers[i % S.fixers.length], a = topAttr(f);
      const g = f.grade>=9 || i>=S.fixers.length ? 9 : Math.max(S.officeGrade, f.grade);
      const q = makeRequest(g, {kind: a==="wil"?"환상체":"일반", attrs:[a]});
      q.req = Math.max(3, power(f,[a]) - 4 - rnd(0,1));
      S.requests.push(q);
    }
    return;
  }
  for(let i=0;i<n;i++){
    const r = Math.random();
    const g = clamp(S.officeGrade + (r<0.5?0:r<0.8?1:2), S.officeGrade, 9);
    S.requests.push(makeRequest(g));
  }
  // 1급 사무소: 가끔 도시의 별 지명 의뢰
  if(S.officeGrade===1 && Math.random()<0.1 && !S.requests.some(q=>q.grade===0&&q.kind==="지명")){
    const a = pick(ATTRS), b = pick(ATTRS.filter(x=>x!==a));
    S.requests.push(makeRequest(0,{kind:"지명",attrs:[a,b],over:{deadline:null,special:true,client:"익명의 의뢰인",text:"도시의 별 등급 위협을 처리해 달라. 아는 자는 적을수록 좋다."}}));
  }
}

/* ================= 판정 ================= */
// 의뢰 등급별 [권장 인원, 최대 인원]
const PARTY = {9:[1,2],8:[1,2],7:[2,3],6:[2,3],5:[2,4],4:[3,4],3:[3,5],2:[3,5],1:[4,5],0:[4,5]};
const partyRec = q => q.kind==="특색 심사" ? 1 : PARTY[q.grade][0];
const partyMax = q => q.kind==="특색 심사" ? 1 : PARTY[q.grade][1];
function gearList(f){ return [f.gear.weapon,f.gear.armor,f.gear.acc].filter(Boolean); }
function power(f, attrs){
  let p = attrs.reduce((s,a)=>s+f.stats[a],0)/attrs.length;
  gearList(f).forEach(g=>{ if(g.bonus) p += attrs.reduce((s,a)=>s+(g.bonus[a]||0),0)/attrs.length; });
  if(f.ego) p += f.ego.type==="weapon" ? 8 : 3;
  return p;
}
// 팀 전력: 가장 강한 1명 + 나머지의 40%
function teamPower(team, attrs){ const ps = team.map(f=>power(f,attrs)).sort((a,b)=>b-a); return ps[0] + 0.4*ps.slice(1).reduce((s,v)=>s+v,0); }
function redHP(f){ let r=0; gearList(f).forEach(g=>r+=g.hpRed||0); if(f.ego&&f.ego.type==="armor") r+=0.35; return Math.min(r,0.7); }
function redMP(f){ let r=0; gearList(f).forEach(g=>r+=g.mpRed||0); if(f.ego&&f.ego.type==="armor") r+=0.35; return Math.min(r,0.7); }
// 요구치와 같으면 75%, 넘을수록 높아짐(요구치가 클수록 1점의 무게는 작아짐)
function rate(team, q){ const P = teamPower(team,q.attrs); return clamp(Math.round(75 + (P-q.req)*4*15/Math.max(15,q.req)), 5, 97); }
function isMental(q){ return q.attrs.includes("wil") && (q.kind==="환상체"||q.kind==="뒤틀림 토벌"||q.attrs[0]==="wil"); }
function dmgFactor(team,q){ const P = teamPower(team,q.attrs); return clamp(1 + (q.req-P)/Math.max(10,q.req)*2, 0.5, 2.5); }
const shareMul = n => n<=1 ? 1 : 1/(0.7*n);
function estimate(team,q){
  const k = dmgFactor(team,q)*shareMul(team.length), mental = isMental(q);
  const red = team.reduce((s,f)=>s+(mental?redMP(f):redHP(f)),0)/team.length;
  const s = [Math.round(4*k*(1-red)), Math.round(9*k*(1-red))];
  const l = [Math.round(14*k*(1-red)), Math.round(26*k*(1-red))];
  return {rate:rate(team,q), stat: mental?"정신력":"체력", s, l};
}
function canGo(f){ return f.lastDispatch!==S.day && f.unavailUntil < S.day; }
function level(cur,max){ const p = cur/max*100; return p>=60?["안정","s"]:p>30?["나쁨","b"]:["위험","d"]; }

/* ================= 장비 정보(연출용) ================= */
function weaponTypeOf(g){ if(!g) return null; if(g.wtype) return g.wtype; const s = SHOP.find(i=>i.name===g.name); return s ? s.wtype : "blade"; }
function leadGear(f){
  if(!f) return null; const w = f.gear.weapon, acc = f.gear.acc;
  return { wtype: weaponTypeOf(w), weaponName: w ? w.name : null, armor: !!f.gear.armor, acc: !!acc,
           accColor: acc && acc.mpRed ? "180,150,255" : "150,230,255", ego: !!f.ego };
}

      <span>직접 수행</span><b>${games.map(a=>MG_NAME[a]).join(" → ")}<br><span class="muted">성공률 ${lo}%에서 시작해 미니게임 결과에 따라 최대 ${base}%까지 오른다</span></b>
      <span>자동 진행</span><b>성공률 ${base}% 그대로 · <span style="color:var(--yellow)">보수 80%</span></b></div>`,
    [{t:"취소", v:null}, {t:"자동 진행", v:"auto"}, {t:"직접 수행", v:"play", primary:true}]);
}
async function runMinigames(q, team){
  const games = q.attrs.filter(a=>a!=="wil"); let sum = 0;
  for(let i=0;i<games.length;i++){
    const a = games[i], ctx = {q, team, idx:i+1, total:games.length};
    sum += a==="str" ? await mgCombat(ctx) : a==="agi" ? await mgCircles(ctx) : await mgClues(ctx);
  }
  return games.length ? sum/games.length : 0;
}

/* ================= 미니게임 공통 창 ================= */
function mgOpen(title, desc, ctx){
  const bg = document.createElement("div"); bg.className = "mg-bg";
  bg.innerHTML = `<div class="mg"><div class="mg-h"><b>${title}</b><span>${ctx.total>1?`미니게임 ${ctx.idx} / ${ctx.total} · `:""}${esc(ctx.q.client)}</span></div>

    <div class="mg-info"></div><div class="mg-ctrl"></div><div class="mg-f"><button class="mg-quit">포기</button></div></div>`;
  document.body.appendChild(bg);

  const d = Math.min(2, devicePixelRatio||1); cvs.width = 720*d; cvs.height = 300*d; c.setTransform(d,0,0,d,0,0);
  const pos = e => { const r = cvs.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*720, y:(e.clientY-r.top)/r.height*300}; };

function mgResult(m, score, text){

    m.quit.onclick = ()=>{ m.close(); res(score); }; setTimeout(()=>{ if(document.body.contains(m.bg)){ m.close(); res(score); } }, 1800); });
}
const powK = (ctx, a) => clamp(teamPower(ctx.team, [a]) / Math.max(1, ctx.q.req), 0.55, 1.7);

/* ---- 물리: 짧은 턴제 전투 ----
   적의 다음 행동(강공/연타/빈틈)을 보고 공격·방어·회피를 고른다. 4턴 안에 적 무리의 체력을 깎는다.
   근력·무기(팀 전력)가 피해량을, 방어구가 받는 피해를 정한다. */
function mgCombat(ctx){
  return new Promise(resolve=>{
    const m = mgOpen("정면 돌파 · 전투", "적의 다음 행동을 보고 대응한다. <b>강공</b>은 방어, <b>연타</b>는 회피, <b>빈틈</b>에는 공격이 유리하다.", ctx);
    const k = powK(ctx,"str"), lead = ctx.team[0], lg = leadGear(lead);
    const armorRed = ctx.team.reduce((s,f)=>s+redHP(f),0)/ctx.team.length;
    const st = {}, S2 = {foeHP:100, teamHP:100, turn:1, max:4, dealt:0, busy:false, anim:null, done:false, log:[]};
    const INT = [{id:"heavy", t:"크게 휘두르려 한다", c:"#ff8a5a"}, {id:"quick", t:"빠르게 찌르려 한다", c:"#ffd35a"}, {id:"open", t:"자세가 무너졌다 · 빈틈", c:"#9fe8b0"}];
    const pickIntent = () => { const r=Math.random(); return r<0.4?INT[0]:r<0.75?INT[1]:INT[2]; };
    S2.intent = pickIntent();
    const D = 28*k, wname = lg && lg.weaponName ? `[${lg.weaponName}]` : "맨손";
    const n = Math.max(1,Math.min(5,ctx.team.length));
    function act(a){
      if(S2.busy || S2.done) return; S2.busy = true;
      const it = S2.intent.id; let deal=0, take=0, txt="";
      const heavy = 40/Math.sqrt(k)*(1-armorRed), quick = 25/Math.sqrt(k)*(1-armorRed);
      if(it==="heavy"){ if(a==="def"){ deal=D*0.8; txt="강공을 막아 내고 받아친다"; } else if(a==="atk"){ deal=D; take=heavy; txt="정면으로 맞부딪친다"; } else { txt="강공을 피했지만 거리가 벌어졌다"; } }
      if(it==="quick"){ if(a==="eva"){ deal=D*1.0; txt="연타를 흘리고 파고든다"; } else if(a==="atk"){ deal=D; take=quick; txt="찔리면서도 밀어붙인다"; } else { take=quick*0.4; txt="막았지만 몇 대 허용했다"; } }
      if(it==="open"){ if(a==="atk"){ deal=D*2; txt="빈틈에 일격을 꽂는다"; } else { txt="기회를 놓쳤다"; } }
      deal = Math.round(deal*(0.9+Math.random()*0.2)); take = Math.round(take*(0.9+Math.random()*0.2));
      S2.foeHP = Math.max(0, S2.foeHP-deal); S2.dealt += deal; S2.teamHP = Math.max(0, S2.teamHP-take);
      S2.log.unshift(`${S2.turn}턴: ${txt}${deal?` · 적 -${deal}`:""}${take?` · 아군 -${take}`:""}${deal&&a!=="def"&&a!=="eva"?` (${wname})`:""}`);
      S2.anim = {t0: performance.now()/1000, deal, take, a};
      if(deal) sparks(st, 520, 190, 18+deal/3, "#ffd9a0", 4, 0.7); if(take){ sparks(st, 200, 190, 14, "#ff6a6a", 3.5, 0.6); st.shake = 6+take/6; } else if(deal) st.shake = 3+deal/10;
      setTimeout(()=>{ S2.busy=false; S2.turn++;
        if(S2.foeHP<=0 || S2.teamHP<=0 || S2.turn>S2.max){ S2.done = true; finish(); } else { S2.intent = pickIntent(); ui(); } }, 750);
      ui();
    }
    function ui(){
      m.info.innerHTML = `<span>턴 <b>${Math.min(S2.turn,S2.max)}</b> / ${S2.max}</span> · 적의 기색: <b style="color:${S2.intent.c}">${S2.intent.t}</b><div class="mg-log">${S2.log.slice(0,3).map(x=>`<div>${x}</div>`).join("")}</div>`;
      m.ctrl.innerHTML = [["atk","공격"],["def","방어"],["eva","회피"]].map(([v,l])=>`<button class="primary" data-a="${v}" ${S2.busy||S2.done?"disabled":""}>${l}</button>`).join("");
    }
    m.ctrl.onclick = e=>{ const a=e.target.dataset.a; if(a) act(a); };
    m.quit.onclick = ()=>{ if(S2.done) return; S2.done=true; cancelAnimationFrame(raf); m.close(); resolve(0); };
    function finish(){ const score = clamp(0.7*Math.min(1,S2.dealt/100) + 0.3*S2.teamHP/100, 0, 1);
      setTimeout(()=>{ cancelAnimationFrame(raf); mgResult(m, score, S2.foeHP<=0 ? "적 무리를 제압했다" : S2.teamHP<=0 ? "밀려났다" : "시간이 다 됐다").then(resolve); }, 500); }
    let raf; const t0 = performance.now()/1000;
    function draw(){
      const t = performance.now()/1000 - t0, c = m.c, W=720, H=300;
      c.save(); if(st.shake>0.2){ c.translate((Math.random()-0.5)*st.shake,(Math.random()-0.5)*st.shake); st.shake*=0.85; }
      const gy = streetBG(c, W, H, t, st);
      const fh = 78, an = S2.anim, at = an ? performance.now()/1000 - an.t0 : 9;
      const lunge = an && an.deal && at<0.5 ? Math.sin(at/0.5*Math.PI)*120 : 0;
      const recoil = an && an.take && at<0.5 ? -Math.sin(at/0.5*Math.PI)*16 : 0;
      for(let i=n-1;i>=0;i--) fig(c, 190 - i*34 + (i===0?lunge+recoil:recoil*0.6), gy, fh*(i===0?1:0.92), {face:1, weapon:true, wRot:-0.4, coat:i===0, gear:i===0?lg:null, rim:"rgba(255,210,150,0.6)"});
      const foeShake = an && an.deal && at<0.4 ? (Math.random()-0.5)*6 : 0, alive = S2.foeHP/100;
      for(let i=0;i<3;i++){ const down = alive < (i+1)/3.2 ? 1 : 0; fig(c, 500+i*48+foeShake, gy, fh*(0.92+i*0.03), {face:-1, weapon:true, wRot:0.7, rot: down?1.3:0, alpha: down?0.5:1, rim:"rgba(255,90,90,0.45)"}); }
      if(an && an.deal) weaponFx(c, st, {lead:lg}, at+1, 1, 190+lunge+20, gy-fh*0.62, 500, gy-fh*0.6);
      // 적 기색 표시
      if(!S2.done){ c.save(); c.font=`700 13px "Noto Sans KR",sans-serif`; c.textAlign="center"; c.fillStyle=S2.intent.c; c.shadowColor=S2.intent.c; c.shadowBlur=10; c.fillText(S2.intent.t, 548, gy-fh-34+Math.sin(t*4)*2); c.restore(); }
      // 체력 막대
      const bar=(x,y,w,v,col,label)=>{ c.fillStyle="rgba(0,0,0,0.6)"; c.fillRect(x,y,w,9); c.fillStyle=col; c.fillRect(x,y,w*v/100,9); c.strokeStyle="rgba(255,255,255,0.2)"; c.strokeRect(x,y,w,9); c.fillStyle="#ddd"; c.font=`600 11px "Noto Sans KR",sans-serif`; c.fillText(label,x,y-4); };
      bar(40, 26, 220, S2.teamHP, "#7fb069", `해결사 (${S2.teamHP})`); bar(460, 26, 220, S2.foeHP, "#c94a4a", `적 무리 (${S2.foeHP})`);
      drawParts(c, st); vignette(c, W, H); c.restore();
      raf = requestAnimationFrame(draw);
    }
    ui(); raf = requestAnimationFrame(draw);
  });
}

/* ---- 속도: 화면에 나타나는 원을 시간 안에 누른다 ----
   민첩(팀 전력)이 높을수록 원이 크고 오래 남는다. 빈 곳을 누르면 감점. */
function mgCircles(ctx){
  return new Promise(resolve=>{
    const m = mgOpen("추격 · 원 누르기", "나타나는 원이 사라지기 전에 누른다. 빈 곳을 누르면 감점된다.", ctx);
    const k = powK(ctx,"agi"), N = 10, life = clamp(1100*Math.pow(k,0.8), 650, 1600), R = clamp(22*Math.sqrt(k), 15, 32), gap = 520;
    const st = {}, G = {hits:0, miss:0, spawned:0, list:[], start: performance.now()+1200, done:false}; if(FXTEST) window.__mg = G;
    let raf;
    m.cvs.style.cursor = "crosshair";
    m.cvs.addEventListener("pointerdown", e=>{
      if(G.done || performance.now() < G.start) return; const p = m.pos(e), now = performance.now();
      const hit = G.list.find(o=>!o.hit && !o.gone && Math.hypot(o.x-p.x, o.y-p.y) <= o.r+4);
      if(hit){ hit.hit = now; G.hits++; sparks(st, hit.x, hit.y, 16, "#cfeaff", 3.2, 0.5, 0.05); }
      else { G.miss++; G.flash = now; }
      ui();
    });
    m.quit.onclick = ()=>{ if(G.done) return; G.done=true; cancelAnimationFrame(raf); m.close(); resolve(0); };
    function ui(){ m.info.innerHTML = `명중 <b>${G.hits}</b> / ${N} · 헛손질 <b style="color:var(--red)">${G.miss}</b> <span class="muted">(민첩 보정: 원 크기 ${Math.round(R)} · 유지 ${(life/1000).toFixed(1)}초)</span>`; }
    function finish(){ G.done = true; const score = clamp((G.hits - 0.5*G.miss)/N, 0, 1); setTimeout(()=>{ cancelAnimationFrame(raf); mgResult(m, score, G.hits>=8?"표적을 붙잡았다":G.hits>=5?"아슬아슬하게 따라붙었다":"표적을 놓쳤다").then(resolve); }, 400); }
    const t0 = performance.now();
    function draw(){
      const now = performance.now(), t=(now-t0)/1000, c=m.c, W=720, H=300;
      let g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,"#07070c"); g.addColorStop(1,"#1a1420"); c.fillStyle=g; c.fillRect(0,0,W,H);
      c.strokeStyle="rgba(200,215,240,0.13)"; c.beginPath(); for(let i=0;i<30;i++){ const y=(i*37.3)%H, x=((i*173 - t*900)%W+W)%W; c.moveTo(x,y); c.lineTo(x+50+i%5*20,y); } c.stroke();
      c.fillStyle="#0c0b10"; for(let i=0;i<8;i++){ const x=((i*120 - t*500)%(W+160)+W+160)%(W+160)-80; c.fillRect(x, H-40-(i%3)*12, 100, 60); }
      if(now < G.start){ c.save(); c.font=`800 40px "Noto Sans KR",sans-serif`; c.textAlign="center"; c.fillStyle="#9fd6ff"; c.shadowColor="#9fd6ff"; c.shadowBlur=20; c.fillText(Math.ceil((G.start-now)/400) > 2 ? "준비" : "출발!", W/2, H/2+14); c.restore(); }
      else if(!G.done){
        if(G.spawned < N && now - (G.lastSpawn||0) > gap){ G.lastSpawn = now; G.spawned++; G.list.push({x: 40+Math.random()*(W-80), y: 40+Math.random()*(H-80), t0: now, r: R}); }
        if(G.spawned>=N && G.list.every(o=>o.hit||o.gone)) finish();
      }
      G.list.forEach(o=>{ const a=(now-o.t0)/life; if(!o.hit && a>=1) o.gone = true; if(o.gone && !o.hit) return;
        if(o.hit){ const h=(now-o.hit)/300; if(h>1) return; c.strokeStyle=`rgba(200,240,255,${1-h})`; c.lineWidth=3; c.beginPath(); c.arc(o.x,o.y,o.r+h*20,0,7); c.stroke(); return; }
        c.save(); c.shadowColor="#9fd6ff"; c.shadowBlur=14; c.fillStyle="rgba(120,190,255,0.18)"; c.beginPath(); c.arc(o.x,o.y,o.r,0,7); c.fill();
        c.strokeStyle="rgba(170,220,255,0.95)"; c.lineWidth=2; c.beginPath(); c.arc(o.x,o.y,o.r,0,7); c.stroke();
        c.strokeStyle="rgba(255,255,255,0.8)"; c.lineWidth=3; c.beginPath(); c.arc(o.x,o.y,o.r+6,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-a)); c.stroke(); c.restore(); });
      if(G.flash && now-G.flash<200){ c.fillStyle=`rgba(200,40,40,${0.25*(1-(now-G.flash)/200)})`; c.fillRect(0,0,W,H); }
      // 남은 표적 막대
      c.fillStyle="rgba(255,255,255,0.1)"; c.fillRect(20,H-12,W-40,4); c.fillStyle="#9fd6ff"; c.fillRect(20,H-12,(W-40)*(1-G.spawned/N),4);
      drawParts(c, st); vignette(c, W, H, "rgba(0,0,0,0.5)");
      raf = requestAnimationFrame(draw);
    }
    ui(); raf = requestAnimationFrame(draw);
  });
}

/* ---- 정밀: 손전등으로 현장을 비춰 단서를 모은다 ----
   재주(팀 전력)가 높을수록 손전등이 넓고, 시간이 길고, 단서가 가끔 반짝여 위치를 알려 준다. 잡동사니는 시간을 빼앗는다. */
function mgClues(ctx){
  return new Promise(resolve=>{
    const m = mgOpen("현장 조사 · 단서 찾기", "손전등으로 어두운 현장을 비추며 단서를 눌러 모은다. 잡동사니를 누르면 시간을 잃는다.", ctx);
    const k = powK(ctx,"tec"), T = clamp(7+4*(k-1), 6, 11), LR = clamp(62*k, 42, 95), decoyN = k<0.9?3:k<1.2?2:1, hintEvery = k>=1.25?1.2:k>=0.95?2.0:99;
    const NAMES = ["발자국","탄피","찢긴 장부","의수 나사","피 묻은 천","부러진 열쇠","젖은 영수증"], JUNK = ["빈 깡통","신문지","병뚜껑","담배꽁초"];
    const items = [], place = () => { for(let tries=0;tries<200;tries++){ const x=60+Math.random()*600, y=70+Math.random()*190; if(items.every(o=>Math.hypot(o.x-x,o.y-y)>70)) return {x,y}; } return {x:360,y:150}; };
    NAMES.sort(()=>Math.random()-0.5).slice(0,5).forEach(nm=>items.push(Object.assign(place(),{nm, clue:true})));
    JUNK.sort(()=>Math.random()-0.5).slice(0,decoyN).forEach(nm=>items.push(Object.assign(place(),{nm, clue:false})));
    const G = {lx:360, ly:150, left:T, found:0, done:false, msg:"", msgT:0}, st = {}; if(FXTEST) window.__clue = {G, items};
    const mask = document.createElement("canvas"); mask.width=720; mask.height=300; const mc = mask.getContext("2d");
    const bgc = document.createElement("canvas"); bgc.width=720; bgc.height=300; const b = bgc.getContext("2d");
    // 방 배경(한 번만 그림)
    let g=b.createLinearGradient(0,0,0,300); g.addColorStop(0,"#2a2530"); g.addColorStop(1,"#1d1a22"); b.fillStyle=g; b.fillRect(0,0,720,300);
    for(let x=0;x<720;x+=18){ b.fillStyle=(x/18)%2?"rgba(255,255,255,0.025)":"rgba(0,0,0,0.06)"; b.fillRect(x,0,18,185); }
    b.fillStyle="#232027"; b.fillRect(0,185,720,115); b.strokeStyle="rgba(255,255,255,0.05)"; for(let i=-14;i<=14;i++){ b.beginPath(); b.moveTo(360+i*22,185); b.lineTo(360+i*70,300); b.stroke(); }
    b.fillStyle="#141218"; b.fillRect(430,120,150,14); b.fillRect(436,134,6,51); b.fillRect(568,134,6,51); b.fillRect(640,40,60,145); b.fillRect(40,60,70,125);
    b.fillStyle="#3a3240"; b.fillRect(560,30,60,60); b.fillStyle="#141218"; b.fillRect(589,30,2,60); b.fillRect(560,59,60,2);
    let last = performance.now(), raf;
    const move = e=>{ const p=m.pos(e); G.lx=p.x; G.ly=p.y; };
    m.cvs.addEventListener("pointermove", move); m.cvs.style.cursor="none";
    m.cvs.addEventListener("pointerdown", e=>{ move(e); if(G.done) return;
      const it = items.find(o=>!o.got && Math.hypot(o.x-G.lx,o.y-G.ly)<18 && Math.hypot(o.x-G.lx,o.y-G.ly)<LR);
      if(!it) return; it.got = performance.now();
      if(it.clue){ G.found++; sparks(st, it.x, it.y, 14, "#b8ffe2", 2.5, 0.6, 0.02); G.msg=`단서 발견: ${it.nm}`; }
      else { G.left = Math.max(0, G.left-0.8); G.msg=`${it.nm} — 쓸모없는 잡동사니 (-0.8초)`; }
      G.msgT = performance.now(); ui(); if(G.found>=5) finish("단서를 모두 모았다"); });
    m.quit.onclick = ()=>{ if(G.done) return; G.done=true; cancelAnimationFrame(raf); m.close(); resolve(0); };
    function ui(){ m.info.innerHTML = `단서 <b>${G.found}</b> / 5 · 남은 시간 <b>${G.left.toFixed(1)}초</b> <span class="muted">(재주 보정: 손전등 ${Math.round(LR)} · 시간 ${T.toFixed(0)}초${hintEvery<99?" · 반짝임 힌트":""})</span>${G.msg && performance.now()-G.msgT<1500?`<div class="mg-log"><div>${G.msg}</div></div>`:""}`; }
    function finish(txt){ if(G.done) return; G.done=true; const score = G.found/5; setTimeout(()=>{ cancelAnimationFrame(raf); mgResult(m, score, txt).then(resolve); }, 500); }
    const t0 = performance.now();
    function draw(){
      const now = performance.now(), dt = (now-last)/1000; last = now; const c = m.c;
      if(!G.done){ G.left -= dt; if(G.left<=0){ G.left=0; finish(G.found>=3?"시간이 다 됐다":"단서가 끊겼다"); } }
      if(Math.floor(now/250)!==G.tick){ G.tick=Math.floor(now/250); ui(); }
      c.drawImage(bgc,0,0,720,300);
      items.forEach(o=>{ c.save(); c.translate(o.x,o.y);
        c.fillStyle = o.clue ? "#c9b48a" : "#8a8580"; c.strokeStyle="rgba(0,0,0,0.6)";
        c.beginPath(); c.ellipse(0,0,9,5,0.3,0,7); c.fill(); c.stroke(); c.fillRect(-3,-7,6,4); c.restore();
        if(o.got && o.clue){ c.save(); c.strokeStyle="rgba(120,255,200,0.95)"; c.lineWidth=1.5; c.shadowColor="#78ffc8"; c.shadowBlur=10; c.beginPath(); c.arc(o.x,o.y,14,0,7); c.stroke(); c.restore(); } });
      // 어둠과 손전등
      mc.globalCompositeOperation="source-over"; mc.clearRect(0,0,720,300); mc.fillStyle="rgba(3,3,5,0.988)"; mc.fillRect(0,0,720,300);
      mc.globalCompositeOperation="destination-out"; const lg=mc.createRadialGradient(G.lx,G.ly,0,G.lx,G.ly,LR); lg.addColorStop(0,"rgba(0,0,0,1)"); lg.addColorStop(0.7,"rgba(0,0,0,0.85)"); lg.addColorStop(1,"rgba(0,0,0,0)");

      c.drawImage(mask,0,0,720,300);
      c.save(); c.globalCompositeOperation="lighter"; const warm=c.createRadialGradient(G.lx,G.ly,0,G.lx,G.ly,LR); warm.addColorStop(0,"rgba(255,230,180,0.12)"); warm.addColorStop(1,"rgba(0,0,0,0)"); c.fillStyle=warm; c.fillRect(G.lx-LR,G.ly-LR,LR*2,LR*2); c.restore();
      // 재주가 높으면 단서가 가끔 반짝인다
      const ph = ((now-t0)/1000) % hintEvery; if(hintEvery<99 && ph<0.35 && !G.done){ const o = items.find(x=>x.clue&&!x.got); if(o){ c.save(); c.globalCompositeOperation="lighter"; c.fillStyle=`rgba(200,255,230,${0.8*(1-ph/0.35)})`; c.beginPath(); c.arc(o.x,o.y,2.5,0,7); c.fill(); c.strokeStyle=`rgba(200,255,230,${0.5*(1-ph/0.35)})`; c.beginPath(); c.moveTo(o.x-8,o.y); c.lineTo(o.x+8,o.y); c.moveTo(o.x,o.y-8); c.lineTo(o.x,o.y+8); c.stroke(); c.restore(); } }
      items.forEach(o=>{ if(!o.got) return; c.save(); c.font=`600 11px "Noto Sans KR",sans-serif`; c.textAlign="center"; c.fillStyle = o.clue?"#c8ffe8":"#aaa"; c.globalAlpha = o.clue?1:Math.max(0,1-(now-o.got)/1200); c.fillText(o.nm, o.x, o.y-18); c.restore(); });
      c.strokeStyle="rgba(255,240,200,0.6)"; c.lineWidth=1; c.beginPath(); c.arc(G.lx,G.ly,LR,0,7); c.stroke();
      c.fillStyle="rgba(255,255,255,0.12)"; c.fillRect(20,288,680,4); c.fillStyle="#78ffc8"; c.fillRect(20,288,680*G.left/T,4);
      drawParts(m.c, st);

}

/* ================= 출동 ================= */
async function dispatch(qid, fids){
  const q = S.requests.find(x=>x.id===qid);
  const team = fids.map(id=>S.fixers.find(x=>x.id===id)).filter(f=>f && canGo(f));
  if(!q || !team.length || team.length>partyMax(q)) return;
  const mental = isMental(q);
  const risky = team.filter(f=>{ const lh=level(f.hp,f.hpMax)[1], lm=level(f.mp,f.mpMax)[1]; return lh==="d" || (mental && lm==="d"); });
  if(risky.length){
    const ok = await confirmBox("위험 상태", `${risky.map(f=>esc(f.name)).join(", ")}의 상태가 위험 단계다. 그래도 보내겠는가?`);
    if(!ok) return;
  }
  // 출동 방식: 직접 수행(기본-25%p에서 미니게임으로 최대 +25%p) / 자동 진행(기본 성공률, 보수 80%)
  const hasGame = q.attrs.some(a=>a!=="wil");
  let mode = "auto";
  if(hasGame){ mode = await chooseMode(q, team); if(!mode) return; }
  team.forEach(f=>f.lastDispatch = S.day);
  const base = rate(team,q); let pr = base, payMul = 1, mgLine = "";
  if(mode==="play"){ const sc = await runMinigames(q, team); pr = clamp(Math.round(base - 25 + 25*sc), 3, 97); mgLine = `미니게임 ${Math.round(sc*100)}점 · 성공률 ${base}% → <b>${pr}%</b>`; }
  else if(hasGame){ payMul = 0.8; mgLine = `자동 진행 · 성공률 ${pr}% · 보수 80%`; }
  const pay = Math.round(q.reward*payMul/100)*100;
  const success = Math.random()*100 < pr;
  const k = dmgFactor(team,q)*shareMul(team.length);
  const names = team.map(f=>f.name).join(", ");
  let lines = [ ...(mgLine?[mgLine]:[]), `${team.length}명 출동 · 성공률 ${pr}% → <b>${success?"성공":"실패"}</b>`];
  team.forEach(f=>{
    const main = (success ? rnd(4,9) : rnd(14,26))*k, minor = rnd(0,2);
    let dH, dM;
    if(mental){ dM = Math.round(main*(1-redMP(f))); dH = minor; } else { dH = Math.round(main*(1-redHP(f))); dM = minor; }
    f.hp = Math.max(0, f.hp-dH); f.mp = Math.max(0, f.mp-dM);
    lines.push(`${esc(f.name)}: 체력 -${dH}, 정신력 -${dM}`);
  });
  S.requests = S.requests.filter(x=>x.id!==qid || (!success && q.kind==="뒤틀림 토벌"));
  if(success){
    S.money += pay; S.todayIncome += pay;
    lines.push(`보수 +${won(pay)}`);
    if(q.grade===S.officeGrade) S.reviewSuccess++;
    team.forEach(f=>{
      f.done++;
      if(q.grade===0 && f.grade===1) f.starCleared = true;
      // 경험: 관련 능력치 +1, 2회마다 능력치 +1, 상위 등급 의뢰는 2배
      const gain = (q.grade < f.grade || (q.grade===0 && f.grade>0)) ? 2 : 1;
      q.attrs.forEach(a=>{
        f.exp[a] += gain;
        while(f.exp[a]>=2){ f.exp[a]-=2; if(f.stats[a]<f.cap){ f.stats[a]++; lines.push(`${esc(f.name)} ${ATTR_NAME[a]} +1 (${f.stats[a]})`);} }
      });
    });
    if(q.loot){ lines.push(`전리품: <b>${esc(q.loot.name)}</b> 획득(관리에서 장착)`); S.inventory = S.inventory||[]; S.inventory.push(q.loot); }
    if(q.kind==="특색 심사") await passColor(team[0]);
  } else {
    lines.push(q.kind==="뒤틀림 토벌" ? "토벌에 실패했다. 뒤틀림은 아직 남아 있다." : "의뢰는 다른 곳으로 넘어갔다.");
    if(q.kind==="특색 심사"){ team[0].unavailUntil = S.day+2; lines.push("심사 실패. 2일간 출동할 수 없다."); }
  }
  await playScene(q.kind, {attr:q.attrs[0], success, team:team.map(f=>f.name), lead:leadGear(team[0]), client:q.client, grade:q.grade, risk:q.risk, hazard:q.hazard});
  playFx(q.kind, `${q.kind} — ${success?"성공":"실패"}`, `${names} · ${q.client}`, success);
  addLog(`[${q.kind}] ${names}: ${q.text} → ${success?"성공":"실패"}${success?" (+"+won(pay)+")":""}${mode==="play"?" · 직접 수행":hasGame?" · 자동":""}`);
  await modal(`${q.kind} 결과`, `<div class="muted">${esc(q.client)} — ${esc(q.text)}</div><p>${lines.join("<br>")}</p>`, [{t:"확인",primary:true}]);
  for(const f of team){ if(!S || S.over) break; if(S.fixers.includes(f)) await checkCollapse(f); }
  if(!S) return;
  delete teamSel[qid];
  save(); render();
  if(S && !S.over) await maybeEndDay();
}

async function checkCollapse(f){
  if(f.hp<=0){
    if(f.isLeader){ return gameOver("대표 사망", `${esc(f.name)}이(가) 숨을 거두었다. 사무소는 그날로 문을 닫았다.`); }
    removeFixer(f, "사망", "체력 소진으로 사망");
    playFx("사망", "사망", f.name, false);
    await modal("사망", `${esc(f.name)}이(가) 돌아오지 못했다. 사무소 인사 기록에 이름이 남는다.`, [{t:"확인"}]);
    return;
  }
  if(f.mp<=0){
    if(f.ego){
      f.mp = Math.round(f.mpMax*0.25); f.unavailUntil = S.day+1;
      await modal("기절", `${esc(f.name)}은(는) E.G.O. 사용 후유증으로 쓰러졌다. 다음 날 출동할 수 없다.`, [{t:"확인"}]);
      return;
    }
    const r = Math.random()*100;
    if(r<45){
      if(f.isLeader) return gameOver("대표 사망", `${esc(f.name)}의 정신이 끝내 버티지 못했다.`);
      removeFixer(f,"사망","정신력 소진으로 사망");
      await modal("사망", `${esc(f.name)}의 정신이 무너졌고, 다시 눈을 뜨지 않았다.`, [{t:"확인"}]);
    } else if(r<75){
      playFx("뒤틀림", "뒤틀림", f.name, false);
      if(f.isLeader) return gameOver("대표 뒤틀림", `${esc(f.name)}은(는) 목소리를 들었다. 사무소의 대표는 더 이상 사람이 아니다.`);
      const g = f.grade, threatGrade = g>=8?6:g>=6?4:g>=3?2:0;
      const [base, req, threat] = REQ_BASE[threatGrade];
      removeFixer(f,"뒤틀림","목소리를 듣고 뒤틀림이 됨");
      S.requests.unshift({id:S.nextId++, kind:"뒤틀림 토벌", attrs:["wil", topAttr(f)==="wil"?"str":topAttr(f)], grade:threatGrade, threat, risk:null,
        client:"하나 협회 (강제 배정)", text:`뒤틀림이 된 ${f.name}을(를) 토벌하라.`, reward:base, req:req+3, deadline:5, loot:null, special:true, distorted:f.name});
      await modal("뒤틀림", `${esc(f.name)}은(는) 목소리를 들었다.<br>사무소에 <b>'뒤틀림 토벌'</b> 의뢰가 강제로 배정되었다. 재해 등급: ${threat}. 기한 5일.<br><span class="muted">기한을 넘기면 다른 사무소가 처리하고, 대표를 제외한 모든 해결사의 정신력이 15% 줄어든다.</span>`, [{t:"확인",primary:true}]);
    } else {
      await bloomEgo(f);
    }
  }
}
async function bloomEgo(f){
  let type;
  const p = PERSONALITIES.find(x=>x[0]===f.personality) || PERSONALITIES[0];
  if(f.isLeader){
    type = await modal("E.G.O. 개화", `${esc(f.name)}의 안에서 무언가가 피어난다. 어떤 형태로 드러낼 것인가?`, [{t:"무기",v:"weapon",primary:true},{t:"방어구",v:"armor"}], true);
  } else type = p[1];
  f.ego = {type, name: f.isLeader ? (await promptBox("E.G.O. 이름", "개화한 E.G.O.의 이름을 정한다.", p[2])) || p[2] : p[2]};
  f.mp = Math.round(f.mpMax*0.5);
  playFx("에고", "E.G.O. 개화", `${f.name} — ${f.ego.name}`, true);
  S.records.push({day:S.day, name:f.name, what:"E.G.O. 개화", note:`${f.ego.name} (${type==="weapon"?"무기":"방어구"})`});
  await modal("E.G.O. 개화", `${esc(f.name)}이(가) <b>${esc(f.ego.name)}</b>(${type==="weapon"?"무기":"방어구"})를 개화했다.<br>전투력이 크게 오르고, 이제 뒤틀림 현상에 휩쓸리지 않는다.`, [{t:"확인",primary:true}]);
}
function removeFixer(f, what, note){
  S.fixers = S.fixers.filter(x=>x.id!==f.id);

  addLog(`${f.name}: ${note}`);
}
async function passColor(f){

function randomColorTitle(){

}

/* ================= 하루 흐름 ================= */
function startDay(first){
  genRequests();
  genRecruits();
  spawnRumors();
  S.todayIncome = 0;
}
async function maybeEndDay(){
  const open = S.requests.length;
  const avail = S.fixers.filter(canGo).length;
  if(open===0 || avail===0) await endDay(open===0 ? "받은 의뢰를 모두 처리했다." : "출동할 수 있는 해결사가 없다.");
}
async function endDay(reason){
  if(!S || S.over || S.ending) return;
  S.ending = true;
  try { await endDayInner(reason); } finally { if(S) S.ending = false; }
}
async function endDayInner(reason){
  const ended = S.day;
  // 회복
  S.fixers.forEach(f=>{ f.hp = Math.min(f.hpMax, f.hp + Math.round(f.hpMax*0.2)); f.mp = Math.min(f.mpMax, f.mp + Math.round(f.mpMax*0.2)); });
  // 마감
  const expired = [];
  S.requests.forEach(q=>{ if(q.deadline!=null){ q.deadline--; if(q.deadline<=0) expired.push(q);} });
  S.requests = S.requests.filter(q=>!expired.includes(q));
  let html = `<p class="muted">${reason||""}</p><div class="kv">
    <span>오늘 수입</span><b>${won(S.todayIncome)}</b>
    <span>보유 자금</span><b>${won(S.money)}</b>
    <span>남은 빚</span><b>${won(S.debt)}</b>
    <span>회복</span><b>전원 체력·정신력 20% 회복</b>
    <span>마감된 의뢰</span><b>${expired.length}건</b></div>`;
  const distortExpired = expired.filter(q=>q.kind==="뒤틀림 토벌");
  if(distortExpired.length){
    S.fixers.forEach(f=>{ if(!f.isLeader) f.mp = Math.max(1, f.mp - Math.round(f.mpMax*0.15)); });
    html += `<p style="color:var(--red)">토벌 기한이 지났다. ${distortExpired.map(q=>esc(q.distorted)).join(", ")}의 뒤틀림은 다른 해결사 사무소가 처리했다. 대표를 제외한 모든 해결사의 정신력이 15% 줄었다.</p>`;
  }
  await modal(`${ended}일차 정산`, html, [{t:"다음으로",primary:true}]);
  if(ended%14===0) await review();
  if(ended%7===0 && S.debt>0) { await scarVisit(); if(!S||S.over) return; }
  if(ended%7===0) await weekly();
  S.day++;
  startDay(false);
  save(); render();
  playFx("아침", `${S.day}일차`, `의뢰 ${S.requests.length}건이 게시판에 올라왔다.`, true);
}
async function weekly(){
  await modal("주간 보고", `<div class="kv"><span>보유 자금</span><b>${won(S.money)}</b><span>남은 빚</span><b>${won(S.debt)}</b><span>흉터 경고</span><b>${S.scars} / 3</b><span>소속 해결사</span><b>${S.fixers.length}명</b></div>`, [{t:"확인"}]);

// 매주 수금: 그 주에 스스로 갚은 돈이 '최소 수금액'(보유 자금의 35%, 최소 1만 안)에 못 미치면 모자란 만큼 뜯어 간다
function scarDue(){ return Math.min(S.debt, Math.max(Math.floor(S.money*0.35), 10000)); }
async function scarVisit(){
  let html;
  playFx("흉터", "남겨진 흉터", "수금하러 왔다.", false);
  const due = scarDue(), paid = S.paidThisWeek||0;

    html = `<p>[남겨진 흉터]가 사무소 문을 열고 들어왔다. 장부를 넘겨 이번 주 상환 내역을 확인하더니, 아무것도 건드리지 않고 돌아갔다.</p><div class="kv"><span>이번 주 상환</span><b>${won(paid)}</b><span>최소 수금액</span><b>${won(due)}</b><span>남은 빚</span><b>${won(S.debt)}</b></div>`;
  } else if(S.money<=10000){
    S.scars++;
    html = `<p>[남겨진 흉터]가 사무소 문을 열고 들어왔다. 금고를 들여다보고는 아무 말 없이 손을 뻗었다.</p><p style="color:var(--red)">흉터가 새겨졌다. (${S.scars} / 3)</p>`;
    if(S.scars>=3){ await modal("남겨진 흉터", html, [{t:"..."}]); return gameOver("세 번째 흉터", "세 번째 흉터가 새겨졌다. 사무소의 이름은 장부에서 지워졌다."); }
  } else {
    const take = Math.min(due - paid, S.money, S.debt);
    S.money -= take; S.debt -= take;
    html = `<p>[남겨진 흉터]가 사무소 문을 열고 들어왔다. ${paid>0?"이번 주에 갚은 돈을 빼고, ":""}모자란 만큼을 금고에서 세어 챙긴다.</p><div class="kv"><span>최소 수금액</span><b>${won(due)}</b>${paid>0?`<span>이번 주 상환</span><b>${won(paid)}</b>`:""}<span>수금액</span><b>${won(take)}</b><span>남은 빚</span><b>${won(S.debt)}</b><span>보유 자금</span><b>${won(S.money)}</b></div>`;
    if(S.debt<=0) html += `<p style="color:var(--accent)">마지막 수금이었다. 흉터는 장부를 덮고 돌아갔다. 빚을 모두 갚았다.</p>`;
  }
  S.paidThisWeek = 0;
  addLog(`남겨진 흉터 방문. 남은 빚 ${won(S.debt)}, 흉터 ${S.scars}/3`);
  await modal("남겨진 흉터", html, [{t:"확인",primary:true}]);
  await checkRepaid();
}
async function checkRepaid(){
  if(S.debt<=0 && !S.repaidShown){ S.repaidShown=true; S.records.push({day:S.day,name:S.officeName,what:"빚 청산",note:"남겨진 흉터의 장부가 닫혔다"}); await modal("빚 청산", "사무소의 빚을 모두 갚았다. 이제부터는 도시의 강자가 될 차례다. 게임은 계속된다.", [{t:"계속",primary:true}]); }

async function openRepay(){
  if(S.debt<=0) return alertBox("상환", "갚을 빚이 남아 있지 않다.");
  let amt = 0;
  const unitMax = () => Math.floor(Math.min(S.money, S.debt)/10000)*10000;
  const draw = () => {
    const due = scarDue(), paid = S.paidThisWeek||0, left = Math.max(0, due-paid), nv = 7 - ((S.day-1)%7) - 1;
    return `<div class="kv">
      <span>보유 자금</span><b>${won(S.money)}</b>

      <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:10px">

        <button class="primary" data-pay="amt" ${amt<=0?"disabled":""}>${won(amt)} 상환</button></div></div>`;
  };
  await modal("상환", `<div id="rp">${draw()}</div>`, [{t:"닫기"}], false, root=>{
    const box = root.querySelector("#rp");
    root.addEventListener("click", async e=>{
      const st = e.target.dataset.step, py = e.target.dataset.pay;
      if(st){
        const mx = unitMax();
        if(st==="max") amt = mx;
        else if(st==="due") amt = Math.min(mx, Math.ceil(Math.max(0, scarDue()-(S.paidThisWeek||0))/10000)*10000);
        else amt = clamp(amt + (+st), 0, mx);
      } else if(py){
        const pay = py==="all" ? S.debt : amt;
        if(pay<=0 || pay>S.money || pay>S.debt) return;
        S.money -= pay; S.debt -= pay; S.paidThisWeek = (S.paidThisWeek||0) + pay; amt = 0;
        addLog(`빚 ${won(pay)}을 상환했다. 남은 빚 ${won(S.debt)}`);
        save(); render();
        if(S.debt<=0){ closeAll(); await checkRepaid(); save(); render(); return; }
      } else return;
      box.innerHTML = draw();
    });
  });
}
async function review(){
  const lines = [];
  S.fixers.forEach(f=>{
    if(f.grade>=2 && total(f)>=PROMO[f.grade]){
      f.grade--; f.hpMax+=10; f.mpMax+=10; f.hp+=10; f.mp+=10;
      lines.push(`${esc(f.name)}: ${gName(f.grade+1)} → <b>${gName(f.grade)}</b>`);
      S.records.push({day:S.day,name:f.name,what:"승급",note:gName(f.grade)});
    }
  });
  // 특색 심사 지명
  S.fixers.forEach(f=>{
    if(f.grade===1 && total(f)>COLOR_REQ_TOTAL && f.starCleared && !S.requests.some(q=>q.kind==="특색 심사"&&q.target===f.id) && Math.random()<0.3){
      const a = pick(ATTRS), b = pick(ATTRS.filter(x=>x!==a));
      S.requests.unshift({id:S.nextId++, kind:"특색 심사", attrs:[a,b], grade:0, threat:"도시의 별", risk:null, client:"하나 협회",
        text:`${f.name}에 대한 특색 심사. 홀로 출동해야 한다.`, reward:REQ_BASE[0][0], req:79, deadline:null, loot:null, special:true, target:f.id});
      lines.push(`${esc(f.name)}: <b>특색 심사 지명</b>을 받았다.`);
    }
  });
  // 사무소
  const L = leader(), target = S.officeGrade-1;
  let off = "";
  if(S.officeGrade>1){
    const needOk = L && L.grade<=target && L.grade!==null;
    const doneOk = S.reviewSuccess>=10;
    if(needOk && doneOk){ S.officeGrade--; off = `<p style="color:var(--accent)">사무소가 <b>${gName(S.officeGrade)} 사무소</b>로 승급했다.</p>`; S.records.push({day:S.day,name:S.officeName,what:"사무소 승급",note:gName(S.officeGrade)}); }
    else off = `<p class="muted">사무소 승급 조건: 대표 ${gName(target)} 이상(${L?(L.grade<=target?"충족":"미충족"):"-"}), 지난 14일 ${gName(S.officeGrade)} 의뢰 성공 10건(${S.reviewSuccess}건).</p>`;
  }
  S.reviewSuccess = 0;
  playFx("심사", "하나 협회 등급 심사", lines.length?"결과가 나왔다.":"변동 없음", true);
  await modal("하나 협회 등급 심사", (lines.length? lines.join("<br>") : "<span class='muted'>승급한 해결사가 없다.</span>")+off, [{t:"확인",primary:true}]);
}

function genRecruits(){
  const og = S.officeGrade;
  const n = og>=8?2: og>=5?3:4;
  const top = Math.max(2, og-1);
  S.recruitPool = [];
  for(let i=0;i<n;i++){
    const g = rnd(top, 9);
    const f = newFixer(randomName(), g, genStats(g));
    f.hpMax = f.mpMax = 100 + (9-g)*10; f.hp=f.hpMax; f.mp=f.mpMax;
    f.cost = Math.round(HIRE_COST[g]*(0.9+Math.random()*0.2)/100)*100;
    S.recruitPool.push(f);
  }
}

function gearDesc(g){
  const p=[]; if(g.bonus) Object.entries(g.bonus).forEach(([k,v])=>p.push(`${ATTR_NAME[k]}+${v}`));

  return p.join(" · ");
}

/* ================= 모달 ================= */
let modalStack = [];
function modal(title, body, buttons, returnValue, onMount){
  return new Promise(res=>{
    const bg = document.createElement("div"); bg.className="modal-bg";
    bg.innerHTML = `<div class="modal"><div class="mh">${title}</div><div class="mb">${body}</div><div class="mf"></div></div>`;
    const mf = bg.querySelector(".mf");
    buttons.forEach(b=>{ const el=document.createElement("button"); el.textContent=b.t; if(b.primary) el.className="primary"; if(b.danger) el.className="danger";
      el.onclick=()=>{ close(); res(b.v!==undefined?b.v:true); }; mf.appendChild(el); });
    const close = ()=>{ bg.remove(); modalStack = modalStack.filter(x=>x!==close); };
    modalStack.push(()=>{ bg.remove(); res(null); });
    document.getElementById("modal-root").appendChild(bg);
    if(onMount) onMount(bg);
  });
}
function closeAll(){ modalStack.slice().forEach(c=>c()); modalStack=[]; }
const confirmBox = (t,b) => modal(t, b, [{t:"취소",v:false},{t:"확인",v:true,primary:true}]);
const alertBox = (t,b) => modal(t, b, [{t:"확인",primary:true}]);
function promptBox(title, label, def, allowRandom){
  return new Promise(res=>{
    modal(title, `<p class="muted">${label}</p><div class="field"><input id="pb" value="${esc(def||"")}" maxlength="400">${allowRandom?'<button id="pbr">랜덤</button>':""}</div>`,
      [{t:"취소",v:"__c"},{t:"확인",v:"__ok",primary:true}], false, root=>{
        const i=root.querySelector("#pb"); i.focus(); i.select();
        const r=root.querySelector("#pbr"); if(r) r.onclick=()=>{ i.value = title.includes("특색")?randomColorTitle():randomName(); };
        i.addEventListener("keydown",e=>{ if(e.key==="Enter") root.querySelector(".mf .primary").click(); });
        root.querySelector(".mf .primary").addEventListener("click",()=>res(i.value.trim()), {capture:true});
        root.querySelector(".mf button").addEventListener("click",()=>res(null), {capture:true});
      });
  });
}

const teamSel = {};
function updateCard(qid){
  const q = S.requests.find(x=>x.id==qid); if(!q) return;
  const sel = teamSel[qid]||[], app=document.getElementById("app");
  app.querySelectorAll(`[data-q="${qid}"].chip`).forEach(c=>c.classList.toggle("on", sel.includes(+c.dataset.chip)));
  const pc = app.querySelector("#pc-"+qid); if(pc) pc.textContent = sel.length;
  const est = app.querySelector("#est-"+qid), go = app.querySelector(`[data-go="${qid}"]`);
  if(!est) return;
  const team = sel.map(id=>S.fixers.find(f=>f.id===id)).filter(Boolean);
  if(!team.length){ est.innerHTML=`<span class="muted">해결사를 골라 출동시킨다.</span>`; go.disabled=true; return; }
  const m = estimate(team,q);
  est.innerHTML = `예상 성공률 <b style="color:${m.rate>=75?"var(--green)":m.rate>=50?"var(--yellow)":"var(--red)"}">${m.rate}%</b> · 1인당 ${m.stat} 피해 성공 ${m.s[0]}~${m.s[1]} / 실패 ${m.l[0]}~${m.l[1]}`;
  go.disabled=false;
}

  const app = document.getElementById("app");
  app.innerHTML = `<div class="topbar"></div>
   <div class="stage"><canvas id="cv"></canvas><div class="cap"><div class="t" id="capt"></div><div class="s" id="caps"></div></div></div>

  app.addEventListener("click", e=>{

    const chip = e.target.closest(".chip");
    if(chip){
      const qid=+chip.dataset.q, fid=+chip.dataset.chip, q=S.requests.find(x=>x.id===qid); if(!q) return;
      const sel = teamSel[qid] = teamSel[qid]||[];
      if(sel.includes(fid)) sel.splice(sel.indexOf(fid),1);
      else if(sel.length < partyMax(q)){
        sel.push(fid);
        Object.keys(teamSel).forEach(k=>{ if(+k!==qid && teamSel[k].includes(fid)){ teamSel[k]=teamSel[k].filter(x=>x!==fid); updateCard(+k); } });
      }
      updateCard(qid); return;
    }
    if(d.go){ if(scene || document.querySelector(".modal-bg")) return; const sel = teamSel[d.go]||[]; if(sel.length) dispatch(+d.go, sel.slice()); }
    if(d.nav==="recruit") openRecruit(); if(d.nav==="manage") openManage(); if(d.nav==="shop") openShop(); if(d.nav==="records") openRecords(); if(d.nav==="ach") openAchievements(); if(d.nav==="repay") openRepay();
    if(e.target.id==="endday"){ (async()=>{ if(S.requests.length && S.fixers.some(canGo)){ if(!await confirmBox("하루 끝내기","아직 처리하지 않은 의뢰와 출동 가능한 해결사가 있다. 하루를 끝낼까?")) return; } await endDay("하루를 마쳤다."); })(); }
  });
}

/* ================= 타이틀 연출 ================= */
const Title = {
  cv:null, cx:null, raf:0, W:0, H:0, dpr:1, mx:0, my:0, tx:0, ty:0, zoom:0, zoomT:0,
  start(cv){
    this.cv=cv; this.cx=cv.getContext("2d"); this.resize(); this.build();
    this.onResize=()=>{ this.resize(); this.build(); }; window.addEventListener("resize", this.onResize);
    this.onMove=e=>{ this.tx=(e.clientX/innerWidth-0.5); this.ty=(e.clientY/innerHeight-0.5); }; window.addEventListener("pointermove", this.onMove);
    this.op=null; this.t0=performance.now();
    const f=now=>{ this.frame(now); this.raf=requestAnimationFrame(f); }; this.raf=requestAnimationFrame(f);
  },
  stop(){ cancelAnimationFrame(this.raf); window.removeEventListener("resize", this.onResize); window.removeEventListener("pointermove", this.onMove); this.cv=null; },
  focus(v){ this.zoomT=v?0.08:0; },
  resize(){ const r=this.cv.getBoundingClientRect(); this.dpr=Math.min(2,devicePixelRatio||1); this.W=r.width; this.H=r.height; this.cv.width=r.width*this.dpr; this.cv.height=r.height*this.dpr; },
  build(){
    const W=this.W,H=this.H, R=(a,b)=>a+Math.random()*(b-a);
    const ground=H*0.84; this.ground=ground;
    // 둥지의 거대 건물(원경)
    this.towers=[]; let x=-40;
    while(x<W+80){ const w=R(50,120), h=R(H*0.45,H*0.8);
      const strips=[]; for(let i=0;i<Math.floor(w/14);i++) strips.push({x:R(4,w-6), a:R(0.05,0.35), p:R(0,6)});
      this.towers.push({x,w,h,steps:Math.floor(R(1,4)),strips,blink:R(0,6)}); x+=w+R(10,70); }
    this.beams=[{x:W*R(0.15,0.3),p:R(0,6),s:R(0.15,0.25)},{x:W*R(0.65,0.85),p:R(0,6),s:R(0.12,0.2)}];
    // 뒷골목 건물(중경)
    const SIGNS=["국밥","수리","전당포","의수 정비","약국","24시","여관","당구","노래방","해결사","부품","세탁"];
    const NEON=["#ff5a5a","#5ad1ff","#ffd35a","#9b7bff","#5aff9e","#ff8ad8"];
    this.mids=[]; x=-30;
    while(x<W+60){ const w=R(60,140), h=R(H*0.22,H*0.48), wins=[];
      for(let wy=14;wy<h-30;wy+=16) for(let wx=8;wx<w-12;wx+=14) if(Math.random()<0.35) wins.push({x:wx,y:wy,c:Math.random()<0.8?"warm":"cold",p:R(0,50)});
      const sign = Math.random()<0.55 ? {t:pick(SIGNS),c:pick(NEON),y:R(20,Math.max(30,h*0.5)),v:Math.random()<0.5,fl:R(0,1)} : null;
      this.mids.push({x,w,h,wins,sign,tank:Math.random()<0.3,ant:Math.random()<0.3}); x+=w+R(0,8); }
    // 옥상 위 해결사 실루엣이 설 건물
    this.perch = this.mids.reduce((b,m)=> (m.x>W*0.55&&m.x<W*0.85&&(!b||m.h>b.h))?m:b, null) || this.mids[Math.floor(this.mids.length*0.7)];
    // 근경 전선
    this.wires=[]; for(let i=0;i<4;i++) this.wires.push({y1:R(H*0.05,H*0.3),y2:R(H*0.05,H*0.3),sag:R(20,60)});
    this.rain=[]; for(let i=0;i<Math.floor(W*H/6000);i++) this.rain.push({x:Math.random()*W,y:Math.random()*H,v:R(10,18),l:R(8,18),z:R(0.4,1)});
    this.drops=[]; this.fog=[R(0,1000),R(0,1000),R(0,1000)];
  },
  frame(now){
    if(!this.cv) return;
    const cx=this.cx, W=this.W, H=this.H, t=(now-this.t0)/1000, d=this.dpr;
    this.mx+=(this.tx-this.mx)*0.04; this.my+=(this.ty-this.my)*0.04; this.zoom+=(this.zoomT-this.zoom)*0.05;
    cx.setTransform(d,0,0,d,0,0);
    if(this.op){ this.drawOpening(t); return; }
    this.drawCity(t, 1+this.zoom, W*0.7, this.ground);
  },
  drawCity(t, scale, fx, fy, dim=0){
    const cx=this.cx, W=this.W, H=this.H, g=this.ground;
    cx.save(); cx.translate(fx,fy); cx.scale(scale,scale); cx.translate(-fx,-fy);
    // 하늘
    let sk=cx.createLinearGradient(0,0,0,H); sk.addColorStop(0,"#05050a"); sk.addColorStop(0.55,"#12101c"); sk.addColorStop(1,"#241a22");
    cx.fillStyle=sk; cx.fillRect(-W,-H,W*3,H*3);
    // 둥지의 빛(지평선 위 붉은 띠)
    const hz=cx.createRadialGradient(W*0.5,g,0,W*0.5,g,W*0.7); hz.addColorStop(0,"rgba(190,90,60,0.28)"); hz.addColorStop(1,"rgba(0,0,0,0)");
    cx.fillStyle=hz; cx.fillRect(-W,-H,W*3,H*3);
    // 탐조등
    this.beams.forEach(b=>{ const a=Math.sin(t*b.s+b.p)*0.5; cx.save(); cx.translate(b.x-this.mx*10,g-H*0.55); cx.rotate(a);
      const bg=cx.createLinearGradient(0,0,0,-H); bg.addColorStop(0,"rgba(220,230,255,0.07)"); bg.addColorStop(1,"rgba(220,230,255,0)");
      cx.fillStyle=bg; cx.beginPath(); cx.moveTo(-3,0); cx.lineTo(-H*0.09,-H*1.3); cx.lineTo(H*0.09,-H*1.3); cx.lineTo(3,0); cx.fill(); cx.restore(); });
    // 원경: 둥지 타워
    const ox1=-this.mx*12, oy1=-this.my*4;
    this.towers.forEach(tw=>{ const x=tw.x+ox1, y=g-tw.h*0.95+oy1;
      cx.fillStyle="#141420"; cx.fillRect(x,y,tw.w,tw.h);
      for(let s=1;s<=tw.steps;s++){ const iw=tw.w*(1-s*0.2); cx.fillRect(x+(tw.w-iw)/2,y-s*12,iw,12); }
      tw.strips.forEach(s=>{ const a=s.a*(0.6+0.4*Math.sin(t*0.7+s.p)); cx.fillStyle=`rgba(170,190,255,${a})`; cx.fillRect(x+s.x,y+6,1.5,tw.h-10); });
      const top=y-tw.steps*12; if(Math.sin(t*2+tw.blink)>0.6){ cx.fillStyle="#ff3b3b"; cx.beginPath(); cx.arc(x+tw.w/2,top-3,2,0,7); cx.fill(); }
    });
    // 안개 1
    this.fogBand(t, g-H*0.28, H*0.25, 0.22, 0);
    // 중경: 뒷골목
    const ox2=-this.mx*28, oy2=-this.my*8;
    this.mids.forEach(m=>{ const x=m.x+ox2, y=g-m.h+oy2;
      cx.fillStyle="#0e0d12"; cx.fillRect(x,y,m.w,m.h+40);
      cx.fillStyle="#17151c"; cx.fillRect(x,y,m.w,3);

    const lpx=sx+sw*0.5, lpy=sy+sh*0.42; cx.strokeStyle="#0d0907"; cx.lineWidth=1.5; cx.beginPath(); cx.moveTo(lpx,sy); cx.lineTo(lpx,lpy); cx.stroke();

/* ================= 연출(상단) ================= */
let cv, cx, skyline=[], rain=[], fx={t:0,color:"#c9a86a",kind:"",good:true};
let loopOn=false;
function resizeStage(){ if(!cv) return; const r=cv.getBoundingClientRect(); cv.width=Math.max(1,r.width*devicePixelRatio); cv.height=Math.max(1,r.height*devicePixelRatio); buildSky(); }
function initStage(){
  cv = document.getElementById("cv"); cx = cv.getContext("2d");
  resizeStage();
  if(loopOn) return; loopOn=true;
  window.addEventListener("resize", resizeStage);
  document.addEventListener("click", e=>{ if(scene && e.target.closest(".stage")) endScene(); });
  for(let i=0;i<90;i++) rain.push({x:Math.random(),y:Math.random(),v:0.6+Math.random()*0.8});
  requestAnimationFrame(loop);
}
function buildSky(){
  skyline=[]; const W=cv.width,H=cv.height;
  [0.35,0.55,0.8].forEach((depth,li)=>{
    let x=-20;
    while(x<W+20){ const w=(30+Math.random()*70)*devicePixelRatio*(0.6+depth*0.5), h=H*(0.25+Math.random()*0.45)*(0.5+depth*0.6);
      const wins=[]; for(let wy=8;wy<h-6;wy+=9*devicePixelRatio) for(let wx=5;wx<w-6;wx+=8*devicePixelRatio) if(Math.random()<0.18) wins.push([wx,wy,Math.random()]);
      skyline.push({x,w,h,layer:li,depth,wins}); x+=w+Math.random()*6*devicePixelRatio; }
  });
}
function playFx(kind, title, sub, good){
  fx = {t:performance.now(), kind, good, color: kind==="흉터"||kind==="뒤틀림"||kind==="사망"||kind==="종료" ? "#c94a4a" : kind==="에고"?"#f4e6b8" : KIND_COLOR[kind] || "#c9a86a"};
  const t=document.getElementById("capt"), s=document.getElementById("caps");
  if(t){ t.textContent=title; t.style.color=fx.color; s.textContent=sub||""; }
}
function loop(now){
  if(!cx){ return; }
  if(scene && drawScene(now)){ requestAnimationFrame(loop); return; }
  const W=cv.width,H=cv.height; const age=(now-fx.t)/1000;
  const g=cx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#0a0a12"); g.addColorStop(1,"#14121a"); cx.fillStyle=g; cx.fillRect(0,0,W,H);
  // 은은한 빛무리
  const glow = Math.max(0, 1-age/3);
  if(glow>0){ const rg=cx.createRadialGradient(W/2,H*0.55,0,W/2,H*0.55,W*0.5); rg.addColorStop(0,fx.color+"55"); rg.addColorStop(1,"transparent"); cx.globalAlpha=glow; cx.fillStyle=rg; cx.fillRect(0,0,W,H); cx.globalAlpha=1; }
  const shake = (fx.kind==="뒤틀림"||fx.kind==="흉터") && age<1.2 ? (1.2-age)*6*devicePixelRatio : 0;
  for(let L=0;L<3;L++){ skyline.forEach(b=>{ if(b.layer!==L) return;
    const off = Math.sin(now/4000+b.depth)*2*b.depth + (shake? (Math.random()-0.5)*shake:0);
    const shade = Math.round(10+b.layer*9);
    cx.fillStyle=`rgb(${shade},${shade},${shade+6})`;
    cx.fillRect(b.x+off, H-b.h, b.w, b.h);
    b.wins.forEach(w=>{ const fl = 0.5+0.5*Math.sin(now/700+w[2]*40); if(fl<0.15) return; cx.fillStyle=`rgba(232,200,130,${0.25+0.5*fl*b.depth})`; cx.fillRect(b.x+off+w[0], H-b.h+w[1], 3*devicePixelRatio, 4*devicePixelRatio); });
  }); if(L<2) drawRumors(now, L); }
  // 비
  cx.strokeStyle="rgba(170,180,200,0.18)"; cx.lineWidth=1*devicePixelRatio; cx.beginPath();
  rain.forEach(r=>{ r.y+=0.012*r.v; if(r.y>1){r.y=0;r.x=Math.random();} const x=r.x*W,y=r.y*H; cx.moveTo(x,y); cx.lineTo(x-3*devicePixelRatio,y+12*devicePixelRatio); }); cx.stroke();
  // 뒤틀림: 화면 조각 어긋남
  if(fx.kind==="뒤틀림" && age<2.5){ for(let i=0;i<6;i++){ const y=Math.random()*H, h=6+Math.random()*20; cx.drawImage(cv,0,y,W,h,(Math.random()-0.5)*40*devicePixelRatio,y,W,h);} }
  // 에고/특색: 위로 솟는 빛줄기
  if((fx.kind==="에고"||fx.kind==="특색 심사") && age<3){ for(let i=0;i<14;i++){ const x=W/2+(Math.sin(i*13.7)*W*0.25); const a=(1-age/3)*0.35; cx.fillStyle=`rgba(255,240,200,${a})`; cx.fillRect(x,0,2*devicePixelRatio,H*(0.4+0.6*((i*7)%5)/5)); } }
  // 흉터: 붉은 사선
  if(fx.kind==="흉터" && age<2.5){ cx.strokeStyle=`rgba(201,74,74,${0.8*(1-age/2.5)})`; cx.lineWidth=4*devicePixelRatio; cx.beginPath(); const p=Math.min(1,age/0.4); cx.moveTo(W*0.3,H*0.2); cx.lineTo(W*0.3+W*0.4*p,H*0.2+H*0.6*p); cx.stroke(); }
  // 실패 시 어두워짐
  if(fx.good===false && age<1.5 && fx.kind!=="흉터"){ cx.fillStyle=`rgba(0,0,0,${0.35*(1-age/1.5)})`; cx.fillRect(0,0,W,H); }

/* ================= 의뢰 수행 연출 ================= */
// 장면은 CSS 픽셀 좌표로 그린다. opt: {attr, success, team:[이름], kind}
let scene = null;
function playScene(kind, opt){
  return new Promise(res=>{
    const sc = SCENES[kind];
    if(scene) endScene();
    if(!cx || !sc){ res(); return; }
    scene = {kind, opt, sc, t0: performance.now(), res, st: sc.init ? sc.init(opt) : {}};
    const t=document.getElementById("capt"), s=document.getElementById("caps"); if(t){ t.textContent=""; s.textContent=""; }
  });
}
function endScene(){ if(!scene) return; const r = scene.res; scene = null; r(); }
function drawScene(now){
  const d = devicePixelRatio, W = cv.width/d, H = cv.height/d, t = (now-scene.t0)/1000;
  if(t > scene.sc.dur){ endScene(); return false; }
  cx.save(); cx.setTransform(d,0,0,d,0,0);
  const sh = scene.st.shake || 0;
  if(sh>0.01){ cx.translate((Math.random()-0.5)*sh, (Math.random()-0.5)*sh); scene.st.shake *= 0.86; }
  scene.sc.draw(cx, t, W, H, scene.opt, scene.st);
  // 시작·끝 페이드
  const fin = Math.min(1, t/0.35), fout = Math.min(1, (scene.sc.dur - t)/0.4);
  const k = Math.min(fin, fout); if(k<1){ cx.fillStyle=`rgba(0,0,0,${1-k})`; cx.fillRect(-20,-20,W+40,H+40); }
  cx.restore();
  return true;
}
const ease = x => x<0?0:x>1?1:1-Math.pow(1-x,3);
const lerp = (a,b,k) => a+(b-a)*k;
const seg = (t,a,b) => clamp((t-a)/(b-a),0,1);

/* ---- 공통: 뒷골목 거리(측면 2.5D) ---- */
function streetBG(c, W, H, t, st, tint){
  const gy = H*0.8;
  if(!st.bg){
    const R=(a,b)=>a+Math.random()*(b-a), fac=[]; let x=-20;
    while(x<W+40){ const w=R(70,150), h=R(H*0.45,H*0.78), wins=[];
      for(let wy=10; wy<h-H*0.22; wy+=13) for(let wx=8; wx<w-10; wx+=13) if(Math.random()<0.3) wins.push([wx,wy,Math.random()]);
      fac.push({x,w,h,wins,shutter:Math.random()<0.6,sign:Math.random()<0.5?{c:pick(["#ff5a5a","#5ad1ff","#ffd35a","#9b7bff"]),t:pick(["수리","전당포","국밥","24시","당구","약국"]),fl:Math.random()}:null}); x+=w+R(2,10); }
    const far=[]; x=-20; while(x<W+40){ const w=R(40,90), h=R(H*0.6,H*0.95); far.push({x,w,h}); x+=w+R(0,20); }
    st.bg = {fac, far, rain: Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,v:R(5,9)}))};
  }
  const bg = st.bg;
  let g = c.createLinearGradient(0,0,0,H); g.addColorStop(0,"#07070c"); g.addColorStop(1,"#17131b"); c.fillStyle=g; c.fillRect(0,0,W,H);
  bg.far.forEach(b=>{ c.fillStyle="#101018"; c.fillRect(b.x, gy-b.h, b.w, b.h); });
  // 건물 정면
  bg.fac.forEach(f=>{
    const y = gy-f.h;
    c.fillStyle="#141219"; c.fillRect(f.x,y,f.w,f.h);
    c.fillStyle="#1c1922"; c.fillRect(f.x,y,f.w,3); c.fillRect(f.x+f.w-3,y,3,f.h);
    f.wins.forEach(w=>{ if(Math.sin(t*0.4+w[2]*30)<-0.8) return; c.fillStyle=`rgba(255,196,120,${0.18+0.35*w[2]})`; c.fillRect(f.x+w[0],y+w[1],6,8); });
    if(f.shutter){ const sx=f.x+f.w*0.15, sw=f.w*0.7, sy=gy-H*0.2; for(let k=0;k<H*0.2;k+=4){ c.fillStyle = k%8?"#1e1c23":"#25232b"; c.fillRect(sx,sy+k,sw,4);} }
    if(f.sign){ const on = Math.sin(t*15+f.sign.fl*40)>-0.85; c.save(); c.font=`700 11px "Noto Sans KR",sans-serif`; c.textAlign="center"; c.textBaseline="middle";
      const tw=c.measureText(f.sign.t).width+12, sx=f.x+f.w/2, sy=gy-H*0.27; c.fillStyle="#0b0a0e"; c.fillRect(sx-tw/2,sy-8,tw,16);
      c.strokeStyle=on?f.sign.c:"#333"; c.strokeRect(sx-tw/2,sy-8,tw,16); c.shadowColor=f.sign.c; c.shadowBlur=on?12:0; c.fillStyle=on?f.sign.c:"#333"; c.fillText(f.sign.t,sx,sy+1); c.restore(); }
  });
  // 바닥: 원근 이음매 + 젖은 반사
  g = c.createLinearGradient(0,gy,0,H); g.addColorStop(0,"#121016"); g.addColorStop(1,"#09080b"); c.fillStyle=g; c.fillRect(0,gy,W,H-gy);
  c.strokeStyle="rgba(255,255,255,0.05)"; c.lineWidth=1;
  for(let i=-12;i<=12;i++){ c.beginPath(); c.moveTo(W/2+i*W*0.02, gy); c.lineTo(W/2+i*W*0.12, H); c.stroke(); }
  for(let k=1;k<5;k++){ const yy = gy + (H-gy)*Math.pow(k/5,1.6); c.beginPath(); c.moveTo(0,yy); c.lineTo(W,yy); c.stroke(); }
  bg.fac.forEach(f=>{ if(!f.sign) return; const sx=f.x+f.w/2; const rg=c.createLinearGradient(0,gy,0,H); rg.addColorStop(0,f.sign.c+"30"); rg.addColorStop(1,"transparent"); c.fillStyle=rg; c.fillRect(sx-14,gy+2,28,H-gy); });
  if(tint){ c.fillStyle=tint; c.fillRect(0,0,W,H); }

}
function rainFG(c, W, H, st, a=0.25){
  c.strokeStyle=`rgba(180,190,215,${a})`; c.lineWidth=1; c.beginPath();
  st.bg.rain.forEach(r=>{ r.y+=r.v; r.x-=r.v*0.15; if(r.y>H){ r.y=-10; r.x=Math.random()*W*1.1; } c.moveTo(r.x,r.y); c.lineTo(r.x+2,r.y-11); }); c.stroke();
}
function vignette(c,W,H,color="rgba(0,0,0,0.7)"){ const v=c.createRadialGradient(W/2,H*0.55,H*0.4,W/2,H*0.55,W*0.6); v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,color); c.fillStyle=v; c.fillRect(0,0,W,H); }

/* ---- 공통: 단순 실루엣(머리 + 몸통) ---- */
function fig(c, x, gy, h, o={}){
  c.save(); c.translate(x, gy); if(o.rot) c.rotate(o.rot); if(o.alpha!=null) c.globalAlpha = o.alpha;
  const col = o.color || "#050507";
  c.fillStyle = col;

  c.beginPath(); c.moveTo(-h*0.17, -h*0.88); c.lineTo(h*0.17, -h*0.88); c.lineTo(h*(o.coat?0.27:0.22), 0); c.lineTo(-h*(o.coat?0.27:0.22), 0); c.closePath(); c.fill();
  const gr = o.gear, face = o.face||1;
  if(gr && gr.ego){ c.save(); c.globalCompositeOperation="lighter"; const ag=c.createRadialGradient(0,-h*0.5,0,0,-h*0.5,h*0.9); ag.addColorStop(0,"rgba(255,225,150,0.18)"); ag.addColorStop(1,"rgba(0,0,0,0)"); c.fillStyle=ag; c.fillRect(-h,-h*1.5,h*2,h*1.6); c.restore(); c.fillStyle=col; }
  if(gr && gr.armor){ c.fillRect(-h*0.24,-h*0.9,h*0.48,h*0.07); c.fillRect(-h*0.21,-h*0.6,h*0.42,h*0.05); }
  if(gr && gr.wtype) drawWeapon(c, h, face, gr.wtype, o.wRot, col);
  else if(o.weapon){ c.save(); c.translate(h*0.2*face, -h*0.55); c.rotate((o.wRot||0.5)*face); c.fillRect(-1.2,0,2.4,h*0.6); c.restore(); }
  if(gr && gr.acc){ c.save(); c.globalCompositeOperation="lighter"; const pulse=0.6+0.4*Math.sin(performance.now()/300); c.fillStyle=`rgba(${gr.accColor||"150,230,255"},${0.9*pulse})`; c.shadowColor=`rgb(${gr.accColor||"150,230,255"})`; c.shadowBlur=8; c.beginPath(); c.arc(face*h*0.05,-h*0.72,1.8,0,7); c.fill(); c.restore(); c.fillStyle=col; }
  if(o.rim){ c.strokeStyle=(gr && gr.armor) ? o.rim.replace(/[\d.]+\)$/,"0.95)") : o.rim; c.lineWidth=(gr && gr.armor)?1.6:1.2; c.beginPath(); c.arc(0,-h-2,h*0.12,(o.face||1)>0?-1.2:2.0,(o.face||1)>0?0.9:4.2); c.stroke();
    c.beginPath(); const sx=(o.face||1)*h*0.17; c.moveTo(sx,-h*0.88); c.lineTo((o.face||1)*h*(o.coat?0.27:0.22),0); c.stroke(); }
  c.restore();
}
// 무기 모양: 칼날 / 둔기 / 총 / 창 / 대검 / 드릴 / 공구
function drawWeapon(c, h, face, wt, wRot, col){
  c.save(); c.translate(h*0.2*face, -h*0.55); c.rotate((wRot==null?0.5:wRot)*face); c.fillStyle=col;
  const L = h*0.62;
  if(wt==="blade"){ c.fillRect(-1,0,2,h*0.1); c.fillRect(-4,h*0.1,8,2); c.beginPath(); c.moveTo(-1.6,h*0.12); c.lineTo(1.6,h*0.12); c.lineTo(0.6,L); c.lineTo(-0.4,L+4); c.closePath(); c.fill();
    c.strokeStyle="rgba(220,230,255,0.35)"; c.lineWidth=0.8; c.beginPath(); c.moveTo(1.2,h*0.14); c.lineTo(0.5,L); c.stroke(); }
  else if(wt==="great"){ c.fillRect(-1.5,0,3,h*0.14); c.fillRect(-6,h*0.14,12,3); c.beginPath(); c.moveTo(-3.5,h*0.17); c.lineTo(3.5,h*0.17); c.lineTo(3,L*1.25); c.lineTo(0,L*1.25+6); c.lineTo(-3,L*1.25); c.closePath(); c.fill();
    c.strokeStyle="rgba(220,230,255,0.3)"; c.lineWidth=1; c.beginPath(); c.moveTo(2.6,h*0.2); c.lineTo(2.4,L*1.2); c.stroke(); }
  else if(wt==="blunt"){ c.fillRect(-1.2,0,2.4,L*0.8); c.fillRect(-5,L*0.78,10,h*0.14); }
  else if(wt==="gun"){ c.rotate(-(wRot==null?0.5:wRot)*face); c.fillRect(-1.5,0,3,h*0.13); c.fillRect(face>0?-1.5:-h*0.3+1.5, -1.5, h*0.3, 3.4); }
  else if(wt==="spear"){ c.fillRect(-1,-L*0.3,2,L*1.5); c.beginPath(); c.moveTo(-3,L*1.2); c.lineTo(3,L*1.2); c.lineTo(0,L*1.2+10); c.closePath(); c.fill(); }
  else if(wt==="drill"){ c.fillRect(-3,0,6,h*0.18); c.beginPath(); c.moveTo(-5,h*0.18); c.lineTo(5,h*0.18); c.lineTo(0,L+4); c.closePath(); c.fill();
    c.strokeStyle="rgba(200,200,210,0.3)"; c.lineWidth=0.8; for(let k=0;k<4;k++){ const yy=h*0.22+k*(L-h*0.18)/4; c.beginPath(); c.moveTo(-4+k,yy); c.lineTo(4-k,yy+4); c.stroke(); } }
  else if(wt==="tool"){ c.fillRect(-1.2,0,2.4,L*0.7); c.beginPath(); c.arc(0,L*0.72,4,0.3,Math.PI*2-0.3); c.lineWidth=2.4; c.strokeStyle=col; c.stroke(); }
  c.restore();
}
// 타격 순간 무기 종류에 따른 추가 효과(t0부터 약 0.6초)
function weaponFx(c, st, o, t, t0, fromX, fromY, x, y){
  const g = o.lead; if(!g || !g.wtype || t<t0-0.35 || t>t0+0.7) return;
  const k = seg(t, t0, t0+0.6), key = "wfx"+t0;
  c.save(); c.globalCompositeOperation="lighter";
  if(g.wtype==="blade" || g.wtype==="great"){ const big = g.wtype==="great" ? 1.6 : 1;
    if(t>=t0){ c.strokeStyle=`rgba(235,240,255,${0.9*(1-k)})`; c.shadowColor="#dfe8ff"; c.shadowBlur=14; c.lineWidth=(3*big)*(1-k)+0.5;
      c.beginPath(); c.moveTo(x-28*big, y-22*big); c.lineTo(x+28*big, y+18*big); c.stroke(); c.beginPath(); c.moveTo(x-24*big, y+16*big); c.lineTo(x+20*big, y-20*big); c.stroke(); } }
  else if(g.wtype==="blunt"){ if(t>=t0){ if(!st[key]){ st[key]=1; st.shake=(st.shake||0)+6; }
      c.strokeStyle=`rgba(255,190,120,${0.7*(1-k)})`; c.lineWidth=5*(1-k)+1; c.beginPath(); c.arc(x, y, 8+k*40, 0, 7); c.stroke(); } }
  else if(g.wtype==="gun"){ [0,0.1,0.2].forEach((dl,i)=>{ const ts=t0-0.3+dl; if(t>ts && t<ts+0.12){ c.fillStyle="rgba(255,220,140,0.95)"; c.shadowColor="#ffcc66"; c.shadowBlur=16; c.beginPath(); c.arc(fromX, fromY, 5, 0, 7); c.fill();
      c.strokeStyle="rgba(255,230,170,0.8)"; c.lineWidth=1.2; c.beginPath(); c.moveTo(fromX, fromY); c.lineTo(x, y+(i-1)*6); c.stroke(); } }); }
  else if(g.wtype==="spear"){ if(t>=t0){ const len = 60*(1-k)+20; c.strokeStyle=`rgba(220,240,255,${0.9*(1-k)})`; c.shadowColor="#cfe8ff"; c.shadowBlur=12; c.lineWidth=2.5;
      c.beginPath(); c.moveTo(x-len, y); c.lineTo(x+18, y); c.stroke(); c.beginPath(); c.arc(x+18, y, 6*(1-k)+2, 0, 7); c.stroke(); } }
  else if(g.wtype==="drill"){ if(t>=t0){ for(let i=0;i<14;i++){ const a=i/14*Math.PI*2 + t*20, r=6+k*26; c.fillStyle=`rgba(255,${180+i*4},100,${0.9*(1-k)})`; c.fillRect(x+Math.cos(a)*r, y+Math.sin(a)*r*0.6, 2, 2); } } }
  c.restore();
}
function armorFx(c, o, t, t0, x, y){ const g=o.lead; if(!g || !g.armor || t<t0 || t>t0+0.5) return; const k=seg(t,t0,t0+0.5);
  c.save(); c.globalCompositeOperation="lighter"; c.strokeStyle=`rgba(150,200,255,${0.8*(1-k)})`; c.lineWidth=1.5; c.shadowColor="#9fc8ff"; c.shadowBlur=10;
  for(let i=0;i<6;i++){ const a=i/6*Math.PI*2+Math.PI/6; if(i===0) c.beginPath(); c.lineTo(x+Math.cos(a)*(12+k*10), y+Math.sin(a)*(12+k*10)); } c.closePath(); c.stroke(); c.restore(); }
function sparks(st, x, y, n, color, spd=4, life=0.8, grav=0.15){
  st.parts = st.parts||[];
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=spd*(0.4+Math.random()); st.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,l:life*(0.6+Math.random()*0.6),t:0,color,g:grav,s:1+Math.random()*1.8}); }
}
function drawParts(c, st, dt=1/60){
  if(!st.parts) return;
  st.parts = st.parts.filter(p=>{ p.t+=dt; if(p.t>p.l) return false; p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vx*=0.98;
    c.globalAlpha = 1-p.t/p.l; c.fillStyle=p.color; c.fillRect(p.x,p.y,p.s,p.s); c.globalAlpha=1; return true; });
}
function banner(c, W, H, t, t0, t1, text, color, sub){
  const k = ease(seg(t,t0,t0+0.4)) * (1-seg(t,t1,t1+0.35)); if(k<=0) return;
  c.save(); c.globalAlpha=k; c.textAlign="center"; c.textBaseline="middle";
  const y = H*0.2; const bw = W*0.36*k;
  const g = c.createLinearGradient(W/2-bw,0,W/2+bw,0); g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(0.5,"rgba(0,0,0,0.7)"); g.addColorStop(1,"rgba(0,0,0,0)");
  c.fillStyle=g; c.fillRect(W/2-bw, y-20, bw*2, sub?50:40);
  c.font=`800 22px "Noto Sans KR",sans-serif`; c.shadowColor=color; c.shadowBlur=18; c.fillStyle=color; c.fillText(text, W/2, y);
  if(sub){ c.shadowBlur=0; c.font=`400 12px "Noto Sans KR",sans-serif`; c.fillStyle="#cfc8bb"; c.fillText(sub, W/2, y+20); }
  c.restore();
}

const SCENES = {};
/* ---- 일반 의뢰 ----
   원작 협회들의 전문 분야를 참고해 속성마다 다른 장면으로 만든다.
   물리(리우·외피 결): 은신처 셔터를 정면으로 부수고 쏟아지는 무리를 제압
   속도(데뱌트·시 결): 마감 시계가 도는 동안 옥상을 건너뛰며 표적을 추격
   정밀(세븐 결): 어두운 현장을 손전등으로 훑어 단서를 찾고 실로 이어 보고서를 완성 */
SCENES["일반"] = {
  dur: 4.6,
  init(o){ return {}; },
  draw(c, t, W, H, o, st){
    const f = {str: genBreach, agi: genChase, tec: genInvestigate}[o.attr] || genBreach;
    f(c, t, W, H, o, st);
    const label = {str:"물리 · 정면 돌파", agi:"속도 · 추격", tec:"정밀 · 현장 조사"}[o.attr] || "";
    banner(c, W, H, t, 0.2, 1.1, `일반 의뢰 · ${label}`, "#c9a86a", o.client||"");
    if(t>3.25) banner(c, W, H, t, 3.25, 99, o.success?"의뢰 성공":"의뢰 실패", o.success?"#f2d27a":"#ff6a6a", o.team.join(" · "));
  }
};

/* 물리: 정면 돌파 */
function genBreach(c, t, W, H, o, st){
  const gy = streetBG(c, W, H, t, st), ok = o.success;
  const n = Math.max(1, Math.min(5, o.team.length)), fh = Math.min(H*0.32, 58);
  // 은신처 건물과 셔터
  const hx = W*0.66, hw = W*0.22, sh = fh*1.5, sx = hx + hw*0.18, sw = hw*0.64, sy = gy - sh;
  c.fillStyle="#0f0d12"; c.fillRect(hx, gy-H*0.72, hw, H*0.72);
  c.fillStyle="#191620"; c.fillRect(hx, gy-H*0.72, hw, 4);
  c.save(); c.font=`800 10px "Noto Sans KR",sans-serif`; c.fillStyle="rgba(200,60,60,0.55)"; c.translate(hx+hw*0.5, sy-14); c.rotate(-0.06); c.textAlign="center"; c.fillText("출입 금지", 0, 0); c.restore();
  const hit = 1.55;
  const breakK = ok ? ease(seg(t, hit, hit+0.35)) : 0;
  // 셔터 조각: 성공이면 안쪽으로 휘며 위쪽부터 떨어져 나간다
  for(let k=0; k<sh; k+=5){
    const row = k/sh; let bend = 0, drop = 0, a = 1;
    if(ok && t>hit){ bend = Math.sin(row*Math.PI)*22*breakK; drop = breakK*row*row*30; a = 1-seg(t, hit+0.2, hit+0.9)*row; }
    if(!ok && t>hit && t<hit+0.25){ bend = Math.sin(row*Math.PI)*4*(1-seg(t,hit,hit+0.25)); }
    c.globalAlpha = a; c.fillStyle = (k/5)%2 ? "#2a2830" : "#34323b";
    c.beginPath(); c.moveTo(sx, sy+k+drop); c.quadraticCurveTo(sx+sw/2+bend, sy+k+drop+bend*0.3, sx+sw, sy+k+drop); c.lineTo(sx+sw, sy+k+5+drop); c.quadraticCurveTo(sx+sw/2+bend, sy+k+5+drop+bend*0.3, sx, sy+k+5+drop); c.closePath(); c.fill();
  }
  c.globalAlpha = 1;
  // 셔터 안쪽 붉은 불빛

/* 속도: 마감 시계가 도는 옥상 추격 */

    c.fillStyle="#0c0b10"; c.fillRect(x, top, r.w, H-top); c.fillStyle="#1d1a23"; c.fillRect(x, top, r.w, 3);
    for(let k=8;k<r.w-8;k+=22){ c.fillStyle="#0a090d"; c.fillRect(x+k, top-7, 2, 7); } c.fillStyle="#0a090d"; c.fillRect(x+4, top-8, r.w-8, 1.5);
    if(r.tank){ c.fillStyle="#0c0b10"; c.fillRect(x+r.w*0.6, top-26, 26, 26); c.fillRect(x+r.w*0.6+4, top-32, 18, 6); }

/* 정밀: 현장 조사와 보고서 */

  let g=c.createLinearGradient(0,0,0,fy); g.addColorStop(0,"#0f0d13"); g.addColorStop(1,"#17141c"); c.fillStyle=g; c.fillRect(0,0,W,fy);
  for(let x=0;x<W;x+=18){ c.fillStyle = (x/18)%2 ? "rgba(255,255,255,0.012)" : "rgba(0,0,0,0.05)"; c.fillRect(x,0,18,fy); }
  g=c.createLinearGradient(0,fy,0,H); g.addColorStop(0,"#141118"); g.addColorStop(1,"#0a090c"); c.fillStyle=g; c.fillRect(0,fy,W,H-fy);
  c.strokeStyle="rgba(255,255,255,0.04)"; for(let i=-14;i<=14;i++){ c.beginPath(); c.moveTo(W/2+i*W*0.035, fy); c.lineTo(W/2+i*W*0.11, H); c.stroke(); }
  const wx=W*0.82, wy=H*0.12, ww=W*0.08, wh=H*0.38; c.fillStyle="#1a2030"; c.fillRect(wx,wy,ww,wh); c.fillStyle="#0e0c12"; c.fillRect(wx+ww/2-1,wy,2,wh); c.fillRect(wx,wy+wh/2-1,ww,2);

  c.fillStyle="#0b0a0e"; c.fillRect(W*0.55, fy-H*0.2, W*0.14, H*0.04); c.fillRect(W*0.56, fy-H*0.16, 4, H*0.16); c.fillRect(W*0.68-4, fy-H*0.16, 4, H*0.16);
  c.save(); c.translate(W*0.48, fy); c.rotate(-1.3); c.fillRect(0,-3,H*0.16,4); c.fillRect(H*0.08,-3,3,-H*0.07); c.restore();
  c.fillRect(W*0.92, fy-H*0.5, W*0.06, H*0.5);
  // 조사 보드(가운데 위)

  // 어두움
  c.fillStyle="rgba(0,0,0,0.55)"; c.fillRect(0,0,W,H);
  // 해결사들(왼쪽), 대표가 손전등을 든다
  const n = Math.max(1, Math.min(5, o.team.length)), fh = Math.min(H*0.34, 60);
  const walk = ease(seg(t,0.1,0.8)), lx = lerp(-W*0.04, W*0.17, walk);
  // 손전등 빛줄기: 단서를 차례로 훑는다

  st.clues.forEach(cl=>{ if(t>cl.ts-0.25) aim = cl; });
  const tgt = (!ok && t>2.55) ? {x: W*0.86, y: H*0.6} : aim;
  st.ax = st.ax==null ? tgt.x : lerp(st.ax, tgt.x, 0.12); st.ay = st.ay==null ? tgt.y : lerp(st.ay, tgt.y, 0.12);
  const ox = lx + fh*0.25, oy = fy - fh*0.62;
  let flick = 1; if(!ok && t>2.6) flick = Math.sin(t*50)>0.2 ? 0.25 : 1; if(!ok && t>3.0) flick = 0.05;
  if(t>0.6){ const ang=Math.atan2(st.ay-oy, st.ax-ox), len=Math.hypot(st.ax-ox, st.ay-oy)+40;
    c.save(); c.globalCompositeOperation="lighter"; const lg=c.createRadialGradient(ox,oy,0,ox,oy,len); lg.addColorStop(0,`rgba(255,235,190,${0.28*flick})`); lg.addColorStop(0.7,`rgba(255,235,190,${0.08*flick})`); lg.addColorStop(1,"rgba(255,235,190,0)");
    c.fillStyle=lg; c.beginPath(); c.moveTo(ox,oy); c.lineTo(ox+Math.cos(ang-0.09)*len, oy+Math.sin(ang-0.09)*len); c.lineTo(ox+Math.cos(ang+0.09)*len, oy+Math.sin(ang+0.09)*len); c.fill();
    const sp=c.createRadialGradient(st.ax,st.ay,0,st.ax,st.ay,36); sp.addColorStop(0,`rgba(255,240,200,${0.4*flick})`); sp.addColorStop(1,"rgba(0,0,0,0)"); c.fillStyle=sp; c.fillRect(st.ax-40,st.ay-40,80,80); c.restore(); }
  for(let i=n-1;i>=0;i--) fig(c, i===0?lx:lx-i*fh*0.42, fy, fh*(i===0?1:0.94), {face:1, coat:i===0, gear:i===0?o.lead:null, color:"#0d0b10", rim:"rgba(255,215,160,0.75)"});
